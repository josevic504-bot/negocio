name: Actualizar Tiendas Catrachas
on:
  schedule:
    - cron: '17,47 * * * *'   # cada 30 minutos
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node generar.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico
      - uses: actions/deploy-pages@v4
