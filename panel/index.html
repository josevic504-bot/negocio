<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b14">
<title>Panel Molina</title>
<link rel="manifest" href="../panel.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Molina">
<meta name="mobile-web-app-capable" content="yes">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a0b14;color:#d9b8cc;font-family:system-ui,sans-serif;font-size:14px}</style>
</head>
<body>
<div id="cargando">Abriendo el Panel Molina…</div>
<script>
/* Panel Molina como app aparte.
   Vive en su propia carpeta (/panel/) para que Chrome lo instale como una app distinta de Negocio VM
   (Chrome no deja instalar dos apps en el mismo ámbito). Carga la misma index.html de la app
   (siempre actualizada, sin copias) y la abre en modo panel. */
(async () => {
  try {
    if (!location.search.includes('panel')) history.replaceState(null, '', location.pathname + '?panel');
    const r = await fetch('../index.html?v=' + Date.now(), { cache: 'no-store' });
    let h = await r.text();
    h = h.replace('<head>', '<head><base href="../">')
         .replace('<link rel="manifest" href="manifest.json">', '<link rel="manifest" href="panel.webmanifest">')
         .replace("navigator.serviceWorker.register('sw.js')", "navigator.serviceWorker.register('sw.js', { scope: './' })");
    document.open(); document.write(h); document.close();
  } catch (e) {
    document.getElementById('cargando').innerHTML = 'No se pudo abrir el panel. Revisa tu conexión e inténtalo de nuevo.<br><br><a href="../?panel" style="color:#fff">Abrir el panel en el navegador</a>';
  }
})();
</script>
</body>
</html>
