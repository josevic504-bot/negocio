<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a0b14">
<title>Panel Molina</title>
<link rel="manifest" href="panel.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Panel Molina">
<meta name="mobile-web-app-capable" content="yes">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1a0b14;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .c{padding:32px 24px;max-width:360px}
  img{width:96px;height:96px;border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  h1{font-size:26px;margin:18px 0 6px}
  p{color:#d9b8cc;font-size:14px;line-height:1.5;margin:0 0 22px}
  a.b{display:block;padding:15px;border-radius:14px;background:#d10f6f;color:#fff;font-weight:700;text-decoration:none;font-size:16px}
  small{display:block;margin-top:16px;color:#9d7a8f;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="c">
  <img src="icon-192.png" alt="">
  <h1>Panel Molina</h1>
  <p>Administración de clientes de Gestión de Negocio VM.</p>
  <a class="b" href="./?panel">Entrar al panel</a>
  <small>Para tenerlo como app: menú de Chrome → <b>Instalar aplicación</b> (o «Agregar a pantalla de inicio»). Desde ese ícono abre directo aquí.</small>
</div>
<script>
  // Si ya está instalado como app, entra directo al panel sin mostrar esta pantalla.
  if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) location.replace('./?panel');
</script>
</body>
</html>
