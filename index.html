S.cb = null;  // datos del período cargado { desde, hasta, plan, mapeo, config, asientos, saldosIniciales, cobrar, pagar, concil, cerrado }
const CB_TIPOS = { activo: 'Activo', pasivo: 'Pasivo', capital: 'Capital', ingreso: 'Ingresos', costo: 'Costos', gasto: 'Gastos' };
const CB_TABS = [['inicio', 'Inicio'], ['diario', 'Diario'], ['mayor', 'Mayor'], ['balanza', 'Balanza'], ['resultados', 'Resultados'], ['balance', 'Balance'], ['auxiliares', 'Auxiliares'], ['concil', 'Banco'], ['plan', 'Cuentas'], ['paquete', 'Paquete']];
const cbMes = () => S.f.cbmes || hoy().slice(0, 7);
const cbTab = () => S.f.cbtab || 'inicio';
const cbCta = c => { const p = S.cb && S.cb.plan.find(x => x.codigo === String(c)); return p || { codigo: String(c), nombre: 'Cuenta ' + c, tipo: 'gasto', naturaleza: 'deudora' }; };
const cbNom = c => { const p = cbCta(c); return p.codigo + ' ' + p.nombre; };
const cbFin = ym => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)), 0); return toLocal(d).slice(0, 10); };
const cbVig = () => S.cb.asientos.filter(a => !a.anulado);

// Carga el mes elegido (se guarda en S.cb). force=true vuelve a pedir al servidor.
async function cbCargar(force) {
  const mes = cbMes();
  if (!force && S.cb && S.cb.desde === mes + '-01') return S.cb;
  S.cb = await api('contabilidad', { desde: mes + '-01', hasta: cbFin(mes) }, true);
  return S.cb;
}

// Saldos: ini = antes del período, debe/haber = movimiento del período, fin = ini + debe − haber (signo deudor).
function cbSaldos() {
  const s = {};
  const get = c => s[c] || (s[c] = { codigo: c, ini: 0, debe: 0, haber: 0, fin: 0 });
  Object.keys(S.cb.saldosIniciales).forEach(c => { get(c).ini = S.cb.saldosIniciales[c]; });
  cbVig().forEach(a => a.lineas.forEach(l => { const o = get(l.cuenta); o.debe = r2(o.debe + l.debe); o.haber = r2(o.haber + l.haber); }));
  Object.values(s).forEach(o => { o.fin = r2(o.ini + o.debe - o.haber); });
  return s;
}
// Utilidad (ingresos − costos − gastos) de un conjunto de asientos.
function cbUtilidad(asientos) {
  let ing = 0, cos = 0, gas = 0;
  asientos.forEach(a => { if (a.anulado) return; a.lineas.forEach(l => { const t = cbCta(l.cuenta).tipo; if (t === 'ingreso') ing += l.haber - l.debe; else if (t === 'costo') cos += l.debe - l.haber; else if (t === 'gasto') gas += l.debe - l.haber; }); });
  return { ingresos: r2(ing), costos: r2(cos), gastos: r2(gas), utilidad: r2(ing - cos - gas) };
}
function cbResultadoAcum() { // resultado acumulado de ejercicios anteriores (según saldos iniciales de cuentas 4/5/6)
  let u = 0; Object.keys(S.cb.saldosIniciales).forEach(c => { const t = cbCta(c).tipo; if (t === 'ingreso') u -= S.cb.saldosIniciales[c]; else if (t === 'costo' || t === 'gasto') u -= S.cb.saldosIniciales[c]; }); // ingresos acreedores (−) y costos deudores (+) ⇒ u = −Σsaldo
  return r2(u);
}

  ({ inicio: cbInicio, diario: cbDiario, mayor: cbMayor, balanza: cbBalanza, resultados: cbResultados, balance: cbBalance, auxiliares: cbAuxiliares, concil: cbConcil, plan: cbPlan, paquete: cbPaquete })[tab]();
};
ACC.cbTab = el => { S.f.cbtab = el.dataset.k; pintarHeader(); R.contabilidad().catch(err); };
ACC.cbMes = () => {};
ACC.cbCSV = () => { if (S.repCSV) S.repCSV(); else toast('Esta pestaña no tiene descarga', 'error'); };

/* ---------- Inicio ---------- */
function cbInicio() {
  const u = cbUtilidad(S.cb.asientos), n = cbVig().length, manuales = cbVig().filter(a => !a.auto).length;
  const sinCuenta = cbVig().filter(a => a.lineas.some(l => !S.cb.plan.find(p => p.codigo === l.cuenta))).length;
  const isv = cbSaldos();
  const isvPag = (isv[S.cb.mapeo.isvPagar] || { haber: 0, debe: 0 }), isvCred = (isv[S.cb.mapeo.isvCredito] || { debe: 0, haber: 0 });
  const vencidas = S.cb.cobrar.filter(c => c.a60 + c.a90 + c.mas > 0.004).length;
  const concilOk = S.cb.concil && S.cb.concil.listo;
  const link = (t, s, tab, badge) => `<button class="li" data-a="cbTab" data-k="${tab}"><div class="tx"><b>${t}</b><small>${s}</small></div>${badge || `<span class="am">${ic('arrow', 18)}</span>`}</button>`;
  $('#cb').innerHTML = `
    <div class="kpis"><div class="kpi" style="--k:var(--ok)"><small>Utilidad del mes</small><b class="n ${u.utilidad < 0 ? 'neg' : ''}">${money(u.utilidad)}</b></div><div class="kpi"><small>Asientos</small><b class="n">${n}</b><small>${manuales} manuales</small></div></div>
    ${S.cb.aperturaHecha ? `<p class="mut" style="font-size:12px;margin:4px 0 8px">Contabilidad desde el ${fFecha(S.cb.inicio)} (fecha de la apertura). Lo anterior a esa fecha está resumido en los saldos iniciales.</p>` : ''}
    ${!S.cb.aperturaHecha ? `<div class="aviso info">${ic('info', 18)} Aún no hay <b>saldos de apertura</b> (caja, banco, inventario, deudas, capital). Sin ellos el balance general no cuadra. <button class="btn sm" data-a="cbApertura">Registrar apertura</button></div>` : ''}
    ${sinCuenta ? `<div class="aviso bad">${ic('alert', 18)} ${sinCuenta} asiento(s) usan una cuenta que no existe en el plan. Revisa el mapeo.</div>` : ''}
    <div class="sec-t">Libros</div><div class="list">
      ${link('Libro diario', 'Cada venta, compra, gasto, cobro y pago con su partida', 'diario')}${link('Libro mayor', 'Movimientos y saldo por cuenta', 'mayor')}${link('Balanza de comprobación', 'Saldos iniciales, movimientos y finales', 'balanza')}${link('Catálogo y mapeo de cuentas', 'Plan de cuentas y a dónde va cada movimiento', 'plan')}
    </div>
    <div class="sec-t">Control</div><div class="list">
      ${link('Auxiliares CxC / CxP', 'Quién debe y a quién se debe, con antigüedad', 'auxiliares', vencidas ? `<span class="badge b-bad">${vencidas} vencidas</span>` : '')}
      ${link('Conciliación bancaria', 'Libros vs. estado de cuenta', 'concil', concilOk ? '<span class="badge b-ok">Lista</span>' : '<span class="badge b-warn">Pendiente</span>')}
      ${link('ISV del mes', 'Cobrado en ventas menos pagado en compras y gastos', 'balanza', `<span class="am n">${money(r2(isvPag.haber - isvPag.debe - (isvCred.debe - isvCred.haber)))}</span>`)}
    </div>
    <div class="sec-t">Estados financieros</div><div class="list">${link('Estado de resultados', 'Ingresos, costos y gastos del período', 'resultados')}${link('Balance general', 'Activo, pasivo y capital a la fecha', 'balance')}</div>
    <div class="row" style="margin-top:14px"><button class="btn pri grow" data-a="cbTab" data-k="paquete">${ic('send', 18)} Paquete para el contador</button>${cbMes() < hoy().slice(0, 7) && !(S.cb.cerrado && cbMes() <= S.cb.cerrado) ? `<button class="btn" data-a="cbCerrar">${ic('lock', 18)} Cerrar mes</button>` : ''}</div>
    <p class="mut" style="font-size:12px;margin-top:12px">Los registros son para el control interno del negocio. Las declaraciones ante el SAR las prepara tu contador con este paquete.</p>`;
}
ACC.cbCerrar = async () => {
  const mes = cbMes();
  if (!await confirmar(`¿Cerrar ${fMes(mes)}? Ya no se podrán registrar ni anular asientos manuales con fecha de ese mes (las operaciones del negocio siguen igual).`, { si: 'Cerrar mes' })) return;
  try { const r = await api('cerrarPeriodo', { mes }); S.cb.cerrado = r.cerrado; toast('Mes cerrado', 'ok'); R.contabilidad(); } catch (e) { err(e); }
};

/* ---------- Diario ---------- */
const CB_ICON = { venta: 'cart', cobro: 'cash', compra: 'truck', pago: 'wallet', gasto: 'receipt', manual: 'edit', apertura: 'layers', ajuste: 'edit', concil: 'bank' };
function cbLineasHTML(L) {
  return `<div class="tabla cb-lin">${L.map(l => `<div class="tr"><span style="${l.haber > 0 ? 'padding-left:18px;color:var(--mut)' : ''}">${esc(cbNom(l.cuenta))}${l.detalle ? ` <small class="mut">· ${esc(l.detalle)}</small>` : ''}</span><span class="n">${l.debe > 0 ? money(l.debe) : ''}</span><span class="n">${l.haber > 0 ? money(l.haber) : ''}</span></div>`).join('')}</div>`;
}
function cbDiario() {
  const f = S.f.cbfil || 'todos';

  let debe = 0, haber = 0; cbVig().forEach(a => a.lineas.forEach(x => { debe += x.debe; haber += x.haber; }));
  const dias = {}; l.forEach(a => { (dias[a.fecha.slice(0, 10)] = dias[a.fecha.slice(0, 10)] || []).push(a); });
  $('#cb').innerHTML = `<div class="chips">${[['todos', 'Todos'], ['venta', 'Ventas'], ['compra', 'Compras'], ['gasto', 'Gastos'], ['cobro', 'Cobros'], ['pago', 'Pagos'], ['manual', 'Manuales']].map(([k, t]) => `<button class="chip ${f === k ? 'on' : ''}" data-a="cbFil" data-k="${k}">${t}</button>`).join('')}</div>
    ${!l.length ? '<div class="empty">Sin asientos en este período</div>' : Object.keys(dias).sort().reverse().map(d => `<div class="sec-t">${fFechaL(d)}</div><div class="list">${dias[d].sort((a, b) => a.fecha < b.fecha ? 1 : -1).map(a => `<div class="li ${a.anulado ? 'anul' : ''}" data-a="cbVerAsiento" data-id="${a.id}"><div class="av ${a.auto ? 't-verde' : 't-naranja'}">${ic(CB_ICON[a.tipo] || 'doc', 20)}</div><div class="tx"><b>${esc(a.concepto)}</b><small><span class="badge ${a.auto ? 'b-ok' : 'b-warn'}">${a.auto ? 'automático' : (a.tipo === 'apertura' ? 'apertura' : a.tipo === 'concil' ? 'conciliación' : 'manual')}</span>${a.numero ? ' · ' + a.numero : ''}${a.tercero ? ' · ' + esc(a.tercero) : ''}</small></div><div class="am n">${money(a.lineas.reduce((s, x) => s + x.debe, 0))}</div></div>`).join('')}</div>`).join('')}
    <div class="tot"><span>Debe ${money(r2(debe))}</span><span>Haber ${money(r2(haber))}</span></div>${Math.abs(debe - haber) > 0.01 ? `<div class="aviso bad">${ic('alert', 18)} El diario no cuadra. Revisa los asientos manuales.</div>` : ''}`;

}
ACC.cbFil = el => { S.f.cbfil = el.dataset.k; cbDiario(); };
ACC.cbVerAsiento = el => {
  const a = S.cb.asientos.find(x => x.id === el.dataset.id); if (!a) return;
  const puedeAnular = !a.auto && !a.anulado && !(S.cb.cerrado && a.fecha.slice(0, 7) <= S.cb.cerrado);
  const h = hoja({ titulo: a.numero || 'Asiento', html: `<p><b>${esc(a.concepto)}</b><br><small class="mut">${fFechaC(a.fecha)}${a.tercero ? ' · ' + esc(a.tercero) : ''}${a.anulado ? ' · <span class="badge b-bad">ANULADO</span>' : ''}</small></p>${cbLineasHTML(a.lineas)}
    ${a.auto ? `<p class="mut" style="font-size:12px">Partida generada desde la operación del negocio. Para corregirla, anula o edita la ${a.tipo} original en su módulo; el asiento se actualiza solo.</p>` : ''}` });
  const bt = [];
  if (a.auto && ['venta', 'compra', 'gasto'].includes(a.tipo)) bt.push({ t: 'Ver origen', fn: () => { h.cerrar(); ir(a.tipo === 'venta' ? 'ventas' : a.tipo === 'compra' ? 'compras' : 'gastos'); } });
  if (puedeAnular) bt.push({ t: 'Anular', cls: 'bad', fn: async () => { const mot = await pedirTexto('Motivo de la anulación', { label: 'Motivo' }); if (mot === null) return; await api('anularAsiento', { id: a.id, motivo: mot }); toast('Asiento anulado', 'ok'); h.cerrar(); await cbCargar(true); R.contabilidad(); } });

};

/* ---------- Asiento manual / apertura ---------- */
const CB_PLANTILLAS = {
  depreciacion: { concepto: 'Depreciación del mes', lineas: m => [[ '6106', 'debe'], ['1202', 'haber']] },
  retiro:       { concepto: 'Retiro del propietario', lineas: m => [['3103', 'debe'], [m.caja, 'haber']] },
  retencion:    { concepto: 'Retención ISR 1 % que me hizo un cliente', lineas: m => [[m.retFavor, 'debe'], [m.cxc, 'haber']] },
  prestamo:     { concepto: 'Préstamo recibido', lineas: m => [[m.banco, 'debe'], ['2104', 'haber']] },
  aporte:       { concepto: 'Aporte de capital', lineas: m => [[m.banco, 'debe'], [m.capital, 'haber']] },
  traslado:     { concepto: 'Depósito de caja a banco', lineas: m => [[m.banco, 'debe'], [m.caja, 'haber']] }
};
function cbSelectCta(val, extra) {
  // F18: la cuenta elegida aparece aunque esté inactiva (si no, al guardar se cambiaría sola por otra)
  const grupos = {}; S.cb.plan.filter(p => p.activo !== false || p.codigo === val).forEach(p => (grupos[p.tipo] = grupos[p.tipo] || []).push(p));
  return `<select class="cb-cta" ${extra || ''}>${Object.keys(CB_TIPOS).filter(t => grupos[t]).map(t => `<optgroup label="${CB_TIPOS[t]}">${grupos[t].map(p => `<option value="${p.codigo}" ${p.codigo === val ? 'selected' : ''}>${p.codigo} ${esc(p.nombre)}${p.activo === false ? ' (inactiva)' : ''}</option>`).join('')}</optgroup>`).join('')}</select>`;
}
function cbLineaForm(cta, debe, haber) {
  return `<div class="row cb-l" style="margin-bottom:6px;align-items:center">${cbSelectCta(cta, 'style="flex:1;min-width:0"')}<input type="number" step="0.01" min="0" class="cb-d n" placeholder="Debe" value="${debe || ''}" style="width:92px"><input type="number" step="0.01" min="0" class="cb-h n" placeholder="Haber" value="${haber || ''}" style="width:92px"><button class="btn icon ghost sm" data-cbquitar aria-label="Quitar">${ic('x', 16)}</button></div>`;
}
function cbFormAsiento(o) {
  o = o || {}; const m = S.cb.mapeo;
  const lineas = o.lineas || [[m.caja, '', ''], [m.ventas, '', '']];
  const h = hoja({ titulo: o.titulo || 'Asiento manual', ancho: true, html: `
    ${o.tipo === 'apertura' ? '' : `<label class="fld"><span>Plantilla</span><select id="cb-pl"><option value="">— Escribir desde cero —</option>${Object.keys(CB_PLANTILLAS).map(k => `<option value="${k}">${CB_PLANTILLAS[k].concepto}</option>`).join('')}</select></label>`}
    <div class="f2"><label class="fld"><span>Fecha</span><input type="date" id="cb-f" value="${o.fecha || hoy()}" max="${hoy()}"></label><label class="fld"><span>Referencia (opcional)</span><input id="cb-r" placeholder="Factura, recibo…" value="${esc(o.ref || '')}"></label></div>
    <label class="fld"><span>Concepto</span><input id="cb-c" value="${esc(o.concepto || '')}" placeholder="¿Qué registra este asiento?"></label>
    <div class="sec-t">Líneas <small class="mut">(cuenta · debe · haber)</small></div><div id="cb-ls">${lineas.map(l => cbLineaForm(l[0], l[1], l[2])).join('')}</div>
    <div class="row sp"><button class="btn sm" id="cb-add">${ic('plus', 16)} Línea</button><span id="cb-tot" class="mut n">Debe 0.00 · Haber 0.00</span></div>` });
  const tot = () => { let d = 0, hh = 0; $$('.cb-l', h.b).forEach(r => { d += num($('.cb-d', r).value); hh += num($('.cb-h', r).value); }); const t = $('#cb-tot', h.b); t.textContent = `Debe ${fmtN(d, 2)} · Haber ${fmtN(hh, 2)}`; t.className = 'n ' + (Math.abs(d - hh) > 0.005 ? 'neg' : 'pos'); };
  h.b.addEventListener('input', tot);
  h.b.addEventListener('click', e => { const q = e.target.closest('[data-cbquitar]'); if (q) { q.closest('.cb-l').remove(); tot(); } });
  $('#cb-add', h.b).onclick = () => { $('#cb-ls', h.b).insertAdjacentHTML('beforeend', cbLineaForm('', '', '')); };
  const pl = $('#cb-pl', h.b); if (pl) pl.onchange = () => { const p = CB_PLANTILLAS[pl.value]; if (!p) return; $('#cb-c', h.b).value = p.concepto; $('#cb-ls', h.b).innerHTML = p.lineas(m).map(l => cbLineaForm(l[0], '', '')).join(''); tot(); };
  tot();
  h.botones([{ t: o.tipo === 'apertura' ? 'Guardar apertura' : 'Guardar asiento', cls: 'pri', fn: async () => {
    const L = $$('.cb-l', h.b).map(r => ({ cuenta: $('.cb-cta', r).value, debe: num($('.cb-d', r).value), haber: num($('.cb-h', r).value) }));
    await api('guardarAsiento', { registro: { fecha: $('#cb-f', h.b).value, concepto: $('#cb-c', h.b).value, ref: $('#cb-r', h.b).value, tipo: o.tipo || 'manual', lineas: L } });
    toast('Asiento guardado', 'ok'); h.cerrar(); await cbCargar(true); R.contabilidad();
  } }]);
}
ACC.cbNuevoAsiento = () => cbFormAsiento();
ACC.cbApertura = () => {
  const m = S.cb.mapeo;
  hoja({ titulo: 'Saldos de apertura', html: `<p>Escribe lo que el negocio tenía el día que empezó a llevar contabilidad. El capital se calcula solo para que cuadre.</p>
    <div class="f2">${[['caja', 'Efectivo en caja'], ['banco', 'En el banco'], ['inventario', 'Inventario (al costo)'], ['1201', 'Equipo y mobiliario'], ['cxc', 'Clientes me deben'], ['cxp', 'Debo a proveedores'], ['2104', 'Préstamos pendientes']].map(([k, t]) => `<label class="fld"><span>${t}</span><input type="number" step="0.01" min="0" class="n" data-k="${k}" placeholder="0.00"></label>`).join('')}</div>
    <label class="fld"><span>Fecha de inicio</span><input type="date" id="ap-f" value="${cbMes()}-01" max="${hoy()}"></label>` }).botones([{ t: 'Revisar asiento', cls: 'pri', fn: (h) => {
      const v = {}; $$('[data-k]', h.b).forEach(i => { v[i.dataset.k] = num(i.value); });
      const cta = k => m[k] || k;
      const L = []; let act = 0, pas = 0;
      [['caja'], ['banco'], ['inventario'], ['1201'], ['cxc']].forEach(([k]) => { if (v[k] > 0) { L.push([cta(k), v[k], '']); act += v[k]; } });
      [['cxp'], ['2104']].forEach(([k]) => { if (v[k] > 0) { L.push([cta(k), '', v[k]]); pas += v[k]; } });
      const cap = r2(act - pas); if (cap >= 0) L.push([m.capital, '', cap]); else L.push([m.capital, -cap, '']);
      const f = $('#ap-f', h.b).value; h.cerrar();
      cbFormAsiento({ titulo: 'Asiento de apertura', tipo: 'apertura', fecha: f, concepto: 'Saldos iniciales al ' + fFecha(f), lineas: L });
    } }]);
};

/* ---------- Mayor ---------- */
function cbMayor() {
  const s = cbSaldos();
  const codes = Object.keys(s).filter(c => s[c].ini || s[c].debe || s[c].haber).sort();
  const sel = S.f.cbcta && codes.includes(S.f.cbcta) ? S.f.cbcta : codes[0];
  if (!sel) { $('#cb').innerHTML = '<div class="empty">Sin movimientos en este período</div>'; return; }
  const c = cbCta(sel), o = s[sel], sg = c.naturaleza === 'acreedora' ? -1 : 1;
  let run = o.ini;
  const mov = []; cbVig().slice().sort((a, b) => a.fecha < b.fecha ? -1 : 1).forEach(a => a.lineas.forEach(l => { if (l.cuenta !== sel) return; run = r2(run + l.debe - l.haber); mov.push({ a, l, run }); }));
  $('#cb').innerHTML = `<label class="fld" style="margin:10px 0"><span>Cuenta</span><select id="cb-cta" data-a="cbCtaSel">${codes.map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(cbNom(k))}</option>`).join('')}</select></label>
    <div class="kpis"><div class="kpi"><small>Saldo inicial</small><b class="n">${money(o.ini * sg)}</b></div><div class="kpi" style="--k:var(--ok)"><small>Saldo final</small><b class="n ${o.fin * sg < 0 ? 'neg' : ''}">${money(o.fin * sg)}</b></div></div>
    <div class="tabla"><div class="tr th"><span>Fecha · concepto</span><span>Debe</span><span>Haber</span><span>Saldo</span></div>${mov.map(x => `<div class="tr" data-a="cbVerAsiento" data-id="${x.a.id}"><span>${fFecha(x.a.fecha)}<br><small class="mut">${esc(x.a.concepto)}</small></span><span class="n">${x.l.debe ? money(x.l.debe) : ''}</span><span class="n">${x.l.haber ? money(x.l.haber) : ''}</span><span class="n">${money(x.run * sg)}</span></div>`).join('') || '<div class="empty">Sin movimientos</div>'}</div>`;
  $('#cb-cta').addEventListener('change', e => { S.f.cbcta = e.target.value; cbMayor(); });
  S.repCSV = () => csv(`mayor-${sel}-${cbMes()}.csv`, [['Cuenta', cbNom(sel)], ['Saldo inicial', o.ini * sg], ['Fecha', 'Número', 'Concepto', 'Debe', 'Haber', 'Saldo']].concat(mov.map(x => [x.a.fecha.replace('T', ' '), x.a.numero || x.a.id, x.a.concepto, x.l.debe, x.l.haber, x.run * sg])));
}
ACC.cbCtaSel = () => {};

/* ---------- Balanza ---------- */
function cbBalanza() {
  const s = cbSaldos();
  const rows = Object.keys(s).filter(c => s[c].ini || s[c].debe || s[c].haber).sort().map(c => ({ c, o: s[c], n: cbCta(c) }));
  const T = { ini: 0, debe: 0, haber: 0, fd: 0, fa: 0 };
  rows.forEach(r => { T.debe += r.o.debe; T.haber += r.o.haber; if (r.o.fin >= 0) T.fd += r.o.fin; else T.fa -= r.o.fin; });
  $('#cb').innerHTML = `<div class="tabla" style="margin-top:10px"><div class="tr th"><span>Cuenta</span><span>Debe</span><span>Haber</span><span>Saldo</span></div>
    ${Object.keys(CB_TIPOS).map(t => { const g = rows.filter(r => r.n.tipo === t); return g.length ? `<div class="tr" style="background:var(--bg)"><b>${CB_TIPOS[t]}</b><span></span><span></span><span></span></div>` + g.map(r => `<div class="tr"><span>${r.c} ${esc(r.n.nombre)}<br><small class="mut">inicial ${money(r.o.ini)}</small></span><span class="n">${money(r.o.debe)}</span><span class="n">${money(r.o.haber)}</span><span class="n ${r.o.fin < 0 ? 'mut' : ''}">${money(Math.abs(r.o.fin))} ${r.o.fin < 0 ? 'A' : 'D'}</span></div>`).join('') : ''; }).join('')}
    <div class="tr th"><span>Totales</span><span class="n">${money(r2(T.debe))}</span><span class="n">${money(r2(T.haber))}</span><span class="n">${money(r2(T.fd))} D / ${money(r2(T.fa))} A</span></div></div>
    ${Math.abs(T.debe - T.haber) > 0.01 || Math.abs(T.fd - T.fa) > 0.01 ? `<div class="aviso bad">${ic('alert', 18)} La balanza no cuadra: revisa saldos de apertura o asientos manuales.</div>` : `<div class="aviso info">${ic('info', 18)} Balanza cuadrada. D = saldo deudor, A = saldo acreedor.</div>`}`;
  S.repCSV = () => csv(`balanza-${cbMes()}.csv`, [['Código', 'Cuenta', 'Tipo', 'Saldo inicial', 'Debe', 'Haber', 'Saldo deudor', 'Saldo acreedor']].concat(rows.map(r => [r.c, r.n.nombre, r.n.tipo, r.o.ini, r.o.debe, r.o.haber, r.o.fin > 0 ? r.o.fin : 0, r.o.fin < 0 ? -r.o.fin : 0])));
}

/* ---------- Estado de resultados ---------- */
function cbResultados() {
  const s = cbSaldos();
  const lista = t => Object.keys(s).filter(c => cbCta(c).tipo === t && (s[c].debe || s[c].haber)).sort().map(c => ({ c, v: r2(t === 'ingreso' ? s[c].haber - s[c].debe : s[c].debe - s[c].haber) }));
  const ing = lista('ingreso'), cos = lista('costo'), gas = lista('gasto');
  const sum = l => r2(l.reduce((a, x) => a + x.v, 0));
  const TI = sum(ing), TC = sum(cos), TG = sum(gas), UB = r2(TI - TC), UN = r2(UB - TG);
  const fila = (t, v, cls) => `<div class="tr ${cls || ''}"><span>${t}</span><span class="n">${money(v)}</span></div>`;
  $('#cb').innerHTML = `<div class="card" style="text-align:center;margin:10px 0"><small class="mut">Utilidad neta · ${fMes(cbMes())}</small><div class="n" style="font-size:30px;font-weight:700;color:${UN < 0 ? 'var(--bad)' : 'var(--ok)'}">${money(UN)}</div><small class="mut">Margen neto ${TI ? fmtN(UN / TI * 100, 1) : '0'} %</small></div>
    <div class="tabla cb2">${ing.map(x => fila(esc(cbNom(x.c)), x.v)).join('')}${fila('<b>Total ingresos</b>', TI, 'th')}
    ${cos.map(x => fila('(−) ' + esc(cbNom(x.c)), x.v)).join('')}${fila('<b>Utilidad bruta</b>', UB, 'th')}
    ${gas.map(x => fila('(−) ' + esc(cbNom(x.c)), x.v)).join('')}${fila('<b>Total gastos</b>', TG, 'th')}${fila('<b>Utilidad neta</b>', UN, 'th')}</div>
    <p class="mut" style="font-size:12px">Reporte para control interno. Las declaraciones ante el SAR se preparan con tu contador.</p>
    <div class="row"><button class="btn pri grow" data-a="cbPDF" data-t="resultados">${ic('print', 18)} PDF</button><button class="btn" data-a="cbCSV">${ic('save', 18)} CSV</button></div>`;
  S.repCSV = () => csv(`resultados-${cbMes()}.csv`, [['Concepto', 'Monto']].concat(ing.map(x => [cbNom(x.c), x.v]), [['Total ingresos', TI]], cos.map(x => [cbNom(x.c), -x.v]), [['Utilidad bruta', UB]], gas.map(x => [cbNom(x.c), -x.v]), [['Total gastos', TG], ['Utilidad neta', UN]]));
}

/* ---------- Balance general ---------- */
function cbBalance() {
  const s = cbSaldos();
  const grupo = t => Object.keys(s).filter(c => cbCta(c).tipo === t && Math.abs(s[c].fin) > 0.004).sort().map(c => ({ c, v: r2(t === 'activo' ? s[c].fin : -s[c].fin) }));
  const act = grupo('activo'), pas = grupo('pasivo'), cap = grupo('capital');
  const sum = l => r2(l.reduce((a, x) => a + x.v, 0));
  const resAnt = cbResultadoAcum(), resMes = cbUtilidad(S.cb.asientos).utilidad;
  const TA = sum(act), TP = sum(pas), TCa = r2(sum(cap) + resAnt + resMes);
  const fila = (t, v, cls) => `<div class="tr ${cls || ''}"><span>${t}</span><span class="n">${money(v)}</span></div>`;
  $('#cb').innerHTML = `<p class="mut" style="margin:10px 0 4px">Al ${fFecha(S.cb.hasta)}</p><div class="tabla cb2">
    <div class="tr th"><span>ACTIVO</span><span></span></div>${act.map(x => fila(esc(cbNom(x.c)), x.v)).join('')}${fila('<b>Total activo</b>', TA, 'th')}
    <div class="tr th"><span>PASIVO</span><span></span></div>${pas.map(x => fila(esc(cbNom(x.c)), x.v)).join('')}${fila('<b>Total pasivo</b>', TP, 'th')}
    <div class="tr th"><span>CAPITAL</span><span></span></div>${cap.map(x => fila(esc(cbNom(x.c)), x.v)).join('')}${fila('Resultados de períodos anteriores', resAnt)}${fila('Resultado del período', resMes)}${fila('<b>Total capital</b>', TCa, 'th')}
    ${fila('<b>Pasivo + capital</b>', r2(TP + TCa), 'th')}</div>
    ${Math.abs(TA - TP - TCa) > 0.01 ? `<div class="aviso bad">${ic('alert', 18)} El balance no cuadra por ${money(r2(TA - TP - TCa))}. Normalmente falta el asiento de apertura o hay un asiento manual descuadrado.</div>` : `<div class="aviso info">${ic('info', 18)} Activo = pasivo + capital. Balance cuadrado.</div>`}
    <div class="row"><button class="btn pri grow" data-a="cbPDF" data-t="balance">${ic('print', 18)} PDF</button><button class="btn" data-a="cbCSV">${ic('save', 18)} CSV</button></div>`;
  S.repCSV = () => csv(`balance-${cbMes()}.csv`, [['Grupo', 'Cuenta', 'Monto']].concat(act.map(x => ['Activo', cbNom(x.c), x.v]), pas.map(x => ['Pasivo', cbNom(x.c), x.v]), cap.map(x => ['Capital', cbNom(x.c), x.v]), [['Capital', 'Resultados anteriores', resAnt], ['Capital', 'Resultado del período', resMes]]));
}

/* ---------- Conciliación bancaria ---------- */
function cbConcil() {
  const m = S.cb.mapeo, s = cbSaldos(), o = s[m.banco] || { ini: 0, debe: 0, haber: 0, fin: 0 };
  const c = S.cb.concil || { saldoBanco: '', marcados: [], nota: '' };

  const mov = []; cbVig().forEach(a => { if (a.tipo === 'apertura') return; a.lineas.forEach(l => { if (l.cuenta === m.banco) mov.push({ a, l, k: a.id + ':' + mov.length }); }); });
  const sinSaldo = c.saldoBanco === '' || c.saldoBanco === undefined || c.saldoBanco === null;
  const noVistos = mov.filter(x => !marc.has(x.a.id));
  const ajBanco = r2(num(c.saldoBanco) + noVistos.reduce((t, x) => t + x.l.debe - x.l.haber, 0)); // banco + depósitos en tránsito − cheques pendientes
  const dif = r2(ajBanco - o.fin);
  $('#cb').innerHTML = `<div class="kpis" style="margin-top:10px"><div class="kpi"><small>Saldo en libros (${esc(cbCta(m.banco).nombre)})</small><b class="n">${money(o.fin)}</b></div><div class="kpi"><small>Saldo del estado de cuenta</small><input type="number" step="0.01" id="cc-sb" class="n" value="${c.saldoBanco === '' ? '' : c.saldoBanco}" placeholder="0.00" style="font-weight:600"></div></div>

    <div class="sec-t">Movimientos en libros</div><p class="mut" style="font-size:12px;margin:-4px 0 8px">Marca los que ya aparecen en el estado de cuenta. Los que no, son cheques o depósitos en tránsito.</p>
    <div class="list">${mov.map(x => `<label class="li" style="cursor:pointer"><input type="checkbox" class="cc-m" data-id="${x.a.id}" ${marc.has(x.a.id) ? 'checked' : ''} style="width:22px;height:22px;margin-right:10px"><div class="tx"><b>${esc(x.a.concepto)}</b><small>${fFecha(x.a.fecha)}${marc.has(x.a.id) ? '' : ' · <span class="badge b-warn">no visto en banco</span>'}</small></div><div class="am n ${x.l.haber ? 'neg' : 'pos'}">${x.l.debe ? '+ ' + money(x.l.debe) : '− ' + money(x.l.haber)}</div></label>`).join('') || '<div class="empty">Sin movimientos de banco en el período</div>'}</div>
    <div class="sec-t">Partidas que están en el banco y faltan en libros</div>
    <div class="row"><button class="btn sm" data-a="cbConcilNueva" data-t="comision">${ic('plus', 16)} Comisión</button><button class="btn sm" data-a="cbConcilNueva" data-t="interes">${ic('plus', 16)} Interés</button><button class="btn sm" data-a="cbConcilNueva" data-t="otro">${ic('plus', 16)} Otro cargo</button></div>
    <div id="cc-nuevos" class="list" style="margin-top:8px"></div>
    <label class="fld" style="margin-top:12px"><span>Nota</span><input id="cc-nota" value="${esc(c.nota || '')}" placeholder="Opcional"></label>
    <div class="row"><button class="btn pri grow" data-a="cbConcilGuardar">${ic('save', 18)} Guardar conciliación</button><label class="sw-row" style="margin:0"><input type="checkbox" id="cc-listo" ${c.listo ? 'checked' : ''}><span class="sw"></span> Lista</label></div>`;
  S.cbNuevos = [];
  const recalc = () => { const mk = new Set($$('.cc-m').filter(i => i.checked).map(i => i.dataset.id)); const nv = mov.filter(x => !mk.has(x.a.id)).reduce((t, x) => t + x.l.debe - x.l.haber, 0); const extra = S.cbNuevos.reduce((t, n) => t + (n.tipo === 'interes' ? n.monto : -n.monto), 0); const vacio = $('#cc-sb').value === ''; const d = r2(num($('#cc-sb').value) + nv - (o.fin + extra)); const e = $('#cc-dif'); e.className = 'aviso ' + (vacio || Math.abs(d) < 0.01 ? 'info' : 'bad'); e.innerHTML = vacio ? ic('info', 18) + ' Escribe el saldo final que muestra tu estado de cuenta del banco.' : Math.abs(d) < 0.01 ? ic('info', 18) + ' Conciliado: libros y banco coinciden.' : ic('alert', 18) + ' Diferencia por explicar: <b class="n">' + money(d) + '</b>'; };
  $('#cb').addEventListener('input', recalc); $('#cb').addEventListener('change', recalc);
  S.cbRecalc = recalc;
  S.repCSV = () => csv(`conciliacion-${cbMes()}.csv`, [['Fecha', 'Concepto', 'Entrada', 'Salida', 'Visto en banco']].concat(mov.map(x => [x.a.fecha.replace('T', ' '), x.a.concepto, x.l.debe, x.l.haber, marc.has(x.a.id) ? 'sí' : 'no'])));
}

const PLAT = [['Netflix', '#e50914'], ['Disney+', '#113ccf'], ['HBO Max', '#5822b4'], ['Prime Video', '#00a8e1'], ['Spotify', '#1db954'], ['YouTube Premium', '#ff0000'], ['Crunchyroll', '#f47521'], ['Paramount+', '#0064ff'], ['IPTV', '#111111']];

const GIRO_EMO = { tienda: '🏪', variedades: '🛍️', ferreteria: '🔨', comida: '🍽️', boutique: '👗', farmacia: '💊', repuestos: '🔧', tecnologia: '📱', belleza: '💄', panaderia: '🥐', servicios: '✂️', streaming: '📺', compras: '✈️', recargas: '🎮', otro: '📦' };
// Plataformas: las conocidas + las que el negocio agregó ("+ Otra") + las que ya usa en productos o cuentas
function platsTodas() {
  const l = PLAT.map(x => x[0]), add = n => { n = String(n || '').trim(); if (n && !l.some(x => x.toLowerCase() === n.toLowerCase())) l.push(n); };
  String(S.config.plataformas || '').split(',').forEach(add);
  (S.productos || []).forEach(p => { add(p.plataforma); leerIncluye(p.incluye).forEach(x => add(x.plataforma)); });
  (S.cuentasL || []).forEach(c => add(c.plataforma));
  return l;
}
function platColor(n) { const d = PLAT.find(x => x[0].toLowerCase() === String(n || '').toLowerCase()); return d ? d[1] : ''; }
function platAv(n, cls) { const c = platColor(n); return `<span class="${cls || 'av'} ${c ? '' : colorDe(n)}" ${c ? `style="background:${c};color:#fff"` : ''}>${esc(iniciales(n))}</span>`; }
function leerIncluye(t) { return String(t || '').split('|').map(x => x.trim()).filter(Boolean).map(x => { const p = x.split(':'); return { plataforma: p[0].trim(), n: Math.max(1, parseInt(p[1], 10) || 1) }; }).filter(x => x.plataforma); }
// Qué entrega un producto al venderse: [{ plataforma, n, entrega }] (vacío si no es suscripción)
function susDeProducto(p) {
  if (!p) return [];
  if (p.incluye) return leerIncluye(p.incluye).map(x => ({ plataforma: x.plataforma, n: x.n, entrega: 'perfil' }));
  if (p.plataforma) return [{ plataforma: p.plataforma, n: 1, entrega: p.entrega === 'cuenta' ? 'cuenta' : 'perfil' }];
  return [];
}
const esSus = p => susDeProducto(p).length > 0;
function mesesSumar(iso, meses) { const d = parseLocal(iso + 'T12:00'); const dia = d.getDate(); d.setMonth(d.getMonth() + meses); if (d.getDate() !== dia) d.setDate(0); return toLocal(d).slice(0, 10); }
function venceTxt(s) {
  const d = typeof s === 'number' ? s : s.dias;

function abrirAyuda(foco) {
  const vista = VISTAS[foco] ? foco : S.vista;

  const tema = k => { const a = AYUDA[k]; return `<div class="ay-t"><p>${a.d}</p><ol>${a.p.map(x => `<li>${x}</li>`).join('')}</ol>${a.t.length ? `<div class="ay-tips">${a.t.map(x => `<p>💡 ${x}</p>`).join('')}</div>` : ''}${k !== S.vista ? `<button class="btn sm" data-a="ir" data-v="${k}">Ir a ${esc(VISTAS[k].c || VISTAS[k].t)} ${ic('arrow', 15)}</button>` : ''}</div>`; };
  const msj = 'Hola, necesito ayuda con Gestión de Negocio VM' + (S.config.nombre ? ' (' + S.config.nombre + ')' : '') + '. Estoy en ' + (VISTAS[S.vista] ? VISTAS[S.vista].t : 'el sistema') + '.';
  const h = hoja({ titulo: 'Ayuda', html: `<div class="srch ay-q">${ic('search', 18)}<input id="ay-q" placeholder="¿Qué quieres hacer? Ej. anular una venta"></div>
    <div id="ay-res"></div>
    ${AYUDA[vista] && puedeVer(vista) ? `<div class="ay-aqui" id="ay-aqui"><div class="ay-h"><i class="${colorDe(vista)}">${ic(VISTAS[vista].i, 20)}</i><div><small>En esta pantalla</small><b>${esc(VISTAS[vista].t)}</b></div></div>${tema(vista)}</div>` : ''}
    ${S.multi ? `<div class="link-card" style="margin-bottom:12px"><div class="li-ic">${ic('chat', 22)}</div><div class="tx"><b>Contactar al administrador</b><small>Errores, dudas, prueba y activación o sugerencias. Te respondemos en la app.</small></div><button class="btn sm pri" data-a="soporteNuevo">Escribir</button></div><div id="ay-sop"></div>` : ''}
    <div class="ay-acc"><button class="btn" data-a="verNovedades">${ic('sparkle', 18)} Novedades de la versión ${APP_VER}</button><a class="btn wa" href="${waLink(CONTACTO_WA, msj)}" target="_blank" rel="noopener">${ic('wa', 18)} WhatsApp</a></div>
    <div class="sec-t" id="ay-ot"><h3>Todas las guías</h3></div>
    <div class="ay-lista" id="ay-lista">${temas.filter(k => k !== vista).map(k => `<details class="ay-d"><summary><i class="${colorDe(k)}">${ic(VISTAS[k].i, 18)}</i>${esc(VISTAS[k].t)}</summary>${tema(k)}</details>`).join('')}</div>
    <p class="credit" style="margin-top:18px">Gestión de Negocio VM · versión ${APP_VER}${S.version ? ' · servidor ' + esc(S.version) : ''}<br>Software creado por José Vicdonio Molina</p>` });
  if ($('#ay-sop', h.el)) listaSoporte($('#ay-sop', h.el));
  $('#ay-q', h.el).addEventListener('input', e => {
    const q = norm(e.target.value.trim()), res = $('#ay-res', h.el);
    $('#ay-aqui', h.el) && ($('#ay-aqui', h.el).hidden = !!q); $('#ay-lista', h.el).hidden = !!q; $('#ay-ot', h.el).hidden = !!q;
    if (!q) { res.innerHTML = ''; return; }
    const pal = q.split(/\s+/).filter(x => x.length > 2);
    const hits = temas.map(k => { const a = AYUDA[k], tit = norm(VISTAS[k].t), txt = norm([a.d].concat(a.p, a.t).join(' ').replace(/<[^>]+>/g, ''));
        return { k, n: pal.reduce((s, w) => s + (tit.includes(w) ? 3 : 0) + (txt.includes(w) ? 1 : 0), 0) + (txt.includes(q) ? 2 : 0) }; })
      .filter(x => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 4);
    res.innerHTML = hits.length ? hits.map(x => `<div class="ay-aqui"><div class="ay-h"><i class="${colorDe(x.k)}">${ic(VISTAS[x.k].i, 20)}</i><div><small>Guía</small><b>${esc(VISTAS[x.k].t)}</b></div></div>${tema(x.k)}</div>`).join('')

  });
  return h;
}

/* ---------- Novedades ---------- */
function mostrarNovedades(desde) {
  const l = NOVEDADES.filter(n => !desde || cmpVer(n.v, desde) > 0);
  if (!l.length) return;
  const items = [].concat.apply([], l.map(n => n.items)).filter(x => (!x.ir || puedeVer(x.ir)) && (!x.si || x.si()));
  if (!items.length) return;
  const h = hoja({ titulo: '', cls: 'nov', html: `<div class="nov-h"><div class="nov-ic">${ic('sparkle', 30)}</div><h2>¡Novedades!</h2><p>Gestión de Negocio VM · versión ${esc(l[0].v)}</p></div>
    <div class="nov-l">${items.map(x => `<div class="nov-i"><i class="${colorDe(x.t)}">${ic(x.i, 20)}</i><div><b>${esc(x.t)}</b><p>${esc(x.d)}</p>${x.ir && S.vista !== x.ir ? `<button class="lnk" data-a="ir" data-v="${x.ir}">Ver dónde ${ic('arrow', 14)}</button>` : ''}</div></div>`).join('')}</div>` });
  h.botones([{ t: '¡Entendido!', cls: 'pri', fn: () => h.cerrar() }]);
}
ACC.verNovedades = () => { cerrarHojas(); mostrarNovedades(''); };
function revisarNovedades() {
  const visto = LS.get('verVisto', '');
  if (!visto) { LS.set('verVisto', APP_VER); return; } // primera vez en este equipo: no hay «novedades»
  if (cmpVer(APP_VER, visto) <= 0) return;
  let intentos = 0;
  const probar = () => {
    if (!S.user || S.vencidaVista) return;
    if (PILA.length) { if (++intentos < 60) setTimeout(probar, 1500); return; } // por ejemplo, mientras elige la tienda
    LS.set('verVisto', APP_VER); mostrarNovedades(visto);
  };
  setTimeout(probar, 900);
}

/* ---------- ¿Hay una versión nueva publicada? ---------- */
function cmpVer(a, b) { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; }
let ultRevVer = 0;
async function buscarActualizacion(forzar) {
  if (!/^https?:$/.test(location.protocol) || S.enTienda || $('#upd')) return;
  if (!forzar && Date.now() - ultRevVer < 10 * 60000) return;
  ultRevVer = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VER = '([\d.]+)'/);
    if (m && cmpVer(m[1], APP_VER) > 0) avisoActualizacion(m[1]);
  } catch (e) {}
}
function avisoActualizacion(v) {
  if ($('#upd')) return;
  const d = document.createElement('div'); d.id = 'upd'; d.className = 'upd'; d.setAttribute('role', 'status');
  d.innerHTML = `<i>${ic('sparkle', 20)}</i><div class="grow"><b>Hay una versión nueva (${esc(v)})</b><small>Actualiza para ver las mejoras. Tus datos no cambian.</small></div><button class="btn sm acc" data-a="actualizarApp">Actualizar</button><button class="btn icon ghost upd-x" data-a="cerrarUpd" aria-label="Después">${ic('x', 16)}</button>`;
  document.body.appendChild(d); requestAnimationFrame(() => d.classList.add('in'));
}
ACC.cerrarUpd = () => { const d = $('#upd'); if (d) d.remove(); ultRevVer = Date.now(); }; // vuelve a avisar más tarde
ACC.actualizarApp = async el => {
  el.disabled = true; el.textContent = 'Actualizando…';
  try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); } } catch (e) {}
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
  location.reload();
};
setInterval(() => buscarActualizacion(), 30 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) buscarActualizacion(); });

/* ===================== APP PARA ANDROID (APK) =====================
   En un Android que abre el sistema desde el navegador, ofrece descargar la app.
   No sale si ya está dentro de la app instalada, en computadora, en iPhone ni en la tienda en línea.
   El aviso solo aparece si el archivo del APK existe en el sitio (carpeta app/). */
const APK_URL = 'app/gestion-de-negocio-vm.apk';
const APK_PAUSA = 5 * 86400000; // si la cierran con la X, vuelve a salir en 5 días
function enAppInstalada() {
  try { if (document.referrer.indexOf('android-app://') === 0) sessionStorage.setItem('enApk', '1'); } catch (e) {}
  let s = false; try { s = sessionStorage.getItem('enApk') === '1'; } catch (e) {}
  return s || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches)) || navigator.standalone === true;
}
let APK_OK = null;
async function ofrecerApk() {
  if (!/Android/i.test(navigator.userAgent) || enAppInstalada() || S.enTienda || $('#apk-bar')) return;
  if (!/^https?:$/.test(location.protocol)) return;
  if (Date.now() - num(LS.get('apkNo', '0')) < APK_PAUSA) return;
  if (APK_OK === null) {
    try { const r = await fetch(APK_URL, { method: 'HEAD', cache: 'no-store' }); APK_OK = r.ok; } catch (e) { APK_OK = false; }
  }
  if (!APK_OK || $('#apk-bar') || S.enTienda) return;
  const d = document.createElement('div'); d.id = 'apk-bar'; d.className = 'apk-bar'; d.setAttribute('role', 'status');
  d.innerHTML = `<i>${ic('save', 22)}</i><div class="grow"><b>Descarga la app para Android</b><small>Ábrela con un toque desde tu pantalla de inicio</small></div><button class="btn sm apk-go" data-a="apkVer">Descargar</button><button class="btn icon ghost apk-x" data-a="apkNo" aria-label="Ahora no">${ic('x', 16)}</button>`;
  document.body.appendChild(d); requestAnimationFrame(() => d.classList.add('in'));
}
ACC.apkNo = () => { LS.set('apkNo', String(Date.now())); const d = $('#apk-bar'); if (d) d.remove(); };
ACC.apkVer = () => {
  const h = hoja({ titulo: 'App para Android', cls: 'chica apk-hoja', html: `<p class="sm mut" style="margin:0 0 10px">Gestión de Negocio VM · versión ${APP_VER}</p>
    <ol class="apk-pasos"><li>Toca <b>Descargar APK</b>.</li><li>Abre el archivo descargado (en la notificación o en «Descargas»).</li><li>Si el teléfono lo pide, activa <b>«Permitir de esta fuente»</b> y toca <b>Instalar</b>.</li></ol>
    <a class="btn big apk-dl" href="${APK_URL}" download="Gestion-de-Negocio-VM.apk" data-a="apkBajo">${ic('save', 20)} Descargar APK</a>
    <p class="xs mut" style="margin:10px 0 0;text-align:center">Android puede avisar que el archivo viene de fuera de la Play Store: es normal. Tus datos son los mismos en la app y en el navegador.</p>` });
  h.botones([{ t: 'Seguir en el navegador', fn: () => h.cerrar() }]);

ACC.apkBajo = el => { LS.set('apkNo', String(Date.now())); const d = $('#apk-bar'); if (d) d.remove(); toast('Descargando… ábrelo cuando termine', 'ok', 5000); window.location.href = el.getAttribute('href'); };

/* ===================== COMPROBANTES (imagen, impresión, WhatsApp) ===================== */
function textoVenta(v, det) {
  const l = [`*${S.config.nombre || 'Comprobante'}*`, v.factura ? `Factura ${v.factura} · ${fFechaC(v.fecha)} ${fHora(v.fecha)}` : `Comprobante ${v.numero} · ${fFechaC(v.fecha)} ${fHora(v.fecha)}`, ''];
  det.forEach(i => l.push(`${cant(i.cantidad)} × ${i.descripcion} — ${money(i.total)}` + (i.serie ? `\n   Serie ${i.serie}` : '') + (i.garantia ? `\n   Garantía hasta ${fFechaC(garantiaHasta(v.fecha, i.garantia))}` : '')));
  l.push('');
  if (v.descuento) l.push('Descuento: −' + money(v.descuento));
  l.push(`*Total: ${money(v.total)}*`);
  if (v.anticipo > 0) l.push(`Anticipo ya pagado: −${money(v.anticipo)} · pagado hoy: ${money(v.total - v.anticipo)}`);
  l.push('Pago: ' + v.metodo + (v.metodo === 'Crédito' ? ` · saldo ${money(v.saldo)}` : ''));
  if (S.config.mensajeRecibo) l.push('', S.config.mensajeRecibo);
  return l.join('\n');
}
function qrTiendaSVG(px) {
  try { if (!S.plus || S.config.tienda !== 'si' || !window.qrcode) return ''; const q = qrcode(0, 'M'); q.addData(linkTienda()); q.make(); return q.createSvgTag({ cellSize: 3, margin: 0, scalable: true }).replace('<svg ', `<svg width="${px}" height="${px}" `); } catch (e) { return ''; }
}
function reciboHTML(tipo, d) {
  const c = S.config;
  const qr = qrTiendaSVG(74), tiendaPie = qr ? `<div class="rc-qr" style="background:${mezcla((TEMAS[S.tema] || TEMAS[TEMA_DEF]).pri, '#ffffff', .91)}">${qr}<div><b>Pide desde tu casa</b><small>Escanea el código o entra a<br>${esc(linkTienda().replace('https://', ''))}</small></div></div>` : '';
  const cab = `<div class="rc-h">${c.logo ? `<div class="rc-logo"><img src="${esc(c.logo)}" alt=""></div>` : `<div class="rc-mono">${esc(iniciales(c.nombre))}</div>`}<h4>${esc(c.nombre || '')}</h4><p>${esc(c.eslogan || giroNombre())}</p></div>`;
  const pie = `<div class="rc-f"><em>${esc(c.mensajeRecibo || '¡Gracias por su compra!')}</em>${esc([c.direccion, c.telefono ? 'Tel. ' + c.telefono : '', c.rtn ? 'RTN ' + c.rtn : ''].filter(Boolean).join(' · '))}<br><span>Este comprobante no sustituye la factura fiscal</span></div>${tiendaPie}`;
  if (tipo === 'venta' && d.v.factura) return facturaHTML(d.v, d.det);
  if (tipo === 'venta') {
    const v = d.v, cli = v.clienteId ? byId(S.clientes, v.clienteId) : null;
    return `<div class="rc">${cab}<div class="rc-b"><div class="rc-t"><b>Comprobante de pago</b><small>N.º ${esc(v.numero)}</small></div>
      <div class="rc-m"><div><small>Fecha</small>${esc(fFechaC(v.fecha))} · ${fHora(v.fecha)}</div><div><small>Cliente</small>${esc(cli ? cli.nombre : 'Consumidor final')}</div><div><small>Atendió</small>${esc(nomUsuario(v.usuarioId).split(' ')[0])}</div><div><small>Pago</small>${esc(v.metodo)}</div></div>
      ${d.det.map(i => `<div class="rc-i"><span>${esc(i.descripcion)} <small>× ${cant(i.cantidad)}</small>${i.serie ? `<br><small>Serie ${esc(i.serie)}</small>` : ''}${i.garantia ? `<br><small>Garantía ${i.garantia} días · hasta ${fFechaC(garantiaHasta(v.fecha, i.garantia))}</small>` : ''}</span><b>${money(i.total)}</b></div>`).join('')}
      ${v.servicio ? `<div class="rc-s"><span>Servicio</span><span>${v.servicio === 'mesa' ? 'Mesa ' + esc(v.mesa || '') : v.servicio === 'llevar' ? 'Para llevar' : 'Domicilio'}</span></div>` : ''}
      <div class="rc-s"><span>Subtotal</span><span>${money(v.subtotal)}</span></div>${v.descuento ? `<div class="rc-s"><span>Descuento</span><span>− ${money(v.descuento)}</span></div>` : ''}<div class="rc-s"><span>ISV</span><span>${money(v.isv)}</span></div>
      ${v.anticipo > 0 ? `<div class="rc-s"><span>Anticipo ya pagado</span><span>− ${money(v.anticipo)}</span></div>` : ''}${v.metodo === 'Efectivo' ? `<div class="rc-s"><span>Recibido · cambio</span><span>${money(v.recibido)} · ${money(v.cambio)}</span></div>` : ''}${v.metodo === 'Crédito' ? `<div class="rc-s"><span>Anticipo · saldo</span><span>${money(v.recibido)} · ${money(v.saldo)}</span></div>` : ''}
      <div class="rc-tot"><span>${v.metodo === 'Crédito' ? 'Total' : 'Total pagado'}</span><b>${money(v.total)}</b></div></div>${pie}</div>`;
  }
  if (tipo === 'abono') {
    const a = d.a;
    const ap = (() => { try { return JSON.parse(a.aplicado || '[]'); } catch (e) { return []; } })();
    return `<div class="rc">${cab}<div class="rc-b"><div class="rc-t"><b>Comprobante de abono</b><small>${esc(fFechaC(a.fecha))} · ${fHora(a.fecha)}</small></div>
      <div class="rc-m"><div><small>Cliente</small>${esc(d.c.nombre)}</div><div><small>Pago</small>${esc(a.metodo)}</div></div>
      ${ap.map(x => `<div class="rc-i"><span>Abono a ${esc(x.numero)}</span><b>${money(x.monto)}</b></div>`).join('')}
      <div class="rc-s"><span>Saldo anterior</span><span>${money(d.antes)}</span></div><div class="rc-s"><span>Saldo actual</span><span>${money(d.c.saldo)}</span></div>
      <div class="rc-tot"><span>Abono recibido</span><b>${money(a.monto)}</b></div></div>${pie.replace('¡Gracias por su compra!', '¡Gracias por su pago!')}</div>`;
  }
  return '';
}
async function aImagen(el) {
  await cargarLib('canvas');
  try { await document.fonts.ready; } catch (e) {}
  const cv = await html2canvas(el, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
  return await new Promise(ok => cv.toBlob(ok, 'image/png'));
}
async function imagenRecibo(tipo, d) {
  if (S.plus && S.config.tienda === 'si') { try { await cargarLib('qr'); } catch (e) {} }
  const box = $('#recibo-tmp');
  box.innerHTML = reciboHTML(tipo, d);
  let blob;
  try { blob = await aImagen(box.firstElementChild); } catch (e) { box.innerHTML = ''; return err(e); }
  box.innerHTML = '';
  const nombre = (tipo === 'venta' ? (d.v.factura ? 'factura-' + d.v.factura : 'comprobante-' + d.v.numero) : 'abono-' + d.c.nombre.split(' ')[0]) + '.png';
  const url = URL.createObjectURL(blob);
  const h = hoja({ titulo: 'Comprobante', cls: 'chica', html: `<div class="rc-prev"><img src="${url}" alt="Comprobante"></div>`, onClose: () => setTimeout(() => URL.revokeObjectURL(url), 1000) });
  h.botones([{ t: `${ic('save', 18)} Descargar`, fn: () => descargar(blob, nombre) }, { t: `${ic('share', 18)} Compartir`, cls: 'pri', fn: () => compartirArchivo(blob, nombre, tipo === 'venta' ? textoVenta(d.v, d.det) : '') }]);
}
function descargar(blob, nombre) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click();

  if (abierto) return { on: true, t: 'cierra a las ' + h12(n.cierra) };
  if (dias.includes(hoyD) && hm < n.abre) return { on: false, t: 'abre hoy a las ' + h12(n.abre) };

}

    const comprasHTML = T.compras.map((c, i) => `<div class="tk"><div class="tx"><b>🔗 Compra en línea</b><small class="op">${esc([c.talla && 'Talla: ' + c.talla, c.color && 'Color: ' + c.color].filter(Boolean).join(', ') || c.enlace.slice(0, 40))}</small><small>US$${c.usd.toFixed(2)} → ${money(precioCompraT(c.usd))} c/u · ${c.cantidad} ${c.cantidad === 1 ? 'artículo' : 'artículos'}</small></div><button class="btn icon sm ghost" data-qc="${i}" aria-label="Quitar">${ic('trash', 16)}</button></div>`).join('');
    const valores = { nom: ($('#tc-n', h.el) || {}).value, tel: ($('#tc-t', h.el) || {}).value, dir: ($('#tc-d', h.el) || {}).value, pago: ($('#tc-p', h.el) || {}).value, nota: ($('#tc-o', h.el) || {}).value };
    $('#tc', h.el).innerHTML = `${comprasHTML}${items.map(x => `<div class="tk"><div class="tx"><b>${esc(x.p.nombre)}</b>${x.op ? `<small class="op">${esc(x.op)}</small>` : ''}<small>${money(x.p.precio)} c/u</small></div><div class="qty"><button data-id="${esc(x.k)}" data-d="-1">−</button><span>${x.q}</span><button data-id="${esc(x.k)}" data-d="1">+</button></div><b class="n tkt">${money(x.p.precio * x.q)}</b></div>`).join('')}
      <div class="tots"><div class="tot"><span>Productos</span><b class="n">${money(sub)}</b></div>${T.entrega === 'domicilio' ? `<div class="tot"><span>Envío a domicilio</span><b class="n">${env ? money(env) : 'Gratis'}</b></div>` : ''}<div class="tot g"><span>Total</span><b class="n">${money(sub + env)}</b></div>${anticipo ? `<div class="tot"><span>Anticipo para pedir tus compras en línea</span><b class="n" style="color:var(--pri)">${money(anticipo)}</b></div>` : ''}</div>
      ${anticipo && n.compras.dias ? `<p class="xs mut" style="margin:-4px 2px 10px">Las compras en línea llegan en ${esc(n.compras.dias)}. El precio final te lo confirmamos por mensaje.</p>` : ''}
      ${n.minimo && sub < n.minimo ? `<div class="aviso warn sm">${ic('alert', 18)}<div>El pedido mínimo es de ${money(n.minimo)}</div></div>` : ''}
      ${n.entrega === 'ambos' ? `<div class="seg full" id="tc-e" style="margin-bottom:12px"><button class="${T.entrega === 'recoger' ? 'on' : ''}" data-e="recoger">${ic('store', 16)} Recoger</button><button class="${T.entrega === 'domicilio' ? 'on' : ''}" data-e="domicilio">${ic('truck', 16)} A domicilio</button></div>` : `<p class="sm mut">${n.entrega === 'domicilio' ? 'Te lo llevamos a domicilio' : 'Lo recoges en el negocio'}${n.direccion && n.entrega !== 'domicilio' ? ': ' + esc(n.direccion) : ''}</p>`}
      <div class="f2"><label class="fld"><span>Tu nombre</span><input id="tc-n" autocomplete="name" value="${esc(valores.nom !== undefined ? valores.nom : cli.nombre || '')}"></label><label class="fld"><span>Tu WhatsApp</span><input id="tc-t" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876-5432" value="${esc(valores.tel !== undefined ? valores.tel : cli.telefono || '')}"></label></div>
      ${T.entrega === 'domicilio' ? `<label class="fld"><span>Dirección de entrega</span><input id="tc-d" autocomplete="street-address" placeholder="Colonia, calle, casa, referencia" value="${esc(valores.dir !== undefined ? valores.dir : cli.direccion || '')}"></label>` : ''}
      <label class="fld"><span>¿Cómo vas a pagar?</span><select id="tc-p">${n.pagos.map(x => `<option value="${esc(x)}" ${valores.pago === x ? 'selected' : ''}>${esc(x === 'Efectivo' && T.entrega === 'domicilio' ? 'Efectivo al recibir' : x)}</option>`).join('')}</select></label>
      <div id="tc-dp"></div>
      <label class="fld"><span>Nota (opcional)</span><input id="tc-o" placeholder="Algo más que debamos saber" value="${esc(valores.nota || '')}"></label>`;
    const dp = () => { $('#tc-dp', h.el).innerHTML = $('#tc-p', h.el).value === 'Transferencia' && n.datosPago ? `<div class="aviso info sm">${ic('bank', 18)}<div>${esc(n.datosPago)}</div></div>` : ''; };
    $('#tc-p', h.el).addEventListener('change', dp); dp();
    h.botones([{ t: `${ic('send', 18)} Enviar pedido · ${money(sub + env)}`, cls: 'wa big', fn: enviar }]);
  };
  $('#tc', h.el).addEventListener('click', e => {
    const qc = e.target.closest('[data-qc]'); if (qc) { T.compras.splice(Number(qc.dataset.qc), 1); guardarCompras(); barTienda(); pinta(); return; }
    const q = e.target.closest('[data-d]'); if (q) { tAgregar(q.dataset.id, Number(q.dataset.d)); pinta(); return; }
    const en = e.target.closest('[data-e]'); if (en) { T.entrega = en.dataset.e; pinta(); }
  });
  const enviar = async () => {
    const nombre = $('#tc-n', h.el).value.trim(), tel = $('#tc-t', h.el).value.trim(), dir = ($('#tc-d', h.el) || {}).value || '';
    if (nombre.length < 3) throw new Error('Escribe tu nombre');
    if (tel.replace(/\D/g, '').length < 8) throw new Error('Escribe tu número de WhatsApp');
    if (T.entrega === 'domicilio' && dir.trim().length < 5) throw new Error('Escribe la dirección de entrega');
    LS.set('cliente_tienda', JSON.stringify({ nombre, telefono: tel, direccion: dir || cli.direccion || '' }));
    const r = await api('pedir', { negocio: T.id, nombre, telefono: tel, entrega: T.entrega, direccion: dir, pago: $('#tc-p', h.el).value, nota: $('#tc-o', h.el).value, items: T.compras.map(c => Object.assign({ id: '_compra' }, c)).concat(Object.keys(T.cart).map(k => ({ id: kId(k), cantidad: T.cart[k], opcion: kOp(k) }))) });
    const mis = LS.json(tKey('pedidos'), []) || []; mis.unshift(r.id); LS.set(tKey('pedidos'), JSON.stringify(mis.slice(0, 10)));
    T.cart = {}; guardarCarrito(); T.compras = []; guardarCompras(); h.cerrar(); gridTienda(); pedidoEnviado(r, nombre, tel); misPedidosTienda();
  };
  pinta();
}
function pedidoEnviado(r, nombre, tel) {
  const n = T.info.negocio;
  const txt = [`Hola, soy ${nombre}. Acabo de hacer el pedido *${r.numero}* en línea:`, ...r.items.map(i => `• ${i.cantidad} × ${i.nombre} — ${money(i.total)}${i.enlace ? '\n  ' + i.enlace : ''}`), r.envio ? `Envío: ${money(r.envio)}` : '', `*Total: ${money(r.total)}*`, r.anticipo ? `Anticipo para pedir: ${money(r.anticipo)}` : '', `${r.entrega === 'domicilio' ? 'A domicilio' : 'Para recoger'} · Pago: ${r.pago}`].filter(Boolean).join('\n');
  const h = hoja({ titulo: '', cls: 'exito', html: `<div class="ok-big"><i>${ic('check', 40)}</i><h2>¡Pedido enviado!</h2><p class="mut">Tu número de pedido es <b>${esc(r.numero)}</b></p><div class="ok-tot n">${money(r.total)}</div>
    ${r.anticipo ? `<p class="sm" style="color:var(--pri)"><b>Anticipo para pedir tus compras en línea: ${money(r.anticipo)}</b>${r.diasCompra ? `<br><span class="mut">Llegan en ${esc(r.diasCompra)}.</span>` : ''}</p>` : ''}<p class="sm">${esc(n.nombre)} ya lo recibió y te confirmará por WhatsApp.</p>${r.datosPago ? `<div class="aviso info sm" style="text-align:left">${ic('bank', 18)}<div><b>Datos para transferir</b><br>${esc(r.datosPago)}</div></div>` : ''}</div>` });
  const bs = [];
  if (n.telefono) bs.push({ t: `${ic('wa', 18)} Avisar por WhatsApp`, cls: 'wa', fn: () => { window.open(waLink(n.telefono, txt), '_blank'); } });
  bs.push({ t: 'Seguir viendo', cls: 'pri', fn: () => h.cerrar() });
  h.botones(bs);
}
/* ===== Mensajes directos (lado del cliente) ===== */
const chatClave = () => LS.get(tKey('chat'), '');
function chatBadgeTienda() {
  const b = $('#t-chatbtn'); if (!b || !chatClave()) return;
  api('chatVer', { negocio: T.id, clave: chatClave() }, true).then(c => {
    if (c.borrado) { LS.set(tKey('chat'), ''); LS.set(tKey('chatVisto'), ''); return; }
    const visto = LS.get(tKey('chatVisto'), ''), nuevos = c.mensajes.filter(m => m.de === 'negocio' && m.fecha > visto).length;
    b.innerHTML = ic('chat', 24) + (nuevos ? `<b>${nuevos}</b>` : '');
    const box = $('#t-chatmis');
    if (box && nuevos) box.innerHTML = `<div class="mis" data-chat="1" style="cursor:pointer"><b>Mensajes</b><div class="mis-r"><span>${ic('chat', 16)} ${esc(T.info.negocio.nombre)} te respondió</span><span class="badge">${nuevos} ${nuevos === 1 ? 'nuevo' : 'nuevos'}</span></div></div>`;
    else if (box) box.innerHTML = '';
  }).catch(() => {});
}
function chatTienda(productoId) {
  const n = T.info.negocio, d = n.dueno, cli = LS.json('cliente_tienda', {}) || {};
  const prod = productoId ? T.info.productos.find(x => x.id === productoId) : null;
  let chat = null, timer = null, enviando = false;
  const h = hoja({ titulo: '', cls: 'chat-h2', html: `<div class="chat-h"><div class="av">${d && d.foto ? `<img src="${esc(d.foto)}" alt="">` : n.logo ? `<img src="${esc(n.logo)}" alt="">` : esc(iniciales(d ? d.nombre : n.nombre))}</div><div><b>${esc(d ? d.nombre : n.nombre)}</b><small>${d && d.cargo ? esc(d.cargo) + ' · ' : ''}${esc(n.nombre)}</small></div></div>
    ${prod ? `<div class="chat-ctx"><div class="ph">${prod.foto ? `<img src="${esc(fotoSrc(prod.foto))}" alt="">` : esc(prod.icono || iniciales(prod.nombre))}</div><div><small>Preguntas por</small><b>${esc(prod.nombre)} · ${money(prod.precio)}</b></div></div>` : ''}
    <div class="msgs" id="tch-m"><div class="empty">Cargando…</div></div>
    <div id="tch-datos" hidden><div class="f2"><label class="fld"><span>Tu nombre</span><input id="tch-n" autocomplete="name" value="${esc(cli.nombre || '')}"></label><label class="fld"><span>Tu WhatsApp</span><input id="tch-t" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876-5432" value="${esc(cli.telefono || '')}"></label></div></div>
    <div class="chat-nota">${ic('clock', 14)} Los mensajes se borran solos a los 2 meses.</div>
    <div class="chat-in"><textarea id="tch-in" rows="1" placeholder="Escribe tu mensaje…" maxlength="600"></textarea><button id="tch-send" aria-label="Enviar">${ic('send', 20)}</button></div>`,
    onClose: () => { clearInterval(timer); } });
  const pinta = () => {
    const box = $('#tch-m', h.el); if (!box) return;
    const ms = chat ? chat.mensajes : [];
    if (!ms.length) { box.innerHTML = `<div class="empty">${d ? esc(d.nombre.split(' ')[0]) + ' te responde por aquí.' : 'Escríbenos y te respondemos por aquí.'}${prod ? '' : '<br>Cuéntanos qué necesitas.'}</div>`; return; }
    let dia = '';
    box.innerHTML = ms.map(m => { const f = String(m.fecha).slice(0, 10), sep = f !== dia ? `<div class="day">${f === hoy() ? 'Hoy' : esc(fFechaC(f))}</div>` : ''; dia = f;
      return sep + `<div class="msg ${m.de === 'cliente' ? 'yo' : 'el'}"><div class="bt">${esc(m.texto)}</div><small>${fHora(m.fecha)}</small></div>`; }).join('');
    box.scrollTop = box.scrollHeight;
    const ult = ms.filter(m => m.de === 'negocio').map(m => m.fecha).sort().pop(); if (ult) LS.set(tKey('chatVisto'), ult);
  };
  const cargar = async () => {
    if (!chatClave()) { chat = null; $('#tch-datos', h.el).hidden = false; pinta(); return; }
    try { const c = await api('chatVer', { negocio: T.id, clave: chatClave() }, true); if (c.borrado) { LS.set(tKey('chat'), ''); chat = null; $('#tch-datos', h.el).hidden = false; } else chat = c; }
    catch (e) {}
    pinta();
  };
  const enviar = async () => {
    if (enviando) return;
    const inp = $('#tch-in', h.el), texto = inp.value.trim();
    if (!texto) throw new Error('Escribe tu mensaje');
    const datos = { negocio: T.id, texto, productoId: prod ? prod.id : '' };
    if (chatClave()) datos.clave = chatClave();
    else {
      const nombre = $('#tch-n', h.el).value.trim(), tel = $('#tch-t', h.el).value.trim();
      if (nombre.length < 3) throw new Error('Escribe tu nombre');
      if (tel.replace(/\D/g, '').length < 8) throw new Error('Escribe tu número de WhatsApp');
      Object.assign(datos, { nombre, telefono: tel });
      LS.set('cliente_tienda', JSON.stringify(Object.assign({}, cli, { nombre, telefono: tel })));
    }
    enviando = true; $('#tch-send', h.el).disabled = true;
    try {
      const c = await api('chatEnviar', datos, true);
      if (c.clave) LS.set(tKey('chat'), c.clave);
      chat = c; inp.value = ''; inp.style.height = ''; $('#tch-datos', h.el).hidden = true; pinta();
    } finally { enviando = false; $('#tch-send', h.el).disabled = false; }
  };
  $('#tch-send', h.el).onclick = () => enviar().catch(err);
  const inp = $('#tch-in', h.el);
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); enviar().catch(err); } });
  cargar();
  timer = setInterval(() => { if (!document.hidden && chatClave()) cargar(); }, 20000);
  h.botones([]);
}
async function misPedidosTienda() {
  const ids = LS.json(tKey('pedidos'), []) || [], cli = LS.json('cliente_tienda', {}) || {};
  const box = $('#t-mis'); if (!box || !ids.length || !cli.telefono) return;
  try {
    const l = await api('misPedidos', { negocio: T.id, telefono: cli.telefono, ids }, true);
    const est = { nuevo: ['Recibido', 'b-warn', '📨'], confirmado: ['Confirmado', 'b-info', '👍'], listo: ['¡Listo!', 'b-ok', '✅'], entregado: ['Entregado', 'b-mut', '🎉'], cancelado: ['Cancelado', 'b-bad', '✖️'] };
    const vis = l.filter(p => p.estado !== 'entregado' && p.estado !== 'cancelado' || (Date.now() - parseLocal(p.fecha).getTime()) < 86400000 * 2).slice(0, 3);
    box.innerHTML = vis.length ? `<div class="mis"><b>Tus pedidos</b>${vis.map(p => `<div class="mis-r"><span>${est[p.estado][2]} ${esc(p.numero)} · ${money(p.total)}</span><span class="badge ${est[p.estado][1]}">${est[p.estado][0]}</span></div>`).join('')}</div>` : '';
  } catch (e) {}
}

</script>
