<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e0a5a">
<title>Gestión de Negocio VM</title>
<meta name="description" content="Administra tu negocio: ventas, inventario, clientes, compras, gastos, caja, reportes y tienda en línea.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--h1:#8e0a5a;--h2:#ec1a82;--pri:#d10f6f;--onpri:#fff;--pri2:#fde7f1;--a1:#ff9500;--a2:#ffc83d;--tag:#ffd98a;
  --bg:#fdf6f9;--card:#fff;--ink:#1f1a24;--mut:#77707f;--line:#f8dbe9;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--glow:rgba(209,15,111,.35);
  --ok:#0f9d63;--okb:#e2f7ec;--warn:#d98a00;--warnb:#fff3dc;--bad:#e0243e;--badb:#ffe6ea;--info:#1d6ff2;--infob:#e5efff;--wa:#1fa855;
  --r:18px;--font:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
:root.dark{color-scheme:dark;--okb:#12301f;--warnb:#33270f;--badb:#3a1219;--infob:#13233f;--ok:#3fd18b;--bad:#ff6b7f;--warn:#ffb43d;--info:#6aa6ff}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.serif{font-family:var(--serif)}
.ic{display:block;flex:none}
h2,h3{margin:0;font-weight:600}h3{font-size:16px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.n{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
a{color:var(--pri)}
/* ===== Encabezado (hero) ===== */
.hero{background:radial-gradient(130% 150% at 15% 0%,var(--h2) 0%,var(--h1) 75%);color:#fff;text-align:center;padding:18px 18px 70px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent)}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-120px;bottom:-200px;background:radial-gradient(closest-side,color-mix(in srgb,var(--a2) 45%,transparent),transparent)}
.hero-top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;position:relative;z-index:1}
.hero-top .grp{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;cursor:pointer;position:relative}
body.panel #bnav,body.panel #tnav{display:none!important}body.panel #main{padding-bottom:40px}
.hbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:11px;font-weight:600;line-height:18px;padding:0 5px;box-shadow:0 0 0 2px var(--h1)}
.hero-c{position:relative;z-index:1}
.mono{width:64px;height:64px;border-radius:50%;margin:2px auto 6px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--tag) 80%,transparent);color:var(--tag);font:600 28px var(--serif);background:rgba(255,255,255,.08)}
.hero-logo{width:72px;height:72px;border-radius:20px;margin:0 auto 8px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero-logo img{max-width:100%;max-height:100%;object-fit:contain}
.hero-name{font:600 38px/1.05 var(--serif);letter-spacing:.01em}
.hero-tag{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--tag);margin-top:8px;font-weight:500}
.bar{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:15}
.bar-in{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto;padding:12px 12px 14px}
.bar-t{flex:1;font:600 23px var(--serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.bar .hbtn{background:rgba(255,255,255,.1);border-color:transparent}
.tnav{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:14px auto 0;padding:0 14px}
.tnav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:99px;font:500 14.5px var(--font);cursor:pointer;display:flex;align-items:center;gap:6px}
.tnav button:hover{color:var(--pri)}
.tnav button.on{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;box-shadow:0 6px 16px var(--glow)}
.tnav .cnt{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}
/* ===== Barra inferior (teléfono) ===== */
.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:space-around;align-items:flex-end;background:linear-gradient(120deg,var(--h1),var(--h2));border-radius:24px;padding:7px 6px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.bnav button{flex:1;border:0;background:none;color:rgba(255,255,255,.66);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px var(--font);letter-spacing:.02em;padding:6px 0;border-radius:14px;cursor:pointer;position:relative}
.bnav button.on{color:#fff}
.bnav button.on:before{content:"";position:absolute;top:-1px;width:22px;height:3px;border-radius:2px;background:var(--tag)}
.bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;line-height:16px;font-weight:600}
.bnav .sell{flex:none;width:62px;margin-top:-26px}
.bnav .sell i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:4px solid var(--bg);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bnav .sell.on:before{display:none}
@media(min-width:900px){.bnav{display:none}}
@media screen and (max-width:899px){.tnav{display:none}body.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
main{max-width:1100px;margin:auto;padding:16px 14px}
@media(max-width:600px){main{padding:14px 12px}}
/* ===== Botones / campos ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:13px;font:500 14.5px var(--font);cursor:pointer;white-space:nowrap;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(120deg,var(--h1),var(--h2));border-color:transparent;color:#fff;box-shadow:0 6px 16px var(--glow)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.acc{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.btn.acc:hover{color:#fff;filter:brightness(1.05)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{color:#fff;filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.bad:hover{background:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:16px}
.btn.icon{padding:8px;width:40px;height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri);padding:0}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.srch{position:relative}.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.srch input{padding-left:40px}
/* ===== Chips / pestañas ===== */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:500 13.5px var(--font);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.chip .c{background:var(--pri2);color:var(--pri);border-radius:9px;padding:0 6px;font-size:11.5px;font-weight:600}
.chip.on .c{background:rgba(255,255,255,.25);color:#fff}
.seg{display:inline-flex;background:var(--pri2);border-radius:14px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;color:var(--ink);padding:7px 14px;border-radius:11px;font:500 13.5px var(--font);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 2px 6px rgba(0,0,0,.08)}
/* ===== Tarjetas ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}.sec-t h3{margin:0;font-size:17px}
.sec-t a{color:var(--pri);font-size:13.5px;cursor:pointer;text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--k,var(--pri))}
.kpi small{display:block;color:var(--mut);font-size:12.5px}
.kpi b{display:block;font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
/* ===== Inicio ===== */
.cuenta-btn{width:100%;margin:-4px auto 16px;max-width:560px;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:20px;border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--pri),var(--a1));box-shadow:0 10px 26px var(--glow);font:inherit}.cuenta-btn .ci{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}.cuenta-btn b{display:block;font-size:16px}.cuenta-btn small{display:block;opacity:.85;font-size:12.5px;margin-top:1px}.cuenta-btn span{flex:1;min-width:0}
.cuenta-box{background:linear-gradient(135deg,rgba(87,48,230,.18),rgba(0,198,240,.12));border:1px solid var(--line);border-radius:18px;padding:16px 18px;font-size:16px;line-height:1.55;margin-bottom:14px}.cuenta-box .cb-f{display:flex;align-items:center;gap:8px;color:var(--pri);font-size:12px;letter-spacing:.08em;font-weight:700;margin-bottom:8px;text-transform:uppercase}.cuenta-box p{margin:0 0 10px}.cuenta-box p:last-child{margin:0}.cuenta-box .animo{color:var(--pri);font-weight:700}.cuenta-box.hablando{border-color:var(--pri);box-shadow:0 0 0 3px var(--glow)}
.today{position:relative;z-index:3;background:var(--card);border-radius:26px;box-shadow:0 14px 34px rgba(0,0,0,.12);padding:18px 18px 16px;margin:-52px auto 16px;max-width:560px;border:1px solid var(--line)}
.today-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.today small{color:var(--mut);font-size:13px}
.today .big{font-size:32px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.today .sub{font-size:13px;color:var(--mut);margin-top:2px}
.today .sub b{color:var(--ok);font-weight:600}
.spark{width:110px;height:46px;flex:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px var(--font);color:var(--ink);cursor:pointer;padding:2px 0}
.qa i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--q1),var(--q2));box-shadow:0 6px 14px color-mix(in srgb,var(--q1) 35%,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;color:var(--ink);cursor:pointer;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.04);position:relative;overflow:hidden;text-align:left;font:inherit;width:100%;min-width:0}
.tile .ti{background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--t1) 30%,transparent)}
.tile .tl{color:var(--mut);opacity:1}.tile .ts{color:var(--mut);opacity:1}.tile .ta{color:var(--mut);opacity:.7}
.tstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tstats button{border:0;background:var(--bg);border-radius:14px;padding:9px 8px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.tstats small{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tstats b{display:block;font-size:13.5px;font-weight:600;margin-top:2px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tstats b.ok{color:var(--ok)}
.tile .ti{width:40px;height:40px;border-radius:13px;display:grid;place-items:center}
.tile .tl{font-size:12.5px;letter-spacing:.01em}
.tile .tv{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ta{position:absolute;right:12px;top:14px;opacity:.85;z-index:1}
.t-pri{--t1:var(--h1);--t2:var(--h2)}.t-acc{--t1:color-mix(in srgb,var(--a1) 85%,#000);--t2:var(--a1)}
.t-verde{--t1:#00915a;--t2:#2fd58b}.t-naranja{--t1:#f25c05;--t2:#ffa83a}.t-azul{--t1:#1b4fd8;--t2:#3d9bff}
.t-rojo{--t1:#d61f3c;--t2:#ff6a6a}.t-morado{--t1:#6a1fe0;--t2:#b06cff}.t-cian{--t1:#008fa8;--t2:#22d3e6}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);cursor:pointer}
.li .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--t1,var(--h1)),var(--t2,var(--h2)));font-size:15px;overflow:hidden}
.li .av img{width:100%;height:100%;object-fit:cover}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .am{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .am small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.hg{max-width:560px;margin:0 auto}
@media(min-width:900px){
  .hero{padding-bottom:34px}.hero-name{font-size:44px}
  .hg{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:22px;align-items:start;max-width:none;margin-top:8px}
  .today{margin:0 0 16px;max-width:none}.tiles{grid-template-columns:repeat(3,1fr);max-width:none;margin:0}
  .tile .tv{font-size:21px}
}
/* ===== Etiquetas ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--pri2);color:var(--pri);white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--infob);color:var(--info)}.b-mut{background:color-mix(in srgb,var(--mut) 14%,transparent);color:var(--mut)}
/* ===== Vender ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);position:relative;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.pc:active{transform:scale(.98)}
.pc .ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;position:relative;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pc .ph .ini{font:600 30px var(--serif)}
.pc .bd{padding:9px 11px 11px}
.pc .nm{font-weight:500;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pc .pr{font-weight:600;font-size:16px;color:var(--pri);margin-top:4px;font-variant-numeric:tabular-nums}
.pc .st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);color:#333;border-radius:8px;padding:1px 7px;z-index:1}
.pc .st.low{background:#fff1e0;color:#c76a00}
.pc .qn{position:absolute;top:8px;right:8px;z-index:1;min-width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 7px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.pc .add{position:absolute;right:9px;bottom:9px;width:32px;height:32px;border-radius:11px;background:var(--pri2);color:var(--pri);display:grid;place-items:center}
.vuela{position:fixed;z-index:200;pointer-events:none;overflow:hidden;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--t1,var(--h1)),var(--t2,var(--h2)));color:#fff;box-shadow:0 10px 24px rgba(0,0,0,.25)}.vuela img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;border-radius:20px;padding:10px 12px 10px 14px;box-shadow:0 12px 28px rgba(0,0,0,.25);cursor:pointer;border:0;font:inherit;max-width:560px;margin:0 auto}
.cartbar .ci{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative}
.cartbar .ci b{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--a1);font-size:11.5px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}

function sha256(bytes) {
  const K = [], H = [], frac = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2, cnt = 0; cnt < 64; n++) {
    let primo = true;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) { primo = false; break; }

  dv.setUint32(buf.length - 4, (l * 8) >>> 0);
  dv.setUint32(buf.length - 8, Math.floor(l * 8 / 4294967296));
  const W = new Int32Array(64), rot = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < buf.length; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getInt32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rot(W[i - 15], 7) ^ rot(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rot(W[i - 2], 17) ^ rot(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  const out = [];
  H.forEach(x => out.push((x >>> 24) & 255, (x >>> 16) & 255, (x >>> 8) & 255, x & 255));

async function api(action, data, silent) {
  if (S.tienda && TIENDA_ACC.has(action) && !(data && data.tienda !== undefined)) data = Object.assign({ tienda: S.tienda }, data || {});
  if (DEMO.on) return demoApi(action, data, silent);
  const url = apiUrl();
  if (!url) throw new Error('Configura primero la URL del servidor (Apps Script)');
  if (!silent) loader(true);
  try {
    let r;
    try {
      r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, panel: S.enPanel ? P.tok : undefined, data: data || {} }), redirect: 'follow' });
    } catch (e) { throw new Error('Sin conexión con el servidor. Revisa tu internet.'); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('Respuesta inválida del servidor. Verifica que la App web esté implementada con acceso «Cualquier usuario».'); }
    if (!j.ok) return manejarError(j.error);
    return j.data;
  } finally { if (!silent) loader(false); }
}
function manejarError(m) {
  m = String(m || 'Error');
  if (m.indexOf('PRUEBA_VENCIDA|') === 0) { let info = {}; try { info = JSON.parse(m.slice(15)); } catch (e) {} if (!S.enTienda && !S.sinPausa) mostrarVencida(info); throw new Error(info.tipo === 'pago' ? 'El programa está en pausa por un pago pendiente' : info.tipo === 'bloqueada' ? 'El acceso está pausado' : 'Tu período de prueba terminó'); }
  if (m === 'SESION') { if (!S.enTienda && !S.vencidaVista) salir(true); throw new Error('Tu sesión expiró. Ingresa de nuevo.'); } // con la pantalla de pausa a la vista, no se cambia por la de ingreso
  if (m === 'PANEL') { if (S.enPanel) { cerrarHojas(); panelLogin(); } throw new Error('Tu sesión del panel expiró. Entra de nuevo.'); }
  if (m.indexOf('Acción no válida') === 0) throw new Error('Esta función necesita la versión nueva del servidor. Escríbenos por WhatsApp al +504 3313-0265 para activarla.');
  throw new Error(m);
}
async function demoApi(action, data, silent) {
  if (!silent) loader(true);
  const token = S.token, panel = S.enPanel ? P.tok : undefined, dat = JSON.parse(JSON.stringify(data || {})); // como en el servidor real: lo que se mandó al tocar
  try {
    await (DEMO.src ? new Promise(r => setTimeout(r, 120)) : demoFuente());
    const route = demoBackend();

    try { res = route({ action, token: token, panel: panel, data: dat }); }

}

    h.f.innerHTML = ''; h.f.hidden = !(bs && bs.length);
    (bs || []).forEach(b => {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'btn ' + (b.cls || ''); x.innerHTML = b.t;

      if (h.ocupado) x.disabled = true;
      x.onclick = async () => {
        if (x.disabled || h.ocupado) return;
        h.ocupado = true; $$('button', h.f).forEach(y => { y.disabled = true; });
        try { await b.fn(h, x); } catch (e) { err(e); } finally { h.ocupado = false; $$('button', h.f).forEach(y => { y.disabled = false; }); }
      };
      h.f.appendChild(x);
    });

function cargarLib(k) {
  const listo = { chart: () => window.Chart, canvas: () => window.html2canvas, qr: () => window.qrcode, zxing: () => window.ZXing }[k];

async function arrancar() {
  let cache = LS.json(cacheKey(), null);
  if (cache && cache.usuario) { aplicarDatos(cache); S.cobroVM = null; mostrarApp(); } else cache = null; // el pago pendiente se toma del dato fresco
  try {
    const tReq = S.tienda || '';
    const d = await api('bootstrap', { inicio: true, app: APP_VER, vid: DEMO.on ? '' : miOrigen().v || '' }, !!cache);
    const ini = d.inicio || null; delete d.inicio;
    aplicarDatos(d);
    // D7: el Inicio que trae el arranque solo sirve si es de la tienda en la que se quedó (pudo elegir otra mientras cargaba)
    if ((S.tienda || '') === tReq || tiendaFija()) { S.inicio = ini; if (ini) S.inicioT = Date.now(); } else S.inicio = null;
    try { LS.set(cacheKey(), JSON.stringify(d)); } catch (e) {}
    if (!cache) mostrarApp(); else { if (S.vista && !puedeVer(S.vista)) ir('inicio'); else render(); if (debeAvisarCobro() && !PILA.length) avisoCobro(); } // si cambió el usuario o su permiso, no se queda en una pantalla que ya no le toca
  } catch (e) {
    if (!cache || !S.token) throw e;
    toast('Sin conexión: mostrando los últimos datos guardados', 'error');
  }
}
function aplicarDatos(d) {
  ['config', 'usuarios', 'productos', 'clientes', 'proveedores', 'gastoCats', 'giros'].forEach(k => { if (d[k]) S[k] = d[k]; });

/* Revisa si llegaron pedidos en línea nuevos (cada minuto) */
let vigilando = null;
function vigilarPedidos() {
  if (vigilando || !puede('admin', 'cajero')) return;
  let ultOculto = 0;
  const revisar = async () => {
    if (!S.user || !puede('admin', 'cajero')) return;
    if (document.hidden) { if (!avisosOn() || Date.now() - ultOculto < 110000) return; ultOculto = Date.now(); } // en segundo plano revisa cada 2 min, solo si hay avisos activados
    try {
      const r = await api('pendientes', {}, true);
      if (r.avisos) avisosDelDia(r.avisos);
      const antes = S.pedidosNuevos, antesM = S.chatsNuevos, antesS = S.soporteNuevos || 0;
      S.pedidosNuevos = r.nuevos || 0; S.chatsNuevos = r.mensajes || 0; S.soporteNuevos = r.soporte || 0;
      if (S.soporteNuevos > antesS && S.yaReviso) { toast('💬 El administrador te respondió. Ábrelo en Ayuda.', 'ok', 6000); try { navigator.vibrate && navigator.vibrate([80, 40, 80]); } catch (e) {} notificar('soporte', 'El administrador te respondió', 'Ábrelo en Ayuda › Contactar al administrador', 'inicio'); }
      if (S.chatsNuevos > antesM && S.yaReviso) { toast('💬 Tienes un mensaje nuevo en tu tienda', 'ok', 6000); try { navigator.vibrate && navigator.vibrate([80, 40, 80]); } catch (e) {} notificar('mensajes', 'Mensaje nuevo en tu tienda', S.chatsNuevos === 1 ? '1 conversación sin responder' : S.chatsNuevos + ' conversaciones sin responder', 'mensajes'); if (S.vista === 'mensajes' && !PILA.length) R.mensajes(); }
      if (S.pedidosNuevos > antes && antes >= 0 && S.yaReviso) { toast('🛍️ ¡Nuevo pedido en línea!', 'ok', 6000); try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {} notificar('pedidos', '¡Nuevo pedido en línea!', S.pedidosNuevos === 1 ? '1 pedido por confirmar' : S.pedidosNuevos + ' pedidos por confirmar', 'pedidos'); if (S.vista === 'pedidos') R.pedidos(); }
      S.yaReviso = true;
      if (S.pedidosNuevos !== antes || S.chatsNuevos !== antesM || S.soporteNuevos !== antesS) { pintarHeader(); pintarNav(); }
    } catch (e) {}
  };
  revisar();
  vigilando = setInterval(revisar, 30000);
}

function sparkSVG(vals) {
  const max = Math.max(1, ...vals), w = 110, h = 46, n = vals.length;
  const pts = vals.map((v, i) => [2 + i * (w - 4) / (n - 1), h - 6 - (v / max) * (h - 14)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--h2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--h2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${last[0]} ${h} L2 ${h}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="var(--h2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--h2)"/></svg>`;
}

      tareas.push(`tienes *${money(ini.porCobrar.total)}* por cobrar${con.length ? ': hoy puede ser un buen día para recordarle a ' + con.join(' y a ') : ''}`);
    }
    if (ini.pedidos && ini.pedidos.nuevos) tareas.push(`*${ini.pedidos.nuevos === 1 ? '1 pedido nuevo' : ini.pedidos.nuevos + ' pedidos nuevos'}* en la tienda en línea ${ini.pedidos.nuevos === 1 ? 'espera' : 'esperan'} tu confirmación`);
    if (ini.stock && ini.stock.bajos) tareas.push(`*${ini.stock.bajos === 1 ? '1 producto está' : ini.stock.bajos + ' productos están'} por agotarse*${ini.stock.lista && ini.stock.lista.length ? ' (' + ini.stock.lista.slice(0, 2).map(x => x.nombre).join(', ') + ')' : ''}`);
    if (extra && extra.kpi && extra.kpi.n) tareas.push(`esta semana llevas *${money(extra.kpi.ventas)}* en ${extra.kpi.n === 1 ? '1 venta' : extra.kpi.n + ' ventas'}`);
    if (tareas.length) F.push(tareas.map(cap).join('. ') + '.');
    F.push(rotaDia(ANIMO_CIERRE, 3));
    return { frases: F, animo: true };
  }
  const ap = rotaDia(CUENTA_APERTURA, 11).replace('{P}', p[1]).replace('{p}', p[0]);
  F.push(`${ap} *${k.n === 1 ? '1 factura' : k.n + ' facturas'}* y vendiste *${money(k.ventas)}*${k.articulos ? ' (' + cant(k.articulos) + (k.articulos === 1 ? ' artículo)' : ' artículos)') : ''}.`);
  if (k.costo > 0) F.push(`Lo vendido te costó *${money(k.costo)}*, así que tu ganancia bruta fue *${money(k.bruta)}*.`);
  else F.push(`Tu ganancia bruta fue *${money(k.bruta)}* (no hay costos anotados en estos productos, así que se calcula sobre todo lo vendido).`);
  if (k.gastos > 0) F.push(`Pagaste *${money(k.gastos)}* de gastos y te quedan *${money(k.neta)}* de ganancia neta, un margen del *${cant(Math.round(k.margen))} %*.`);
  else F.push(`No hubo gastos anotados, así que la ganancia neta queda en *${money(k.neta)}*, un margen del *${cant(Math.round(k.margen))} %*.`);
  if (!S.tienda && d.secciones && d.secciones.length > 1) { const sv = d.secciones.filter(x => x.ventas > 0).sort((a, b) => b.ventas - a.ventas); if (sv.length > 1) F.push(`Por sección: ${sv.map(x => `${giroCorto(x.id)} *${money(x.ventas)}*`).join(', ')}.`); }
  if (d.top && d.top.length) { const t = d.top[0]; F.push(`El producto más vendido fue *${t.nombre}* (${cant(t.cantidad)} ${t.cantidad === 1 ? 'unidad' : 'unidades'}, ${money(t.total)}).`); }
  const mov = [];
  if (k.compras > 0) mov.push(`compraste *${money(k.compras)}* a proveedores`);
  if (k.pagos > 0) mov.push(`les pagaste *${money(k.pagos)}*`);
  if (k.cobros > 0) mov.push(`cobraste *${money(k.cobros)}* a clientes`);
  if (k.credito > 0) mov.push(`vendiste *${money(k.credito)}* al crédito`);
  if (mov.length) F.push(cap(mov.join(', ')) + '.');
  if (k.clientesNuevos > 0) F.push(`Registraste *${k.clientesNuevos === 1 ? '1 cliente nuevo' : k.clientesNuevos + ' clientes nuevos'}*.`);

  }

  return { frases: F, animo: false };
}

  if (!nativo) { try { loader(true); await cargarLib('zxing'); } catch (e) { loader(false); toast(e.message, 'error'); return; } finally { loader(false); } }
  let stream, activo = true, ultimo = '', tUlt = 0, lector = null;
  const h = hoja({ titulo: 'Escanear código', cls: 'chica', html: `<div class="scan"><video id="sc-v" playsinline muted></video><i></i></div><p class="sm mut" style="text-align:center">Apunta al código de barras</p>`, onClose: () => { activo = false; if (lector) { try { lector.reset(); } catch (e) {} } if (stream) stream.getTracks().forEach(t => t.stop()); } });
  try {
    const v = $('#sc-v', h.el);
    const leido = c => { if (c !== ultimo || Date.now() - tUlt > 3000) { ultimo = c; tUlt = Date.now(); try { navigator.vibrate && navigator.vibrate(40); } catch (e) {} const r = cb(c); if (una || r === true) { activo = false; h.cerrar(); } } };
    if (!nativo) { // respaldo: ZXing lee EAN, UPC, Code 128, QR… desde el video
      lector = new ZXing.BrowserMultiFormatReader();
      await lector.decodeFromVideoDevice(undefined, v, r => { if (activo && r) leido(r.getText()); });
      if (!activo) { try { lector.reset(); } catch (e) {} } // E15: se cerró mientras la cámara arrancaba
      return;
    }
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    if (!activo) { stream.getTracks().forEach(t => t.stop()); return; } // E15: se cerró antes de dar permiso: la cámara no queda encendida
    v.srcObject = stream; await v.play();
    const det = new BarcodeDetector();
    const loop = async () => {
      if (!activo) return;
      try { const r = await det.detect(v); if (r.length) { leido(r[0].rawValue); if (una) return; } } catch (e) {}
      setTimeout(loop, 250);
    };
    loop();
  } catch (e) { h.cerrar(); toast('No se pudo abrir la cámara', 'error'); }
}

function comprimirImagen(file, max) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.8));
    }; img.onerror = () => mal(new Error('No se pudo leer la imagen')); img.src = fr.result; };
    fr.onerror = () => mal(new Error('No se pudo leer la imagen'));
    fr.readAsDataURL(file);
  });
}

function calcPrecio(c) {
  const costo = num(c.costo), pct = num(c.pct), tasa = c.isv ? num(S.config.isv) : 0;
  if (!(costo > 0) || c.pct === '' || pct < 0) return null;
  if (c.sobre === 'precio' && pct >= 100) return { error: 'Sobre el precio de venta, la ganancia tiene que ser menor que 100%' };
  const neto = c.sobre === 'precio' ? costo / (1 - pct / 100) : costo * (1 + pct / 100);
  const precio = redondear(neto * (1 + tasa), c.red);
  const netoF = precio / (1 + tasa), g = netoF - costo;
  return { costo, precio, tasa, isv: r2(precio - netoF), g: r2(g), sobreCosto: g / costo * 100, sobrePrecio: netoF > 0 ? g / netoF * 100 : 0, redondeo: r2(precio - neto * (1 + tasa)) };
}

        <div class="f3"><label class="fld"><span>Categoría</span><input data-i="${i}" data-k="categoria" list="dl-cat-c" maxlength="40" value="${esc(n.categoria)}" placeholder="General"></label><label class="fld"><span>Código</span><input data-i="${i}" data-k="codigo" maxlength="40" value="${esc(n.codigo)}" placeholder="Opcional"></label><label class="fld"><span>ISV</span><select data-i="${i}" data-k="tasaIsv"><option value="">${isvG}%</option><option value="0">Exento</option><option value="15">15%</option><option value="18">18%</option></select></label></div>
        ${numeros(l, i)}
        <div class="chips cl-pct">${[20, 30, 40, 50, 100].map(x => `<button type="button" class="chip ${num(l.pct) === x && l.pctFijo ? 'on' : ''}" data-chip="${i}" data-v="${x}">${x}%</button>`).join('')}</div>
        <small class="hint" id="fc-h${i}">${hintL(i)}</small></div>`;
      }
      const p = prodL(l);
      return `<div class="cl"><div class="cl-h">${avatarProd(p, 'av sm')}<b>${esc(p.nombre)}</b><small>hay ${cant(p.stock)}</small><button class="btn icon ghost" data-q="${i}" aria-label="Quitar">${ic('x', 18)}</button></div>
        ${numeros(l, i)}
        <small class="hint" id="fc-h${i}">${hintL(i)}</small></div>`;
    }).join('') || `<div class="empty">Busca y agrega los productos que compraste.<br><small>¿Es un producto que todavía no tienes? Toca <b>Nuevo</b> y créalo aquí mismo, con su precio de venta.</small></div>`;
    st.lineas.forEach((l, i) => { if (l.nuevo) { const s = $(`select[data-i="${i}"][data-k="tasaIsv"]`, h.el); if (s) s.value = l.nuevo.tasaIsv; } });
    $('#fc-t', h.el).textContent = money(total());
    if (foco) { const x = $(foco, h.el); if (x) { x.focus(); try { x.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} } }
  };
  // Refresca solo los campos calculados de una línea (sin redibujar, para no perder el cursor)
  const refresca = (i, salvo) => {
    const l = st.lineas[i], f = k => $(`[data-i="${i}"][data-k="${k}"]`, h.el);
    if (salvo !== 'precio' && f('precio')) f('precio').value = l.precio === undefined ? '' : l.precio;
    if (salvo !== 'pct' && f('pct')) f('pct').value = l.pct === undefined ? '' : l.pct;
    $$(`[data-chip="${i}"]`, h.el).forEach(c => c.classList.toggle('on', l.pctFijo && num(l.pct) === num(c.dataset.v)));
    const hn = $('#fc-h' + i, h.el); if (hn) hn.innerHTML = hintL(i);
    $('#fc-t', h.el).textContent = money(total());
  };
  const cambia = (i, k, v, boton) => {
    const l = st.lineas[i];
    if (['nombre', 'categoria', 'codigo', 'tasaIsv'].includes(k)) { l.nuevo[k] = v; if (k === 'tasaIsv' && l.pctFijo) { const c = precioCalc(l); if (c) l.precio = c; } else if (k === 'tasaIsv') l.pct = pctReal(l); refresca(i); return; }
    l[k] = v;
    if (k === 'pct') { l.pctFijo = String(v).trim() !== ''; const c = precioCalc(l); if (c) l.precio = c; }
    else if (k === 'precio') { l.pctFijo = false; l.pct = pctReal(l); }
    else if (k === 'costo') { if (l.pctFijo) { const c = precioCalc(l); if (c) l.precio = c; } else l.pct = pctReal(l); }
    refresca(i, boton ? null : k);
  };
  const sugs = () => {
    const t = q.value.trim(), v = norm(t);
    if (!v) { sg.innerHTML = ''; return; }
    const l = S.productos.filter(p => p.activo && p.tipo === 'producto' && (norm(p.nombre).includes(v) || norm(p.codigo).includes(v))).slice(0, 8);
    // Si ya existe con ese nombre exacto (aunque sea un servicio o esté desactivado) no se ofrece crearlo de nuevo
    const igual = S.productos.find(p => norm(p.nombre) === v);
    const nota = igual && !(igual.activo && igual.tipo === 'producto')
      ? `<small class="mut sug-nota">«${esc(igual.nombre)}» ya existe ${!igual.activo ? 'pero está desactivado: actívalo en Productos' : 'como servicio (no lleva existencias): cámbialo en Productos si quieres comprarlo'}.</small>` : '';
    sg.innerHTML = l.map(p => `<button type="button" data-add="${p.id}">${avatarProd(p, 'av sm')}<span>${esc(p.nombre)}</span><small>${moneyU(p.costo)}</small></button>`).join('')
      + (igual ? nota : `<button type="button" class="sug-new" data-crear="1">${ic('plus', 18)}<span>Crear <b>«${esc(t)}»</b> como producto nuevo</span></button>`);
  };
  const agregar = p => {
    const ex = st.lineas.find(l => l.id === p.id);
    if (ex) ex.cantidad = num(ex.cantidad) + 1;
    else { const l = { id: p.id, cantidad: 1, costo: p.costo || '', precio: p.precio, pct: '' }; l.pct = pctReal(l); st.lineas.push(l); }
    q.value = ''; sg.innerHTML = ''; pintaL();
  };
  const crear = texto => {
    const t = String(texto || '').trim(), esCodigo = /^\d{6,}$/.test(t);
    st.lineas.push({ nuevo: { nombre: esCodigo ? '' : t, codigo: esCodigo ? t : '', categoria: '', tasaIsv: '' }, cantidad: 1, costo: '', precio: '', pct: '', pctFijo: false });
    q.value = ''; sg.innerHTML = '';
    const i = st.lineas.length - 1;
    pintaL(`[data-i="${i}"][data-k="${t && !esCodigo ? 'costo' : 'nombre'}"]`);
  };
  q.addEventListener('input', sugs);
  q.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return; e.preventDefault();
    const t = q.value.trim(); if (!t) return;
    const p = S.productos.find(x => x.activo && x.tipo === 'producto' && x.codigo && x.codigo.toLowerCase() === t.toLowerCase());
    if (p) return agregar(p);
    const v = norm(t), igual = S.productos.filter(x => x.activo && x.tipo === 'producto' && norm(x.nombre) === v);
    if (igual.length === 1) return agregar(igual[0]);
    const parecidos = S.productos.filter(x => x.activo && x.tipo === 'producto' && (norm(x.nombre).includes(v) || norm(x.codigo).includes(v)));
    if (parecidos.length === 1) return agregar(parecidos[0]);
    if (!parecidos.length && !S.productos.some(x => norm(x.nombre) === v)) crear(t);
  });
  sg.addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) return agregar(byId(S.productos, b.dataset.add)); if (e.target.closest('[data-crear]')) crear(q.value); });
  const fl = $('#fc-l', h.el);
  fl.addEventListener('input', e => { const x = e.target.closest('[data-i]'); if (!x || x.tagName === 'SELECT') return; cambia(Number(x.dataset.i), x.dataset.k, x.value); });
  fl.addEventListener('change', e => { const x = e.target.closest('select[data-i]'); if (x) cambia(Number(x.dataset.i), x.dataset.k, x.value); });
  fl.addEventListener('click', e => {
    const d = e.target.closest('[data-q]'); if (d) { st.lineas.splice(Number(d.dataset.q), 1); pintaL(); return; }
    const s = e.target.closest('[data-sug]'); if (s) { cambia(Number(s.dataset.sug), 'pct', s.dataset.pct, 1); return; }
    const c = e.target.closest('[data-chip]'); if (c) { cambia(Number(c.dataset.chip), 'pct', c.dataset.v, 1); }
  });
  $('#fc-m', h.el).addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; st.metodo = b.dataset.m; $$('#fc-m .pay', h.el).forEach(x => x.classList.toggle('on', x === b)); });
  ACC.fcNuevoProv = () => formProveedor(null, g => { const s = $('#fc-p', h.el); s.insertAdjacentHTML('beforeend', `<option value="${g.id}">${esc(g.nombre)}</option>`); s.value = g.id; });
  ACC.fcNuevoProd = () => crear(q.value);
  pintaL();
  h.botones([{ t: 'Guardar compra', cls: 'pri big', fn: async () => {
    if (!st.lineas.length) throw new Error('Agrega al menos un producto');
    const malo = st.lineas.findIndex(l => l.nuevo && (!l.nuevo.nombre.trim() || !(num(l.precio) > 0)));
    if (malo >= 0) { const l = st.lineas[malo]; pintaL(`[data-i="${malo}"][data-k="${l.nuevo.nombre.trim() ? 'precio' : 'nombre'}"]`); throw new Error(l.nuevo.nombre.trim() ? 'Ponle el precio de venta a «' + l.nuevo.nombre.trim() + '»' : 'Escribe el nombre del producto nuevo'); }
    const repetido = st.lineas.find(l => l.nuevo && S.productos.some(p => norm(p.nombre) === norm(l.nuevo.nombre)));
    if (repetido) throw new Error('Ya tienes un producto llamado «' + repetido.nuevo.nombre.trim() + '». Búscalo en la lista en vez de crearlo.');
    const sinCosto = st.lineas.filter(l => !(num(l.costo) > 0));
    if (sinCosto.length && !(await confirmar(`${sinCosto.length === 1 ? 'Una línea no tiene' : sinCosto.length + ' líneas no tienen'} costo (${sinCosto.map(l => '«' + esc(l.nuevo ? l.nuevo.nombre : (byId(S.productos, l.id) || {}).nombre || '') + '»').join(', ')}). Sin costo, la ganancia de esos productos se verá mayor de lo real. ¿Guardar así?`, { si: 'Guardar sin costo' }))) return;
    const r = await api('compra', { proveedorId: $('#fc-p', h.el).value, factura: $('#fc-f', h.el).value, fecha: $('#fc-d', h.el).value, metodo: st.metodo, nota: $('#fc-n', h.el).value,
      items: st.lineas.map(l => Object.assign({ cantidad: num(l.cantidad), costo: num(l.costo), precio: String(l.precio).trim() === '' ? '' : num(l.precio), margen: l.pctFijo && num(l.pct) > 0 ? num(l.pct) : '' },
        l.nuevo ? { nuevo: { nombre: l.nuevo.nombre.trim(), categoria: l.nuevo.categoria.trim(), codigo: l.nuevo.codigo.trim(), tasaIsv: l.nuevo.tasaIsv } } : { productoId: l.id })) });
    S.productos = r.productos; S.proveedores = r.proveedores; guardarCache(); S.inicio = null;
    const nn = (r.nuevos || []).length;
    h.cerrar(); toast('Compra ' + r.compra.numero + ' guardada · existencias actualizadas' + (nn ? ` · ${nn} producto${nn > 1 ? 's' : ''} nuevo${nn > 1 ? 's' : ''}` : ''), 'ok', 4500);
    if (S.hProv) S.hProv.pinta().catch(() => {});
    if (S.vista === 'compras') R.compras(); else if (S.vista === 'inicio') R.inicio(); else if (S.vista === 'productos') R.productos();
  } }]);
}

/* ===================== GASTOS ===================== */
const CATS_GASTO = ['Alquiler', 'Servicios', 'Planilla', 'Transporte', 'Publicidad', 'Insumos', 'Mantenimiento', 'Impuestos', 'Comisiones', 'Otros'];
R.gastos_bar = () => `<button class="hbtn" data-a="nuevoGasto" aria-label="Registrar gasto">${ic('plus', 22)}</button>`;
R.gastos = async () => {
  const per = S.f.gper || 'mes', [desde, hasta] = rangoPer(per);
  $('#main').innerHTML = `<div class="chips" style="margin-bottom:12px">${['hoy', 'mes', 'ant', 'anio'].map(k => `<button class="chip ${per === k ? 'on' : ''}" data-a="gper" data-k="${k}">${PERIODOS[k]}</button>`).join('')}</div><div id="ga-b"><div class="empty">Cargando…</div></div>`;
  const llave = per + '|' + (S.tienda || ''), l = await api('gastos', { desde, hasta }, true);

    ${Object.keys(pc).length > 1 ? `<div class="panel"><h3>Por categoría</h3>${Object.keys(pc).sort((a, b) => pc[b] - pc[a]).map(k => `<div class="rank"><span class="nm">${esc(k)}</span><span class="bw"><i style="width:${(pc[k] / pc[top] * 100).toFixed(1)}%"></i></span><span class="v n">${money(pc[k])}</span></div>`).join('')}</div>` : ''}
    <div class="list">${l.map(g => `<div class="li ${g.anulado ? 'anul' : ''}" data-a="verGasto" data-id="${g.id}"><div class="av ${colorDe(g.categoria)}">${ic('receipt', 20)}</div><div class="tx"><b>${esc(g.detalle)}</b><small>${esc(g.categoria)} · ${esc(fFecha(g.fechaGasto))}${g.proveedor ? ' · ' + esc(g.proveedor) : ''} · ${esc(g.metodo)}${repMulti() && g.giro ? ' · ' + esc(secNom(g.giro)) : ''}${g.anulado ? ' · anulado' : ''}</small></div><div class="am n">${money(g.monto)}</div></div>`).join('') || `<div class="empty">No hay gastos en este periodo</div>`}</div>`;
};
ACC.gper = el => { S.f.gper = el.dataset.k; R.gastos(); };
ACC.nuevoGasto = () => formGasto(null);
ACC.verGasto = el => { const g = (S.gastosL || []).find(x => x.id === el.dataset.id); if (g) formGasto(g); };
function formGasto(g) {
  const nuevo = !g; g = g || { fechaGasto: hoy(), metodo: 'Efectivo' };

    <label class="fld"><span>Detalle</span><input id="gf-d" list="dl-gd" value="${esc(g.detalle || '')}" placeholder="Ej. Energía eléctrica"><datalist id="dl-gd"></datalist><small class="hint" id="gf-ult"></small></label>
    <div class="f2"><label class="fld"><span>Monto</span><input id="gf-m" inputmode="decimal" value="${g.monto || ''}"></label><label class="fld"><span>Fecha</span><input id="gf-f" type="date" value="${g.fechaGasto}" max="${hoy()}"></label></div>
    <label class="fld"><span>Pagado a (opcional)</span><input id="gf-p" list="dl-gp" value="${esc(g.proveedor || '')}"><datalist id="dl-gp">${[...new Set([].concat(...S.gastoCats.map(c => c.proveedores)))].map(p => `<option value="${esc(p)}">`).join('')}</datalist></label>
    <div class="fld"><span>Forma de pago</span><div class="pays three" id="gf-mt">${[['Efectivo', 'cash'], ['Tarjeta', 'card'], ['Transferencia', 'transfer']].map(([m, i]) => `<button class="pay ${m === metodo ? 'on' : ''}" data-m="${m}">${ic(i)}${m === 'Transferencia' ? 'Transfer.' : m}</button>`).join('')}</div><small class="hint">Los gastos en efectivo se restan de la caja.</small></div>
    ${secs.length ? `<div class="fld"><span>¿De qué sección es?</span><div class="chips wrap gf-sec" id="gf-g">${[''].concat(secs).map(id => `<button type="button" class="chip ${giroG === id ? 'on' : ''}" data-g="${id}">${id ? `<i class="sd" style="background:${secColor(id)}"></i>${esc(secNom(id))}` : 'General · se reparte'}</button>`).join('')}</div><small class="hint">Lo general (alquiler, luz, planilla…) se reparte entre las secciones según lo que vende cada una.</small></div>` : ''}

  $('#gf-mt', h.el).addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (!b) return; metodo = b.dataset.m; $$('#gf-mt .pay', h.el).forEach(x => x.classList.toggle('on', x === b)); });
  const gg = $('#gf-g', h.el); if (gg) gg.addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (!b) return; giroG = b.dataset.g; $$('.chip', gg).forEach(x => x.classList.toggle('on', x === b)); });

  const bs = [];
  if (!nuevo && puede('admin')) bs.push({ t: 'Anular', cls: 'bad', fn: async () => {

    const r = await api('anularGasto', { id: g.id }); S.gastoCats = r.cats; guardarCache(); h.cerrar(); toast('Gasto anulado', 'ok'); if (S.vista === 'gastos') R.gastos();
  } });
  bs.push({ t: nuevo ? 'Guardar gasto' : 'Guardar cambios', cls: 'pri', fn: async () => {
    const r = await api('guardarGasto', { registro: { id: g.id, categoria: ci.value, detalle: di.value, monto: num($('#gf-m', h.el).value), fechaGasto: $('#gf-f', h.el).value, proveedor: $('#gf-p', h.el).value, metodo, nota: $('#gf-n', h.el).value, giro: secs.length ? giroG : undefined } });
    S.gastoCats = r.cats; guardarCache(); S.inicio = null; h.cerrar(); toast('Gasto guardado', 'ok');
    if (S.vista === 'gastos') R.gastos(); else if (S.vista === 'inicio') R.inicio(); else if (S.vista === 'caja') R.caja();
  } });
  h.botones(bs);

/* ===================== CAJA ===================== */
const DENOM = [500, 200, 100, 50, 20, 10, 5, 2, 1];
const smoney = n => (n < 0 ? '−' : '+') + money(Math.abs(n));
R.caja = async () => {
  const m = $('#main');
  if (!S.cajaD) m.innerHTML = '<div class="empty">Cargando…</div>';
  const llave = (S.tienda || '') + '|' + (S.f.cjt || ''), d = await api('caja', S.tienda ? {} : { caja: S.f.cjt || '' }, !!S.cajaD);
  if (S.vista !== 'caja' || llave !== (S.tienda || '') + '|' + (S.f.cjt || '')) return; // otra caja elegida mientras cargaba
  S.cajaD = d;
  const k = d.k, esp = r2(d.fondo + k.ventas + k.cobros - k.gastos - k.pagos - k.compras);
  const fila = (t, v, signo, cls) => `<div class="cj-r ${cls || ''}"><span>${t}</span><b class="n">${signo}${money(v)}</b></div>`;
  // Una caja por tienda: en «todas las tiendas» se elige cuál caja ver o cerrar

function secColor(id) { const i = girosOn().indexOf(id), l = esOscuro() ? SEC_COL.oscuro : SEC_COL.claro; return i >= 0 && i < l.length ? l[i] : '#8a8296'; }
const giroCorto = id => giroN(id).replace(/\s*\(.*\)\s*$/, ''); // «Compras en línea (Shein, Temu…)» → «Compras en línea»
const secNom = id => `${GIRO_EMO[id] || '📦'} ${giroCorto(id)}`;
const secSlug = id => norm(giroCorto(id)).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
function secSelector() {
  const g = S.f.rgiro || '';
  return `<div class="rsec"><span class="rsec-l">Ver</span><div class="chips">${[''].concat(girosOn()).map(id => `<button class="chip ${g === id ? 'on' : ''}" data-a="rgiro" data-k="${id}">${id ? `<i class="sd" style="background:${secColor(id)}"></i>${esc(secNom(id))}` : 'Todo el negocio'}</button>`).join('')}</div></div>`;
}
ACC.rgiro = el => { S.f.rgiro = el.dataset.k; const r = R.reportes(); if (r && r.catch) r.catch(err); };
// La sección elegida siempre queda a la vista en la fila de chips
function secALaVista() { const c = $('.rsec .chips'), on = c && $('.chip.on', c); if (on) c.scrollLeft = Math.max(0, on.offsetLeft - c.offsetLeft - (c.clientWidth - on.offsetWidth) / 2); }
ACC.verSeccion = el => { S.f.rgiro = el.dataset.k; S.f.rtab = 'resumen'; const r = R.reportes(); if (r && r.catch) r.catch(err); window.scrollTo({ top: 0, behavior: 'smooth' }); };
ACC.repCSV = () => { if (S.repCSV) S.repCSV(); else toast('Espera a que termine de cargar para descargar', 'error'); };
const enRep = t => S.vista === 'reportes' && (S.f.rtab || 'resumen') === t && $('#rp');

async function repResumen() {
  const per = S.f.rper || 'mes';
  let [desde, hasta] = per === 'otro' ? [S.f.rdesde || hoy(), S.f.rhasta || hoy()] : rangoPer(per);
  $('#rp').innerHTML = `<div class="chips" style="margin:12px 0 8px">${['hoy', 'd7', 'mes', 'ant', 'anio'].map(k => `<button class="chip ${per === k ? 'on' : ''}" data-a="rper" data-k="${k}">${PERIODOS[k]}</button>`).join('')}<button class="chip ${per === 'otro' ? 'on' : ''}" data-a="rper" data-k="otro">Elegir fechas</button></div>
    ${per === 'otro' ? `<div class="row" style="margin-bottom:10px"><input type="date" id="r-d" value="${desde}" max="${hoy()}" style="width:auto"><span class="mut">a</span><input type="date" id="r-h" value="${hasta}" max="${hoy()}" style="width:auto"><button class="btn pri sm" data-a="rVer">Ver</button></div>` : ''}<div id="rp-b"><div class="empty">Calculando…</div></div>`;
  const giro = S.f.rgiro || '';
  const d = await api('reporte', { desde, hasta, giro }, true);
  if (!enRep('resumen') || (S.f.rper || 'mes') !== per || (S.f.rgiro || '') !== giro || (per === 'otro' && ((S.f.rdesde || hoy()) !== desde || (S.f.rhasta || hoy()) !== hasta))) return;
  const k = d.kpi;
  const sinCosto = S.productos.filter(p => p.activo && !(p.costo > 0)).length;
  const kp = (t, v, s, color, cls) => `<div class="kpi" style="--k:${color}"><small>${t}</small><b class="n ${cls || ''}">${v}</b>${s ? `<i>${s}</i>` : ''}</div>`;
  const dias = [], gastos = [];
  const largo = Math.round((parseLocal(hasta) - parseLocal(desde)) / 86400000) + 1;
  let etiquetas = [], porMes = largo > 62;
  if (per === 'hoy' || (per === 'otro' && desde === hasta)) {
    const hs = Object.keys(d.porHora).sort();
    etiquetas = hs.map(h => (Number(h) % 12 || 12) + (Number(h) < 12 ? 'a' : 'p'));
    hs.forEach(h => dias.push(d.porHora[h]));
  } else if (porMes) {
    const vm = {}, gm = {};
    Object.keys(d.porDia).forEach(f => { vm[f.slice(0, 7)] = (vm[f.slice(0, 7)] || 0) + d.porDia[f]; });
    Object.keys(d.gastosDia).forEach(f => { gm[f.slice(0, 7)] = (gm[f.slice(0, 7)] || 0) + d.gastosDia[f]; });
    const ms = [...new Set(Object.keys(vm).concat(Object.keys(gm)))].sort();
    etiquetas = ms.map(m => cap(new Date(m + '-15T12:00').toLocaleDateString('es-HN', { month: 'short' })));
    ms.forEach(m => { dias.push(r2(vm[m] || 0)); gastos.push(r2(gm[m] || 0)); });
  } else {
    for (let f = desde; f <= hasta; f = addDias(f, 1)) { etiquetas.push(parseLocal(f).getDate() + (largo <= 7 ? ' ' + parseLocal(f).toLocaleDateString('es-HN', { weekday: 'short' }) : '')); dias.push(r2(d.porDia[f] || 0)); gastos.push(r2(d.gastosDia[f] || 0)); }
  }
  const esHora = per === 'hoy' || (per === 'otro' && desde === hasta);
  const secAv = giro ? `<div class="sec-av" style="--sc:${secColor(giro)}"><div class="sec-av-h"><b>${esc(secNom(giro))}</b><span class="n">${fmtN(k.pct, 0)} % de lo vendido</span></div>
      <p>Solo cuenta lo que se vendió de esta sección (si una factura trae productos de varias, se reparte por línea). ${k.general > 0 ? `Gastos propios <b class="n">${money(k.propios)}</b> + su parte de los gastos generales <b class="n">${money(k.general)}</b> (${fmtN(k.parteGeneral, 0)} %, según lo que vende).` : k.propios > 0 ? `Gastos propios <b class="n">${money(k.propios)}</b>.` : 'No hay gastos anotados para esta sección en el período.'}</p></div>` : '';
  $('#rp-b').innerHTML = secAv + `<div class="kpis k4">${kp('Ventas', money(k.ventas), k.n + (giro ? ' facturas con esta sección' : ' ventas'), serie(0))}${kp('Ganancia neta', money(k.neta), fmtN(k.margen, 1) + '% de margen', '#00b56e', k.neta >= 0 ? 'pos' : 'neg')}
      ${kp('Ganancia bruta', money(k.bruta), 'Ventas sin ISV − costo', '#6a1fe0')}${kp('Costo de lo vendido', money(k.costo), fmtN(k.articulos, 0) + ' artículos', '#8a8296')}
      ${kp('Gastos', money(k.gastos), giro ? (k.general > 0 ? 'Propios + parte de los generales' : 'De esta sección') : 'Alquiler, servicios, planilla…', serie(1))}${kp('Ticket promedio', money(k.ticket), '', '#00a8b5')}
      ${kp('ISV cobrado', money(k.isv), k.descuentos ? 'Descuentos ' + money(k.descuentos) : '', '#1b4fd8')}${kp('Vendido al crédito', money(k.credito), giro ? 'De esta sección' : 'Cobros ' + money(k.cobros), '#f25c05')}</div>
    <p class="xs mut" style="margin:-4px 2px 12px">Ganancia neta = ventas sin ISV − costo de lo vendido − gastos. Las compras no son gasto: se vuelven inventario.${k.anuladas ? ' · ' + k.anuladas + ' ventas anuladas no cuentan.' : ''}</p>
    ${sinCosto ? `<div class="aviso warn sm">${ic('alert', 18)}<div>${sinCosto} productos no tienen costo; su ganancia puede verse mayor. <a data-a="ir" data-v="precios" data-p='{}'>Revisar en Precios</a></div></div>` : ''}
    <div class="chart"><div class="row sp"><h3 style="margin:0">${esHora ? 'Ventas por hora' : 'Ventas y gastos'}</h3><span class="xs mut">${esHora ? 'Número de ventas' : porMes ? 'Por mes' : 'Por día'}</span></div><div class="cv"><canvas id="ch-vg" role="img" aria-label="Gráfica de ventas"></canvas></div></div>
    <div class="g2"><div class="chart"><h3>Lo más vendido</h3><div class="tabla"><div class="tr th"><span>Producto</span><span>Cant.</span><span>Vendido</span><span>Ganancia</span></div>${d.top.map(t => `<div class="tr"><span>${esc(t.nombre)}</span><span class="n">${cant(t.cantidad)}</span><span class="n">${money(t.total)}</span><span class="n pos">${money(t.ganancia)}</span></div>`).join('') || '<div class="empty sm">Sin ventas</div>'}</div></div>
    <div><div class="chart"><h3>Ventas por categoría</h3>${rankBars(d.porCategoria, 'total', money, 8)}</div><div class="chart"><h3>Formas de pago</h3>${rankBars(d.porMetodo, 'total', money)}</div></div>
    <div class="chart"><h3>Ventas por persona</h3>${rankBars(d.usuarios.map(u => ({ nombre: u.nombre + ' · ' + u.n, ventas: u.ventas })), 'ventas', money)}</div>
    <div class="chart"><h3>Gastos por categoría</h3>${rankBars(d.gastosCategoria, 'total', money, 8)}</div></div>`;
  graficoBarras('ch-vg', etiquetas, esHora ? [{ label: 'Ventas', data: dias }] : [{ label: 'Ventas', data: dias }, { label: 'Gastos', data: gastos }], esHora ? { cant: 1 } : null);
  S.repCSV = () => csv(`reporte-${giro ? secSlug(giro) + '-' : ''}${desde}-a-${hasta}.csv`, [['Reporte', S.config.nombre, desde + ' a ' + hasta]].concat(giro ? [['Sección', giroCorto(giro)]] : [], [[], ['Indicador', 'Valor'],
    ['Ventas', k.ventas], ['Número de ventas', k.n], ['Ticket promedio', k.ticket], ['ISV', k.isv], ['Descuentos', k.descuentos], ['Costo de lo vendido', k.costo], ['Ganancia bruta', k.bruta]],
    giro ? [['Gastos propios', k.propios], ['Parte de gastos generales', k.general]] : [], [['Gastos', k.gastos], ['Ganancia neta', k.neta], ['Margen %', k.margen], ['Vendido al crédito', k.credito]],
    giro ? [['% de lo vendido', k.pct]] : [['Cobros', k.cobros], ['Compras', k.compras]],
    [[], ['Producto', 'Cantidad', 'Vendido', 'Ganancia'], ...d.top.map(t => [t.nombre, t.cantidad, t.total, t.ganancia])]));
}
ACC.rper = el => { S.f.rper = el.dataset.k; return repResumen(); };
ACC.rVer = () => { S.f.rdesde = $('#r-d').value; S.f.rhasta = $('#r-h').value; if (S.f.rdesde > S.f.rhasta) return toast('La fecha inicial es mayor que la final', 'error'); repResumen(); };

async function repSecciones() {
  const per = S.f.rper || 'mes';
  let [desde, hasta] = per === 'otro' ? [S.f.rdesde || hoy(), S.f.rhasta || hoy()] : rangoPer(per);
  $('#rp').innerHTML = `<div class="chips" style="margin:12px 0 8px">${['hoy', 'd7', 'mes', 'ant', 'anio'].map(k => `<button class="chip ${per === k ? 'on' : ''}" data-a="rperS" data-k="${k}">${PERIODOS[k]}</button>`).join('')}<button class="chip ${per === 'otro' ? 'on' : ''}" data-a="rperS" data-k="otro">Elegir fechas</button></div>
    ${per === 'otro' ? `<div class="row" style="margin-bottom:10px"><input type="date" id="r-d" value="${desde}" max="${hoy()}" style="width:auto"><span class="mut">a</span><input type="date" id="r-h" value="${hasta}" max="${hoy()}" style="width:auto"><button class="btn pri sm" data-a="rVerS">Ver</button></div>` : ''}<div id="rp-b"><div class="empty">Calculando…</div></div>`;
  const d = await api('reporte', { desde, hasta }, true);
  if (!enRep('secciones') || (S.f.rper || 'mes') !== per) return;
  const l = d.secciones || [], tot = d.kpi, conV = l.filter(x => x.ventas > 0);
  const pct = x => fmtN(x.pct, 0) + ' %';
  const barra = conV.length ? `<div class="sec-bar" role="img" aria-label="Parte de lo vendido por sección">${conV.map(x => `<i style="flex:${x.ventas} 1 0;background:${secColor(x.id)}" title="${esc(giroCorto(x.id))}: ${money(x.ventas)} (${pct(x)})"></i>`).join('')}</div>
    <div class="sec-ley">${conV.map(x => `<span><i style="background:${secColor(x.id)}"></i>${esc(giroCorto(x.id))} <b class="n">${pct(x)}</b></span>`).join('')}</div>` : '<p class="sm mut" style="margin:6px 2px 0">Aún no hay ventas en este período.</p>';
  const fila = (t, v, cls) => `<div class="sec-f"><span>${t}</span><b class="n ${cls || ''}">${v}</b></div>`;
  const tarjeta = x => `<div class="sec-c" style="--sc:${secColor(x.id)}">
      <div class="sec-c-h"><span class="sec-emo">${GIRO_EMO[x.id] || '📦'}</span><div class="tx"><b>${esc(giroCorto(x.id))}</b><small>${x.n ? (x.n === 1 ? '1 factura' : x.n + ' facturas') + ' · ' + cant(x.articulos) + ' artículos' : 'Sin ventas en el período'}${x.activa ? '' : ' · ya no está activa'}</small></div><span class="sec-pct n">${pct(x)}</span></div>
      <div class="sec-k"><div><small>Vendido</small><b class="n">${money(x.ventas)}</b></div><div><small>Ganancia neta</small><b class="n ${x.neta >= 0 ? 'pos' : 'neg'}">${money(x.neta)}</b><i>${fmtN(x.margen, 1)} % de margen</i></div></div>
      ${fila('Costo de lo vendido', money(x.costo))}${fila('Ganancia bruta', money(x.bruta))}${fila('Gastos propios', money(x.propios))}${d.gastosGenerales > 0 ? fila(`Parte de gastos generales <small>(${fmtN(x.parte, 0)} %)</small>`, money(x.general)) : ''}${fila('Ticket promedio', money(x.ticket))}
      ${x.top ? `<div class="sec-top">${ic('star', 14)} Lo más vendido: <b>${esc(x.top)}</b></div>` : ''}
      <button class="btn sm ghost sec-ver" data-a="verSeccion" data-k="${x.id}">Ver reporte de esta sección ${ic('arrow', 14)}</button></div>`;
  $('#rp-b').innerHTML = `<div class="chart"><div class="row sp"><h3 style="margin:0">¿Cuánto vende cada sección?</h3><span class="xs mut">Total ${money(tot.ventas)}</span></div>${barra}</div>
    <div class="sec-g">${l.map(tarjeta).join('')}</div>
    <div class="chart"><h3>Comparativo</h3><div class="tabla sec-t"><div class="tr th"><span>Sección</span><span>Vendido</span><span>Ganancia</span><span>Margen</span></div>${l.map(x => `<div class="tr"><span><i class="sd" style="background:${secColor(x.id)}"></i>${esc(giroCorto(x.id))}</span><span class="n">${money(x.ventas)}</span><span class="n ${x.neta >= 0 ? 'pos' : 'neg'}">${money(x.neta)}</span><span class="n">${fmtN(x.margen, 1)} %</span></div>`).join('')}
      <div class="tr tot"><span><b>Todo el negocio</b></span><span class="n"><b>${money(tot.ventas)}</b></span><span class="n ${tot.neta >= 0 ? 'pos' : 'neg'}"><b>${money(tot.neta)}</b></span><span class="n"><b>${fmtN(tot.margen, 1)} %</b></span></div></div></div>
    <div class="aviso info sm">${ic('info', 18)}<div>${d.gastosGenerales > 0 ? `<b>Gastos generales: ${money(d.gastosGenerales)}</b> (sin sección: alquiler, luz, planilla…). Se reparten según lo que vende cada sección.` : '<b>Sin gastos generales en el período.</b>'} Para que un gasto sea de una sola sección, elígela al registrarlo en Gastos.</div></div>`;
  S.repCSV = () => csv(`por-seccion-${desde}-a-${hasta}.csv`, [['Reporte por sección', S.config.nombre, desde + ' a ' + hasta], [],
    ['Sección', 'Vendido', '% de lo vendido', 'Facturas', 'Artículos', 'ISV', 'Costo de lo vendido', 'Ganancia bruta', 'Gastos propios', 'Parte de gastos generales', 'Ganancia neta', 'Margen %', 'Ticket promedio', 'Lo más vendido']]
    .concat(l.map(x => [giroCorto(x.id), x.ventas, x.pct, x.n, x.articulos, x.isv, x.costo, x.bruta, x.propios, x.general, x.neta, x.margen, x.ticket, x.top]),
      [['Todo el negocio', tot.ventas, 100, tot.n, tot.articulos, tot.isv, tot.costo, tot.bruta, '', d.gastosGenerales, tot.neta, tot.margen, tot.ticket, '']]));
}
ACC.rperS = el => { S.f.rper = el.dataset.k; return repSecciones(); };
ACC.rVerS = () => { S.f.rdesde = $('#r-d').value; S.f.rhasta = $('#r-h').value; if (S.f.rdesde > S.f.rhasta) return toast('La fecha inicial es mayor que la final', 'error'); repSecciones(); };

async function repDiario() {
  const mes = S.f.dmes || hoy().slice(0, 7);
  $('#rp').innerHTML = `<div class="row" style="margin:12px 0"><button class="btn icon" data-a="dmes" data-d="-1">${ic('left')}</button><b class="grow" style="text-align:center;font-size:17px">${esc(fMes(mes))}</b><button class="btn icon" data-a="dmes" data-d="1" ${mes >= hoy().slice(0, 7) ? 'disabled' : ''}>${ic('right')}</button></div><div id="rp-b"><div class="empty">Cargando…</div></div>`;
  const d = await api('diario', { mes }, true);
  if (!enRep('diario') || (S.f.dmes || hoy().slice(0, 7)) !== mes) return;
  const mv = d.movimientos.filter(x => !x.anulado);
  const suma = t => mv.filter(x => x.tipo === t).reduce((a, x) => a + (t === 'venta' ? x.monto : x.cobrado), 0);
  const ent = x => x.tipo === 'venta' || x.tipo === 'cobro';
  const dias = {};
  d.movimientos.forEach(x => { (dias[x.fecha.slice(0, 10)] = dias[x.fecha.slice(0, 10)] || []).push(x); });
  const TIPO = { venta: ['Venta', 'b-ok'], cobro: ['Cobro', 'b-info'], gasto: ['Gasto', 'b-bad'], compra: ['Compra', 'b-warn'], pago: ['Pago', 'b-mut'] };
  $('#rp-b').innerHTML = `<div class="kpis k4"><div class="kpi" style="--k:${serie(0)}"><small>Ventas</small><b class="n">${money(suma('venta'))}</b></div><div class="kpi" style="--k:#00a8b5"><small>Cobros a clientes</small><b class="n">${money(suma('cobro'))}</b></div><div class="kpi" style="--k:${serie(1)}"><small>Gastos</small><b class="n">${money(suma('gasto'))}</b></div><div class="kpi" style="--k:#8a8296"><small>Compras y pagos</small><b class="n">${money(suma('compra') + suma('pago'))}</b></div></div>
    <div class="aviso info sm">${ic('trend', 18)}<div>Ganancia del mes: <b class="${d.resumen.utilidad >= 0 ? 'pos' : 'neg'}">${money(d.resumen.utilidad)}</b> (ventas sin ISV − costo − gastos)</div></div>
    ${Object.keys(dias).sort().reverse().map(f => { const l = dias[f], e = l.filter(x => !x.anulado && ent(x)).reduce((a, x) => a + x.cobrado, 0), s = l.filter(x => !x.anulado && !ent(x)).reduce((a, x) => a + x.cobrado, 0);
      return `<div class="dia"><div class="dia-h"><b>${esc(cap(fFechaL(f)))}</b><span class="n"><span class="pos">+${money(e)}</span> · <span class="neg">−${money(s)}</span></span></div>${l.slice().reverse().map(x => `<div class="mv ${x.anulado ? 'anul' : ''}"><span class="hr">${fHora(x.fecha) || '—'}</span><span class="badge ${TIPO[x.tipo][1]}">${TIPO[x.tipo][0]}</span><span class="cn"><b>${esc(x.concepto)}</b><small>${esc([x.numero, x.tercero, x.metodo, x.usuario].filter(Boolean).join(' · '))}</small></span><span class="n ${ent(x) ? 'pos' : 'neg'}">${ent(x) ? '+' : '−'}${money(x.monto)}</span></div>`).join('')}</div>`; }).join('') || '<div class="empty">Sin movimientos este mes</div>'}`;
  S.repCSV = () => csv(`diario-${mes}.csv`, [['Fecha', 'Hora', 'Tipo', 'Número', 'Concepto', 'Cliente / proveedor', 'Forma de pago', 'Usuario', 'Monto', 'Anulado']].concat(d.movimientos.map(x => [x.fecha.slice(0, 10), x.fecha.slice(11, 16), TIPO[x.tipo][0], x.numero, x.concepto, x.tercero, x.metodo, x.usuario, (ent(x) ? 1 : -1) * x.monto, x.anulado ? 'Sí' : ''])));
}
ACC.dmes = el => { const m = S.f.dmes || hoy().slice(0, 7); const d = new Date(m + '-15T12:00'); d.setMonth(d.getMonth() + Number(el.dataset.d)); S.f.dmes = toLocal(d).slice(0, 7); return repDiario(); };

async function repGanancias() {
  $('#rp').innerHTML = '<div class="empty">Cargando…</div>';
  const d = await api('historial', {}, true);
  if (!enRep('ganancias')) return;
  S.hist = d;
  const pend = d.meses.filter(m => !m.enCurso && m.pendiente > 0.009);
  $('#rp').innerHTML = `<p class="sm mut" style="margin:12px 2px">Cada mes cerrado deja una ganancia. Decide a dónde va: a una <b>cuenta</b> (ahorro, reinversión…) o a <b>pagar algo</b> (préstamo, retiro del dueño…). Así sabes qué pasó con el dinero.</p>
    ${pend.length ? `<div class="aviso">${ic('sparkle', 20)}<div><b>${pend.length === 1 ? '1 mes tiene' : pend.length + ' meses tienen'} ganancia sin destino</b><small>Total ${money(pend.reduce((a, m) => a + m.pendiente, 0))}</small></div></div>` : ''}

async function repInventario() {
  $('#rp').innerHTML = '<div class="empty">Cargando…</div>';
  const giro = S.f.rgiro || '';
  const d = await api('inventario', { giro }, true);
  if (!enRep('inventario') || (S.f.rgiro || '') !== giro) return;
  const act = d.productos.filter(p => p.activo && (!giro || p.giro === giro));
  if (giro && !act.length) { $('#rp').innerHTML = `<div class="empty" style="margin-top:14px">${esc(secNom(giro))} no tiene productos con existencia: sus artículos son servicios (no llevan inventario). Sus ventas y ganancias están en Resumen y en «Por sección».</div>`; S.repCSV = null; return; }
  const vc = act.reduce((a, p) => a + p.valorCosto, 0), vv = act.reduce((a, p) => a + p.valorVenta, 0);
  const alcanza = p => p.vendidos30 > 0 ? Math.floor(Math.max(0, p.stock) / (p.vendidos30 / 30)) : null;
  const orden = S.f.iord || 'valor';
  const l = act.slice().sort((a, b) => orden === 'valor' ? b.valorCosto - a.valorCosto : orden === 'vendidos' ? b.vendidos30 - a.vendidos30 : (alcanza(a) === null ? 1e9 : alcanza(a)) - (alcanza(b) === null ? 1e9 : alcanza(b)));
  $('#rp').innerHTML = `<div class="kpis k4" style="margin-top:12px"><div class="kpi" style="--k:${serie(0)}"><small>Inventario al costo</small><b class="n">${money(vc)}</b><i>${act.length} productos</i></div><div class="kpi" style="--k:#6a1fe0"><small>A precio de venta</small><b class="n">${money(vv)}</b></div><div class="kpi" style="--k:#00b56e"><small>Ganancia esperada</small><b class="n pos">${money(vv - vc)}</b><i>si se vende todo (con ISV)</i></div><div class="kpi" style="--k:var(--warn)"><small>Por agotarse</small><b>${act.filter(p => p.stock <= p.stockMin).length}</b><i>${act.filter(p => p.stock <= 0).length} agotados</i></div></div>
    <div class="chips" style="margin-bottom:10px">${[['valor', 'Más valor'], ['vendidos', 'Más vendidos (30 días)'], ['alcanza', 'Se acaban primero']].map(([k, t]) => `<button class="chip ${orden === k ? 'on' : ''}" data-a="iord" data-k="${k}">${t}</button>`).join('')}</div>
    <div class="tabla inv"><div class="tr th"><span>Producto</span><span>Hay</span><span>Valor</span><span>Vendidos 30 d</span><span>Alcanza</span></div>${l.map(p => { const a = alcanza(p); return `<div class="tr" data-a="verProducto" data-id="${p.id}"><span><b>${esc(p.nombre)}</b><small>${esc(p.categoria)}</small></span><span class="n"><span class="badge ${p.stock <= 0 ? 'b-bad' : p.stock <= p.stockMin ? 'b-warn' : 'b-ok'}">${cant(p.stock)}</span></span><span class="n">${money(p.valorCosto)}</span><span class="n">${cant(p.vendidos30)}</span><span class="n">${a === null ? '<i class="mut">sin ventas</i>' : a + ' días'}</span></div>`; }).join('')}</div>
    <div class="sec-t"><h3>Últimos movimientos</h3></div><div class="list">${d.movimientos.slice(0, 40).map(m => `<div class="li"><div class="av ${m.cantidad >= 0 ? 't-verde' : 't-rojo'}">${ic(m.cantidad >= 0 ? 'down' : 'up', 20)}</div><div class="tx"><b>${esc(m.nombre)}</b><small>${esc(cap(m.tipo))}${m.nota ? ' · ' + esc(m.nota) : ''} · ${esc(fFechaC(m.fecha))}${m.usuario ? ' · ' + esc(m.usuario) : ''}</small></div><div class="am n ${m.cantidad >= 0 ? 'pos' : 'neg'}">${m.cantidad > 0 ? '+' : ''}${cant(m.cantidad)}</div></div>`).join('')}</div>`;
  S.repCSV = () => csv(`inventario-${giro ? secSlug(giro) + '-' : ''}${hoy()}.csv`, [['Código', 'Producto', 'Categoría'].concat(repMulti() ? ['Sección'] : [], ['Existencia', 'Mínimo', 'Costo', 'Precio', 'Valor al costo', 'Valor a precio', 'Vendidos 30 días'])].concat(d.productos.filter(p => !giro || p.giro === giro).map(p => [p.codigo, p.nombre, p.categoria].concat(repMulti() ? [giroCorto(p.giro)] : [], [p.stock, p.stockMin, p.costo, p.precio, p.valorCosto, p.valorVenta, p.vendidos30]))));
}

ACC.cargarEjGiro = async el => {
  const r = await api('cargarEjemplos', { giro: el.dataset.g });
  S.productos = r.productos; guardarCache();
  toast(r.agregados ? r.agregados + ' productos de ejemplo agregados a ' + giroN(el.dataset.g) : 'Ya tenías esos productos', 'ok');
  R.tienda();
};
ACC.guardarAj = async el => {
  const s = $('#aj-' + el.dataset.s), reg = {};
  $$('[data-k]', s).forEach(i => { if (i.disabled) return; reg[i.dataset.k] = i.type === 'checkbox' ? (i.checked ? i.dataset.on : i.dataset.off) : i.value.trim(); });
  if (el.dataset.s === 'tienda' || el.dataset.s === 'entregas') { const p = $$('#aj-pagos input', s).filter(x => x.checked).map(x => x.value); if (!p.length) throw new Error('Elige al menos una forma de pago'); reg.tiendaPagos = p.join(','); }
  const c = await api('guardar', { entidad: 'Config', registro: reg });
  S.config = c; guardarCache(); aplicarTema(c.tema); toast('Ajustes guardados', 'ok'); render();
};
ACC.tema = async el => {
  aplicarTema(el.dataset.t);
  $$('.tema').forEach(x => x.classList.toggle('on', x === el));
  const c = await api('guardar', { entidad: 'Config', registro: { tema: el.dataset.t } }, true);
  S.config = c; guardarCache(); pintarHeader(); toast('Color aplicado: ' + TEMAS[el.dataset.t].n, 'ok', 1800);

ACC.modoColor = el => { LS.set('modoColor', el.dataset.m); aplicarTema(S.tema); $$('.modos .pay').forEach(x => x.classList.toggle('on', x === el)); };
async function subirPortada(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    loader(true);
    const d = await comprimirImagen(f, DEMO.on ? 480 : 1400);
    const r = await api('subirFoto', { data: d }, true);
    const c = await api('guardar', { entidad: 'Config', registro: { tiendaPortada: r.foto } }, true);
    S.config = c; guardarCache(); toast('Portada guardada', 'ok'); S.params.sec = 'portada'; render();
  } catch (x) { err(x); } finally { loader(false); }
}
ACC.quitarPortada = async () => { const c = await api('guardar', { entidad: 'Config', registro: { tiendaPortada: '' } }); S.config = c; guardarCache(); S.params.sec = 'portada'; render(); };
async function subirDuenoFoto(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    let d = await comprimirImagen(f, 300);
    if (d.length > 46000) d = await comprimirImagen(f, 200);
    const c = await api('guardar', { entidad: 'Config', registro: { duenoFoto: d } });
    S.config = c; guardarCache(); toast('Foto guardada', 'ok'); S.params.sec = 'dueno'; render();
  } catch (x) { err(x); }
}
ACC.quitarDuenoFoto = async () => { const c = await api('guardar', { entidad: 'Config', registro: { duenoFoto: '' } }); S.config = c; guardarCache(); S.params.sec = 'dueno'; render(); };
async function subirLogo(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    let d = await comprimirImagen(f, 240);
    if (d.length > 46000) d = await comprimirImagen(f, 160);

function menuProyecto(d, pinta) {

/* ===================== FACTURACIÓN SAR (opcional) =====================

   cada venta sale como factura con CAI, numeración autorizada y desglose del ISV. */
const sarOn = () => S.config.sarActivo === 'si';
const fiscalDe = v => { if (!v || !v.factura) return null; try { return JSON.parse(v.fiscal || '{}'); } catch (e) { return {}; } };
const fNum = iso => { if (!iso) return ''; const s = String(iso); return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4); };
const fmtRtn = r => { const d = String(r || '').replace(/\D/g, ''); return d.length === 14 ? d.slice(0, 4) + '-' + d.slice(4, 8) + '-' + d.slice(8) : d; };
const EST_SAR = { ok: ['b-ok', 'Vigente'], aviso: ['b-warn', 'Por agotarse'], vencido: ['b-bad', 'CAI vencido'], agotado: ['b-bad', 'Rango agotado'], incompleto: ['b-mut', 'Sin datos'] };

/* ---------- Factura (imagen para WhatsApp) ---------- */
function filasFiscales(v, f) {
  // Precios con ISV incluido + cliente exonerado: se muestra el ISV que no se cobra para que la suma cuadre
  const quitado = f.exonerado ? Math.round(((Number(v.subtotal) || 0) - (Number(v.descuento) || 0) - (Number(v.total) || 0)) * 100) / 100 : 0;
  return [['Subtotal', v.subtotal], ['Descuentos y rebajas', v.descuento ? -v.descuento : 0]].concat(quitado > 0.004 ? [['ISV exonerado (no se cobra)', -quitado]] : []).concat([['Importe exonerado', f.exonerado], ['Importe exento', f.exento],
    ['Importe gravado 15%', f.g15], ['Importe gravado 18%', f.g18], ['ISV 15%', f.i15], ['ISV 18%', f.i18]]);
}

    <table class="fac-i"><thead><tr><th>Cant.</th><th>Descripción</th><th>P. unit.</th><th>Total</th></tr></thead><tbody>${det.map(i => `<tr><td>${cant(i.cantidad)}</td><td>${esc(i.descripcion)}</td><td>${fmtN(i.precio)}</td><td>${fmtN(i.total)}</td></tr>`).join('')}</tbody></table>

      <div class="fac-tot"><span>TOTAL A PAGAR</span><b>${money(v.total)}</b></div>${num(v.anticipo) > 0 ? `<div class="fac-tot" style="font-size:12px"><span>Anticipo ya pagado · pagado hoy</span><b>−${money(v.anticipo)} · ${money(v.total - v.anticipo)}</b></div>` : ''}</div>

 * Negocio VM · Molina Soluciones Digitales
 * Pegar este bloque completo en index.html, dentro del script principal de la app,

// Solo aparece (menú «Más», mosaico de Inicio, vista) cuando el negocio tiene Contabilidad activada desde el Panel.
