  if (ent !== 'ambos' && ent !== entrega) throw new Error(entrega === 'domicilio' ? 'Este negocio no hace entregas a domicilio' : 'Este negocio solo hace entregas a domicilio');
  const direccion = txt_(d.direccion, 200);
  if (entrega === 'domicilio' && direccion.length < 5) throw new Error('Escribe la dirección de entrega');
  const c = CacheService.getScriptCache(), k = 'PD_' + (NEG ? NEG.id : '') + tel.slice(-8), n = Number(c.get(k) || 0);
  if (n >= 6) throw new Error('Ya hiciste varios pedidos. Si necesitas otro, escríbele al negocio por WhatsApp.');

  const sin = cfg.tiendaSinStock === 'si' || cfg.venderSinStock === 'si';
  const lista = Array.isArray(d.items) ? d.items.slice(0, 40) : [];

  lista.forEach(i => {

    if (!p || !p.activo || !p.tienda) throw new Error('Uno de los productos ya no está disponible. Actualiza la página.');
    if (cant < 1 || cant > 999) throw new Error('Cantidad no válida en «' + p.nombre + '»');
    suma[p.id] = (suma[p.id] || 0) + cant;
    if (p.tipo === 'producto' && !sin && p.stock < suma[p.id]) throw new Error(p.stock > 0 ? 'Solo quedan ' + Math.floor(p.stock) + ' de «' + p.nombre + '»' : '«' + p.nombre + '» se agotó');

  const min = Number(cfg.tiendaMinimo) || 0;

  const envio = entrega === 'domicilio' ? r2_(Number(cfg.tiendaEnvio) || 0) : 0;
  const pagos = String(cfg.tiendaPagos || 'Efectivo').split(',');
  const pago = pagos.indexOf(d.pago) >= 0 ? d.pago : pagos[0];
  let cli = rows_('Clientes').find(x => tel8_(x.telefono) && tel8_(x.telefono) === tel.slice(-8));
  if (!cli) {
    const t8 = tel.slice(-8);
    cli = upsert_('Clientes', { nombre: nombre, telefono: tel.length === 8 || (tel.length === 11 && tel.indexOf('504') === 0) ? t8.slice(0, 4) + '-' + t8.slice(4) : '+' + tel,
      direccion: direccion, notas: 'Se registró en la tienda en línea', activo: true, limite: 0, creado: ahora_() });
  } else if (entrega === 'domicilio' && direccion && !cli.direccion) {

  c.put(k, String(n + 1), 21600);

  return { id: p.id, numero: p.numero, fecha: p.fecha, total: p.total, subtotal: subtotal, envio: envio, items: items, entrega: entrega, pago: pago,
    negocio: cfg.nombre, telefonoNegocio: cfg.telefono, datosPago: pago === 'Transferencia' ? cfg.tiendaDatosPago : '' };

const DIAS_CHAT = 60;

function mensajesDe_(id) { return rows_('Mensajes').filter(m => m.chatId === id).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0); }

// Borra las conversaciones sin mensajes en los últimos 2 meses (una vez al día)
function limpiarChats_(forzar) {
  const h = hoy_();
  if (!forzar && config_().sysChats === h) return 0;
  guardarConfig_({ sysChats: h });
  const lim = diasAtras_(DIAS_CHAT), chats = rows_('Chats');
  const viejos = new Set(chats.filter(c => String(c.ultimo).slice(0, 10) < lim).map(c => c.id));
  if (!viejos.size) return 0;

// Vuelve a escribir toda la hoja con las filas que quedan (más rápido que borrar fila por fila)

  const s = sh_(name), h = SCHEMA[name], n = s.getLastRow();

  if (objs.length) s.getRange(2, 1, objs.length, h.length).setValues(objs.map(o => h.map(k => cell_(o[k], k))));
  invalidar_(name);
}

function hexRgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); }
function mezcla(a, b, t) { const x = hexRgb(a), y = hexRgb(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); }

function temaVars(id, oscuro) {
  const t = TEMAS[id] || TEMAS[TEMA_DEF];
  const [r, g, b] = hexRgb(t.pri);
  if (!oscuro) return {
    h1: t.h1, h2: t.h2, pri: t.pri, onpri: '#fff', pri2: mezcla(t.pri, '#ffffff', .9), a1: t.a1, a2: t.a2, tag: t.tag,

/* ===================== MODO PRUEBA: motor =====================
   Ejecuta el mismo Code.gs dentro del navegador, simulando
   Google Sheets en memoria (se guarda en este navegador). */
function sha256(bytes) {
  const K = [], H = [], frac = x => ((x - Math.floor(x)) * 4294967296) | 0;
  for (let n = 2, cnt = 0; cnt < 64; n++) {
    let primo = true;
    for (let i = 2; i * i <= n; i++) if (n % i === 0) { primo = false; break; }
    if (primo) { if (cnt < 8) H[cnt] = frac(Math.pow(n, 1 / 2)); K[cnt] = frac(Math.pow(n, 1 / 3)); cnt++; }
  }
  const l = bytes.length, buf = new Uint8Array(((l + 9 + 63) >> 6) << 6);
  buf.set(bytes); buf[l] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(buf.length - 4, (l * 8) >>> 0);
  dv.setUint32(buf.length - 8, Math.floor(l * 8 / 4294967296));
  const W = new Int32Array(64), rot = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < buf.length; off += 64) {
    for (let i = 0; i < 16; i++) W[i] = dv.getInt32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rot(W[i - 15], 7) ^ rot(W[i - 15], 18) ^ (W[i - 15] >>> 3);
      const s1 = rot(W[i - 2], 17) ^ rot(W[i - 2], 19) ^ (W[i - 2] >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rot(e, 6) ^ rot(e, 11) ^ rot(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((rot(a, 2) ^ rot(a, 13) ^ rot(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });
  }
  const out = [];
  H.forEach(x => out.push((x >>> 24) & 255, (x >>> 16) & 255, (x >>> 8) & 255, x & 255));
  return out;
}

function demoShims(DEMO) {
  const db = () => DEMO.db;
  const q = v => typeof v === 'string' && v[0] === "'" ? v.slice(1) : v; // como Google Sheets: el apóstrofo inicial solo marca texto
  function Rango(n, r, c, nr, nc, bk) {
    const filas = x => (bk ? db().books[bk] : db()).sheets[x];
    this.setValue = v => { const rs = filas(n); while (rs.length < r) rs.push([]); (rs[r - 1] = rs[r - 1] || [])[c - 1] = q(v); return this; };
    this.getValues = () => { const out = []; for (let i = 0; i < nr; i++) { const row = filas(n)[r - 1 + i] || [], o = []; for (let j = 0; j < nc; j++) { const v = row[c - 1 + j]; o.push(v === undefined || v === null ? '' : v); } out.push(o); } return out; };
    this.setValues = v => { const rs = filas(n); while (rs.length < r - 1 + v.length) rs.push([]); v.forEach((row, i) => { const t = rs[r - 1 + i] || (rs[r - 1 + i] = []); row.forEach((x, j) => { t[c - 1 + j] = q(x); }); }); return this; };
    this.clearContent = () => { const rs = filas(n); for (let i = 0; i < nr; i++) { const t = rs[r - 1 + i]; if (t) for (let j = 0; j < nc; j++) t[c - 1 + j] = ''; } return this; };
    this.createTextFinder = txt => { const tf = { matchEntireCell: () => tf, matchCase: () => tf, findNext: () => { const rs = filas(n); for (let i = 0; i < nr; i++) { const row = rs[r - 1 + i]; if (row && String(row[c - 1] === undefined || row[c - 1] === null ? '' : row[c - 1]) === txt) return { getRow: () => r + i }; } return null; } }; return tf; };
    ['setFontWeight', 'setBackground', 'setFontColor', 'setNumberFormat', 'setDataValidation'].forEach(m => { this[m] = () => this; });
  }

function toast(msg, tipo, ms) {

  $('#toasts').appendChild(t); requestAnimationFrame(() => t.classList.add('in'));

/* ===================== SERVIDOR ===================== */
async function api(action, data, silent) {
  if (DEMO.on) return demoApi(action, data, silent);
  const url = apiUrl();
  if (!url) throw new Error('Configura primero la URL del servidor (Apps Script)');
  if (!silent) loader(true);
  try {
    let r;
    try {
      r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, panel: S.enPanel ? P.tok : undefined, data: data || {} }), redirect: 'follow' });
    } catch (e) { throw new Error('Sin conexión con el servidor. Revisa tu internet.'); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('Respuesta inválida del servidor. Verifica que la App web esté implementada con acceso «Cualquier usuario».'); }
    if (!j.ok) return manejarError(j.error);
    return j.data;
  } finally { if (!silent) loader(false); }
}
function manejarError(m) {
  m = String(m || 'Error');
  if (m.indexOf('PRUEBA_VENCIDA|') === 0) { let info = {}; try { info = JSON.parse(m.slice(15)); } catch (e) {} if (!S.enTienda) mostrarVencida(info); throw new Error('Tu período de prueba terminó'); }
  if (m === 'SESION') { if (!S.enTienda) salir(true); throw new Error('Tu sesión expiró. Ingresa de nuevo.'); }
  if (m === 'PANEL') { if (S.enPanel) { cerrarHojas(); panelLogin(); } throw new Error('Tu sesión del panel expiró. Entra de nuevo.'); }
  if (m.indexOf('Acción no válida') === 0) throw new Error('Esta función necesita la versión nueva del servidor. Escríbenos por WhatsApp al +504 3313-0265 para activarla.');
  throw new Error(m);
}
async function demoApi(action, data, silent) {
  if (!silent) loader(true);
  try {
    await new Promise(r => setTimeout(r, 120));
    const route = demoBackend();
    let res;
    try { res = route({ action, token: S.token, panel: S.enPanel ? P.tok : undefined, data: JSON.parse(JSON.stringify(data || {})) }); }
    catch (e) { demoGuardar(); return manejarError(e && e.message ? e.message : e); }
    demoGuardar();
    return res === undefined ? null : JSON.parse(JSON.stringify(res));
  } finally { if (!silent) loader(false); }
}
function demoGuardar() {
  try { LS.set('demo_db', JSON.stringify(DEMO.db)); LS.set('demo_cache', JSON.stringify(DEMO.cache)); }
  catch (e) { toast('El navegador se quedó sin espacio para el modo prueba. Reinicia los datos de prueba.', 'error'); }
}

const PILA = [];
function hoja(o) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg' + (o.full ? ' full' : '');
  bg.innerHTML = `<div class="sheet ${o.ancho ? 'ancha' : ''} ${o.cls || ''}" role="dialog" aria-modal="true"><div class="grab"></div>
    <div class="sheet-h"><h3>${o.titulo || ''}</h3>${o.extra || ''}<button class="btn icon ghost" data-cerrar aria-label="Cerrar">${ic('x')}</button></div>
    <div class="sheet-b">${o.html || ''}</div><div class="sheet-f"></div></div>`;
  const h = { el: bg, b: $('.sheet-b', bg), f: $('.sheet-f', bg), onClose: o.onClose };
  h.cerrar = () => {
    if (h.cerrado) return; h.cerrado = true;
    const i = PILA.indexOf(h); if (i >= 0) PILA.splice(i, 1);
    bg.classList.remove('in'); setTimeout(() => bg.remove(), 220);
    if (!PILA.length) { document.body.classList.remove('noscroll'); quitarHistHoja(h.porAtras); }
    if (h.onClose) h.onClose();
  };
  // Mientras un botón espera al servidor, la hoja entera queda ocupada (aunque se vuelva a pintar): nada se registra dos veces
  h.botones = bs => {
    h.f.innerHTML = ''; h.f.hidden = !(bs && bs.length);
    (bs || []).forEach(b => {
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'btn ' + (b.cls || ''); x.innerHTML = b.t;
      if (b.id) x.id = b.id;
      if (h.ocupado) x.disabled = true;
      x.onclick = async () => {
        if (x.disabled || h.ocupado) return;
        h.ocupado = true; $$('button', h.f).forEach(y => { y.disabled = true; });
        try { await b.fn(h, x); } catch (e) { err(e); } finally { h.ocupado = false; $$('button', h.f).forEach(y => { y.disabled = false; }); }
      };
      h.f.appendChild(x);
    });
  };
  h.botones(o.botones);
  bg.addEventListener('click', e => { if (e.target === bg && !o.fijo) h.cerrar(); if (e.target.closest('[data-cerrar]')) h.cerrar(); });
  $('#capa').appendChild(bg);
  PILA.push(h);
  document.body.classList.add('noscroll');
  requestAnimationFrame(() => bg.classList.add('in'));
  ponerHistHoja();
  if (o.foco) setTimeout(() => { const f = $(o.foco, bg); if (f) f.focus(); }, 250);
  return h;
}
function cerrarHojas() { while (PILA.length) PILA[PILA.length - 1].cerrar(); }
// Botón «atrás» del teléfono: mientras haya hojas abiertas hay UNA entrada extra en el historial.
// Nunca se retrocede por código (el teléfono podría salir de la app): si la entrada quedó sobrando porque
// la hoja se cerró con la X, el siguiente «atrás» hace lo normal (ir a Inicio) en vez de quedarse trabado.
let HIST_HOJA = false;
function ponerHistHoja() { if (HIST_HOJA) return; try { history.pushState({ hoja: 1 }, ''); HIST_HOJA = true; } catch (e) {} }
function quitarHistHoja() {}
window.addEventListener('popstate', () => {
  HIST_HOJA = false;
  if (PILA.length) { PILA[PILA.length - 1].cerrar(); if (PILA.length) ponerHistHoja(); return; }
  if (S.user && S.vista !== 'inicio' && !S.enTienda) { ir('inicio', {}, true); try { history.replaceState(null, '', '#inicio'); } catch (e) {} }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && PILA.length) PILA[PILA.length - 1].cerrar(); });

    h.botones([{ t: o.no || 'Cancelar', fn: () => h.cerrar() }, { t: o.si || 'Aceptar', cls: o.peligro ? 'bad solid' : 'pri', fn: () => { r = true; h.cerrar(); } }]);

const ACC = {};

function sparkSVG(vals) {
  const max = Math.max(1, ...vals), w = 110, h = 46, n = vals.length;
  const pts = vals.map((v, i) => [2 + i * (w - 4) / (n - 1), h - 6 - (v / max) * (h - 14)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--h2)" stop-opacity=".35"/><stop offset="1" stop-color="var(--h2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${last[0]} ${h} L2 ${h}Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="var(--h2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--h2)"/></svg>`;
}

function guardarTicket() { LS.set('ticket', JSON.stringify(S.ticket)); }
// Mismo cálculo que el servidor: cada línea redondeada, cada parte del ISV redondeada y el total = suma de las partes
function calcTotales(t, exo) {
  const cfg = S.config, incl = cfg.preciosConISV !== 'no', isvG = num(cfg.isv);
  const subtotal = r2(t.items.reduce((a, i) => a + r2(i.cantidad * i.precio), 0));
  const descuento = r2(Math.min(Math.max(0, num(t.descuento)), subtotal));
  const factor = subtotal ? (subtotal - descuento) / subtotal : 1;
  const F = { ex: 0, exo: 0, g15: 0, g18: 0, i15: 0, i18: 0 }, B = { 15: 0, 18: 0 };
  t.items.forEach(i => {
    const p = i.productoId ? byId(S.productos, i.productoId) : null;
    const tasa = p && p.tasaIsv !== '' && p.tasaIsv !== undefined ? num(p.tasaIsv) / 100 : isvG;
    const base = r2(i.cantidad * i.precio) * factor, neto = incl && tasa ? base / (1 + tasa) : base, imp = incl ? base - neto : base * tasa;
    if (!tasa) F.ex += neto; else if (exo) F.exo += neto;
    else if (Math.abs(tasa - 0.18) < 0.001) { F.g18 += neto; F.i18 += imp; B[18] += base; } else { F.g15 += neto; F.i15 += imp; B[15] += base; }
  });
  ['ex', 'exo', 'g15', 'g18'].forEach(k => { F[k] = r2(F[k]); });
  if (incl) { F.i15 = r2(r2(B[15]) - F.g15); F.i18 = r2(r2(B[18]) - F.g18); } else { F.i15 = r2(F.i15); F.i18 = r2(F.i18); }
  const isv = r2(F.i15 + F.i18);
  return { subtotal, descuento, isv, total: r2(F.ex + F.exo + F.g15 + F.g18 + isv), n: t.items.reduce((a, i) => a + i.cantidad, 0) };
}
const enTicket = id => S.ticket.items.filter(i => i.productoId === id).reduce((a, i) => a + i.cantidad, 0);

}

function comprimirImagen(file, max) {
  return new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', 0.8));
    }; img.onerror = () => mal(new Error('No se pudo leer la imagen')); img.src = fr.result; };
    fr.onerror = () => mal(new Error('No se pudo leer la imagen'));
    fr.readAsDataURL(file);
  });
}

    <div class="cp-res" id="cp-res"></div></div>`;

function calcPrecio(c) {
  const costo = num(c.costo), pct = num(c.pct), tasa = c.isv ? num(S.config.isv) : 0;
  if (!(costo > 0) || c.pct === '' || pct < 0) return null;
  if (c.sobre === 'precio' && pct >= 100) return { error: 'Sobre el precio de venta, la ganancia tiene que ser menor que 100%' };
  const neto = c.sobre === 'precio' ? costo / (1 - pct / 100) : costo * (1 + pct / 100);
  const precio = redondear(neto * (1 + tasa), c.red);
  const netoF = precio / (1 + tasa), g = netoF - costo;
  return { costo, precio, tasa, isv: r2(precio - netoF), g: r2(g), sobreCosto: g / costo * 100, sobrePrecio: netoF > 0 ? g / netoF * 100 : 0, redondeo: r2(precio - neto * (1 + tasa)) };
}

ACC.pbVer = () => {
  const cat = $('#pb-cat').value, met = $('#pb-met').value, pct = num($('#pb-pct').value), red = $('#pb-red').value, conIsv = $('#pb-isv').checked;
  if (!(pct > 0)) return toast('Escribe el porcentaje', 'error');
  const l = S.productos.filter(p => p.activo && (!cat || p.categoria === cat));
  const filas = l.map(p => {
    let nuevo = null, motivo = '';
    if (met === 'costo') { if (p.costo > 0) nuevo = precioDesdeCosto(p.costo, pct, conIsv, tasaDe(p), red); else motivo = 'Sin costo'; }
    else nuevo = redondear(p.precio * (met === 'subir' ? 1 + pct / 100 : 1 - pct / 100), red);
    if (nuevo !== null && !(nuevo > 0)) { nuevo = null; motivo = 'Precio no válido'; }
    return { p, nuevo, motivo, igual: nuevo !== null && Math.abs(nuevo - p.precio) < 0.005 };
  });
  const cambian = filas.filter(x => x.nuevo !== null && !x.igual);
  const h = hoja({ titulo: 'Así quedarían los precios', ancho: 1, html: `<p class="sm mut">${met === 'costo' ? `Ganancia de ${fmtN(pct, 0)}% sobre el costo promedio${conIsv ? ' + ISV' : ''}` : (met === 'subir' ? 'Subir ' : 'Bajar ') + fmtN(pct, 0) + '% el precio actual'}${red ? ' · redondeado' : ''}. Desmarca los que no quieras cambiar.</p>
    <div class="ptabla prev"><div class="pt-h"><span>Producto</span><span>Actual</span><span>Nuevo</span><span>Ganancia</span></div>${filas.map((x, i) => { const m = x.nuevo ? margenInfo(x.nuevo, x.p.costo, tasaDe(x.p)) : null; return `<label class="pt-r ${x.nuevo === null || x.igual ? 'off' : ''}"><span class="pt-n">${x.nuevo !== null && !x.igual ? `<input type="checkbox" data-i="${i}" checked>` : '<i class="sp"></i>'}<b>${esc(x.p.nombre)}</b></span><span class="n">${money(x.p.precio)}</span><span class="n">${x.nuevo === null ? `<i class="mut">${x.motivo}</i>` : `<b class="${x.nuevo > x.p.precio ? 'pos' : x.nuevo < x.p.precio ? 'neg' : ''}">${money(x.nuevo)}</b>`}</span><span>${m ? `<span class="badge ${claseMargen(m.sobreCosto)}">${fmtN(m.sobreCosto, 0)}%</span>` : ''}</span></label>`; }).join('')}</div>` });
  h.botones([{ t: 'Cancelar', fn: () => h.cerrar() }, { t: `Aplicar a ${cambian.length} productos`, cls: 'pri', fn: async () => {
    const sel = $$('input[data-i]', h.el).filter(x => x.checked).map(x => filas[Number(x.dataset.i)]);
    if (!sel.length) throw new Error('No hay productos marcados');
    const r = await api('precios', { cambios: sel.map(x => ({ id: x.p.id, precio: x.nuevo, margen: met === 'costo' ? pct : undefined })) });
    S.productos = r.productos; guardarCache(); h.cerrar(); toast(r.cambiados + ' precios actualizados', 'ok'); R.precios();
  } }]);
};

function rankBars(lista, campo, fmt, max) {

function csv(nombre, filas) {
  const t = filas.map(r => r.map(v => { let s = String(v === undefined || v === null ? '' : v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = "'" + s; return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n');
  const b = new Blob(['﻿' + t], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  if (!enRep('diario') || (S.f.dmes || hoy().slice(0, 7)) !== mes) return;
  const mv = d.movimientos.filter(x => !x.anulado);
  const suma = t => mv.filter(x => x.tipo === t).reduce((a, x) => a + (t === 'venta' ? x.monto : x.cobrado), 0);
  const ent = x => x.tipo === 'venta' || x.tipo === 'cobro';
  const dias = {};
  d.movimientos.forEach(x => { (dias[x.fecha.slice(0, 10)] = dias[x.fecha.slice(0, 10)] || []).push(x); });
  const TIPO = { venta: ['Venta', 'b-ok'], cobro: ['Cobro', 'b-info'], gasto: ['Gasto', 'b-bad'], compra: ['Compra', 'b-warn'], pago: ['Pago', 'b-mut'] };

    <div class="aviso info sm">${ic('trend', 18)}<div>Ganancia del mes: <b class="${d.resumen.utilidad >= 0 ? 'pos' : 'neg'}">${money(d.resumen.utilidad)}</b> (ventas sin ISV − costo − gastos)</div></div>
    ${Object.keys(dias).sort().reverse().map(f => { const l = dias[f], e = l.filter(x => !x.anulado && ent(x)).reduce((a, x) => a + x.cobrado, 0), s = l.filter(x => !x.anulado && !ent(x)).reduce((a, x) => a + x.cobrado, 0);
      return `<div class="dia"><div class="dia-h"><b>${esc(cap(fFechaL(f)))}</b><span class="n"><span class="pos">+${money(e)}</span> · <span class="neg">−${money(s)}</span></span></div>${l.slice().reverse().map(x => `<div class="mv ${x.anulado ? 'anul' : ''}"><span class="hr">${fHora(x.fecha) || '—'}</span><span class="badge ${TIPO[x.tipo][1]}">${TIPO[x.tipo][0]}</span><span class="cn"><b>${esc(x.concepto)}</b><small>${esc([x.numero, x.tercero, x.metodo, x.usuario].filter(Boolean).join(' · '))}</small></span><span class="n ${ent(x) ? 'pos' : 'neg'}">${ent(x) ? '+' : '−'}${money(x.monto)}</span></div>`).join('')}</div>`; }).join('') || '<div class="empty">Sin movimientos este mes</div>'}`;
  S.repCSV = () => csv(`diario-${mes}.csv`, [['Fecha', 'Hora', 'Tipo', 'Número', 'Concepto', 'Cliente / proveedor', 'Forma de pago', 'Usuario', 'Monto', 'Anulado']].concat(d.movimientos.map(x => [x.fecha.slice(0, 10), x.fecha.slice(11, 16), TIPO[x.tipo][0], x.numero, x.concepto, x.tercero, x.metodo, x.usuario, (ent(x) ? 1 : -1) * x.monto, x.anulado ? 'Sí' : ''])));
}

const fNum = iso => { if (!iso) return ''; const s = String(iso); return s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4); };
const fmtRtn = r => { const d = String(r || '').replace(/\D/g, ''); return d.length === 14 ? d.slice(0, 4) + '-' + d.slice(4, 8) + '-' + d.slice(8) : d; };
const EST_SAR = { ok: ['b-ok', 'Vigente'], aviso: ['b-warn', 'Por agotarse'], vencido: ['b-bad', 'CAI vencido'], agotado: ['b-bad', 'Rango agotado'], incompleto: ['b-mut', 'Sin datos'] };

function filasFiscales(v, f) {
  // Precios con ISV incluido + cliente exonerado: se muestra el ISV que no se cobra para que la suma cuadre
  const quitado = f.exonerado ? Math.round(((Number(v.subtotal) || 0) - (Number(v.descuento) || 0) - (Number(v.total) || 0)) * 100) / 100 : 0;
  return [['Subtotal', v.subtotal], ['Descuentos y rebajas', v.descuento ? -v.descuento : 0]].concat(quitado > 0.004 ? [['ISV exonerado (no se cobra)', -quitado]] : []).concat([['Importe exonerado', f.exonerado], ['Importe exento', f.exento],
    ['Importe gravado 15%', f.g15], ['Importe gravado 18%', f.g18], ['ISV 15%', f.i15], ['ISV 18%', f.i18]]);
}

      <div class="f2"><label class="fld"><span>Rango: desde el n.º</span><input id="sar-des" inputmode="numeric" maxlength="8" value="${v('sarDesde')}" placeholder="1"></label><label class="fld"><span>hasta el n.º</span><input id="sar-has" inputmode="numeric" maxlength="8" value="${v('sarHasta')}" placeholder="5000"></label></div>
      <div class="f2"><label class="fld"><span>Fecha límite de emisión</span><input id="sar-lim" type="date" value="${v('sarLimite')}"></label><label class="fld"><span>Último n.º ya usado</span><input id="sar-ult" inputmode="numeric" maxlength="8" placeholder="Opcional"></label></div>

      <p class="xs mut" style="margin-top:10px">Cada venta toma el siguiente número del rango y nunca se repite. Si vence la fecha límite o se acaban los números, el sistema deja de facturar hasta que pongas un CAI nuevo. Las facturas anuladas conservan su número.</p></div>`;
}
function initSarAjustes() {
  const on = $('#sar-on'); if (!on) return;
  const prev = () => {
    const est = String($('#sar-est').value || '').padStart(3, '0'), pto = String($('#sar-pto').value || '').padStart(3, '0');
    const d = $('#sar-des').value.replace(/\D/g, ''), hs = $('#sar-has').value.replace(/\D/g, '');
    $('#sar-prev').innerHTML = d && hs ? `Tus facturas: <b class="n">${est}-${pto}-01-${d.padStart(8, '0')}</b> al <b class="n">${est}-${pto}-01-${hs.padStart(8, '0')}</b>` : '';
  };
  ['#sar-est', '#sar-pto', '#sar-des', '#sar-has'].forEach(s => $(s).addEventListener('input', prev)); prev();
  $('#sar-cai').addEventListener('input', e => { const p = e.target.selectionStart; e.target.value = e.target.value.toUpperCase(); try { e.target.setSelectionRange(p, p); } catch (x) {} });
  on.addEventListener('change', async () => {
    if (on.checked) { S.f.sarAbierto = 1; $('#sar-f').hidden = false; return; }
    if (!sarOn()) { S.f.sarAbierto = 0; $('#sar-f').hidden = true; return; }
    if (!(await confirmar('¿Apagar la facturación SAR? Desde ahora las ventas saldrán como comprobante (no fiscal). Tus datos del CAI se conservan.', { si: 'Apagar', peligro: 1 }))) { on.checked = true; return; }
    const r = await api('guardarSAR', { registro: { activo: false } });
    S.config = Object.assign(S.config, r.config); S.sar = r.sar; S.f.sarAbierto = 0; guardarCache(); toast('Facturación SAR apagada', 'ok'); R.ajustes();
  });
}
ACC.guardarSAR = async () => {
  const reg = { activo: true, razon: $('#sar-razon').value, rtn: $('#sar-rtn').value, direccion: $('#sar-dir').value, cai: $('#sar-cai').value, est: $('#sar-est').value,
    punto: $('#sar-pto').value, desde: $('#sar-des').value, hasta: $('#sar-has').value, limite: $('#sar-lim').value, ultimo: $('#sar-ult').value };
  const nuevo = !sarOn();
  if (nuevo && !(await confirmar('Desde ahora cada venta saldrá como <b>factura</b> con tu CAI y el siguiente número del rango. ¿Tu negocio ya está registrado como autoimpresor en el SAR?', { si: 'Sí, activar' }))) return;
  const r = await api('guardarSAR', { registro: reg });
  S.config = Object.assign(S.config, r.config); S.sar = r.sar; guardarCache();
  toast(nuevo ? 'Facturación SAR activada · siguiente ' + r.sar.siguiente : 'Datos del SAR guardados', 'ok', 4500); R.ajustes();
};
ACC.verLibroSAR = () => ir('reportes', { tab: 'sar' });

/* ---------- Aviso en Inicio ---------- */
function avisoSAR() {
  const e = S.sar;
  if (!sarOn() || !e || !puede('admin') || !['aviso', 'vencido', 'agotado', 'incompleto'].includes(e.estado)) return '';
  const t = e.estado === 'vencido' ? 'Tu CAI venció: ya no puedes facturar' : e.estado === 'agotado' ? 'Se acabaron tus números de factura' : e.estado === 'incompleto' ? 'Faltan datos de facturación SAR'
    : e.dias <= 15 ? `Tu CAI vence en ${e.dias === 1 ? '1 día' : e.dias + ' días'}` : `Quedan ${fmtN(e.quedan, 0)} facturas en tu rango`;
  return `<div class="aviso ${e.estado === 'aviso' ? 'warn' : 'bad'}">${ic('doc', 20)}<div><b>${t}</b><small>Pide al SAR un CAI o un rango nuevo y actualízalo en Ajustes.</small></div><button class="btn sm" data-a="ir" data-v="ajustes" data-p='{"sec":"sar"}'>Abrir</button></div>`;
}

/* ---------- Reportes › Libro de ventas SAR ---------- */
async function repLibroSAR() {
  const rp = $('#rp');
  const mes = S.f.libMes || hoy().slice(0, 7);
  rp.innerHTML = `<div class="row" style="margin:12px 0"><label class="fld" style="margin:0"><span>Mes</span><input type="month" id="lb-mes" value="${mes}" max="${hoy().slice(0, 7)}"></label></div><div id="lb">${'<div class="empty">Cargando…</div>'}</div>`;
  $('#lb-mes').addEventListener('change', e => { S.f.libMes = e.target.value; repLibroSAR(); });
  let d; try { d = await api('libroSAR', { mes }); } catch (e) { return err(e); }
  if (S.vista !== 'reportes' || S.f.rtab !== 'sar') return;
  const t = d.tot;
  $('#lb').innerHTML = `<div class="kpis"><div class="kpi"><small>Facturas emitidas</small><b>${d.emitidas}</b><i>${d.primera ? esc(d.primera.slice(-8)) + ' a ' + esc(d.ultima.slice(-8)) : 'ninguna'}</i></div><div class="kpi" style="--k:var(--bad)"><small>Anuladas</small><b>${d.anuladas}</b><i>avísalas al SAR</i></div>
      <div class="kpi" style="--k:#1b4fd8"><small>Ventas facturadas</small><b class="n">${money(t.total)}</b></div><div class="kpi" style="--k:#00b56e"><small>ISV 15% + 18%</small><b class="n">${money(t.i15 + t.i18)}</b></div></div>
    <div class="panel lb-res"><div class="cj-r"><span>Importe exento</span><b class="n">${money(t.exento)}</b></div><div class="cj-r"><span>Importe exonerado</span><b class="n">${money(t.exonerado)}</b></div><div class="cj-r"><span>Importe gravado 15%</span><b class="n">${money(t.g15)}</b></div><div class="cj-r"><span>ISV 15%</span><b class="n">${money(t.i15)}</b></div><div class="cj-r"><span>Importe gravado 18%</span><b class="n">${money(t.g18)}</b></div><div class="cj-r"><span>ISV 18%</span><b class="n">${money(t.i18)}</b></div><div class="cj-r tot"><span>Total</span><b class="n">${money(t.total)}</b></div></div>
    <div class="lb-t"><table><thead><tr><th>Fecha</th><th>Factura</th><th>Cliente</th><th>RTN</th><th>Exento</th><th>Exonerado</th><th>Gravado 15%</th><th>ISV 15%</th><th>Gravado 18%</th><th>ISV 18%</th><th>Total</th></tr></thead>
    <tbody>${d.filas.map(x => `<tr class="${x.anulada ? 'anul' : ''}" data-a="lbVer" data-id="${x.id}" data-f="${x.fecha}"><td>${fNum(x.fecha)}</td><td class="n">${esc(x.factura)}${x.anulada ? ' <span class="badge b-bad">Anulada</span>' : ''}</td><td>${esc(x.nombre)}</td><td class="n">${esc(fmtRtn(x.rtn))}</td>${['exento', 'exonerado', 'g15', 'i15', 'g18', 'i18', 'total'].map(k => `<td class="n">${fmtN(x[k])}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="11" class="mut">No hay facturas en este mes</td></tr>'}</tbody></table></div>
    <p class="xs mut">Las anuladas no suman en los totales. Descarga el libro con el botón de arriba para tu contador.</p>`;
  S.repCSV = () => {
    const cab = ['Fecha', 'Factura', 'Estado', 'Cliente', 'RTN', 'Exento', 'Exonerado', 'Gravado 15%', 'ISV 15%', 'Gravado 18%', 'ISV 18%', 'Total', 'CAI'];
    const filas = d.filas.map(x => [fNum(x.fecha), x.factura, x.anulada ? 'Anulada' : 'Emitida', x.nombre, fmtRtn(x.rtn), x.exento, x.exonerado, x.g15, x.i15, x.g18, x.i18, x.total, x.cai]);
    csv('libro-ventas-' + d.mes + '.csv', [cab].concat(filas));
  };
}
ACC.lbVer = async el => {
  const f = el.dataset.f.slice(0, 10);
  const r = await api('ventas', { desde: f, hasta: f }), l = r.lista || r;
  const v = l.find(x => x.id === el.dataset.id); if (v) detalleVenta(v);
};

/* ---------- ¿Hay una versión nueva publicada? ---------- */
function cmpVer(a, b) { const x = String(a || '0').split('.').map(Number), y = String(b || '0').split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d > 0 ? 1 : -1; } return 0; }
let ultRevVer = 0;
async function buscarActualizacion(forzar) {
  if (!/^https?:$/.test(location.protocol) || S.enTienda || $('#upd')) return;
  if (!forzar && Date.now() - ultRevVer < 10 * 60000) return;
  ultRevVer = Date.now();
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/const APP_VER = '([\d.]+)'/);
    if (m && cmpVer(m[1], APP_VER) > 0) avisoActualizacion(m[1]);
  } catch (e) {}
}
function avisoActualizacion(v) {
  if ($('#upd')) return;
  const d = document.createElement('div'); d.id = 'upd'; d.className = 'upd'; d.setAttribute('role', 'status');
  d.innerHTML = `<i>${ic('sparkle', 20)}</i><div class="grow"><b>Hay una versión nueva (${esc(v)})</b><small>Actualiza para ver las mejoras. Tus datos no cambian.</small></div><button class="btn sm acc" data-a="actualizarApp">Actualizar</button><button class="btn icon ghost upd-x" data-a="cerrarUpd" aria-label="Después">${ic('x', 16)}</button>`;
  document.body.appendChild(d); requestAnimationFrame(() => d.classList.add('in'));
}
ACC.cerrarUpd = () => { const d = $('#upd'); if (d) d.remove(); ultRevVer = Date.now(); }; // vuelve a avisar más tarde
ACC.actualizarApp = async el => {
  el.disabled = true; el.textContent = 'Actualizando…';
  try { if (navigator.serviceWorker) { const rs = await navigator.serviceWorker.getRegistrations(); await Promise.all(rs.map(r => r.update().catch(() => {}))); } } catch (e) {}
  try { if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } } catch (e) {}
  location.reload();
};
setInterval(() => buscarActualizacion(), 30 * 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) buscarActualizacion(); });

/* ===================== APP PARA ANDROID (APK) =====================
   En un Android que abre el sistema desde el navegador, ofrece descargar la app.
   No sale si ya está dentro de la app instalada, en computadora, en iPhone ni en la tienda en línea.
   El aviso solo aparece si el archivo del APK existe en el sitio (carpeta app/). */
const APK_URL = 'app/gestion-de-negocio-vm.apk';
const APK_PAUSA = 5 * 86400000; // si la cierran con la X, vuelve a salir en 5 días
function enAppInstalada() {
  try { if (document.referrer.indexOf('android-app://') === 0) sessionStorage.setItem('enApk', '1'); } catch (e) {}
  let s = false; try { s = sessionStorage.getItem('enApk') === '1'; } catch (e) {}
  return s || (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches)) || navigator.standalone === true;
}
let APK_OK = null;
async function ofrecerApk() {
  if (!/Android/i.test(navigator.userAgent) || enAppInstalada() || S.enTienda || $('#apk-bar')) return;
  if (!/^https?:$/.test(location.protocol)) return;
  if (Date.now() - num(LS.get('apkNo', '0')) < APK_PAUSA) return;
  if (APK_OK === null) {
    try { const r = await fetch(APK_URL, { method: 'HEAD', cache: 'no-store' }); APK_OK = r.ok; } catch (e) { APK_OK = false; }
  }
  if (!APK_OK || $('#apk-bar') || S.enTienda) return;
  const d = document.createElement('div'); d.id = 'apk-bar'; d.className = 'apk-bar'; d.setAttribute('role', 'status');
  d.innerHTML = `<i>${ic('save', 22)}</i><div class="grow"><b>Descarga la app para Android</b><small>Ábrela con un toque desde tu pantalla de inicio</small></div><button class="btn sm apk-go" data-a="apkVer">Descargar</button><button class="btn icon ghost apk-x" data-a="apkNo" aria-label="Ahora no">${ic('x', 16)}</button>`;
  document.body.appendChild(d); requestAnimationFrame(() => d.classList.add('in'));
}
ACC.apkNo = () => { LS.set('apkNo', String(Date.now())); const d = $('#apk-bar'); if (d) d.remove(); };
ACC.apkVer = () => {
  const h = hoja({ titulo: 'App para Android', cls: 'chica apk-hoja', html: `<p class="sm mut" style="margin:0 0 10px">Gestión de Negocio VM · versión ${APP_VER}</p>

    <a class="btn big apk-dl" href="${APK_URL}" download="Gestion-de-Negocio-VM.apk" data-a="apkBajo">${ic('save', 20)} Descargar APK</a>

/* ===================== COMPROBANTES (imagen, impresión, WhatsApp) ===================== */
function textoVenta(v, det) {
  const l = [`*${S.config.nombre || 'Comprobante'}*`, v.factura ? `Factura ${v.factura} · ${fFechaC(v.fecha)} ${fHora(v.fecha)}` : `Comprobante ${v.numero} · ${fFechaC(v.fecha)} ${fHora(v.fecha)}`, ''];
  det.forEach(i => l.push(`${cant(i.cantidad)} × ${i.descripcion} — ${money(i.total)}`));
  l.push('');
  if (v.descuento) l.push('Descuento: −' + money(v.descuento));
  l.push(`*Total: ${money(v.total)}*`, 'Pago: ' + v.metodo + (v.metodo === 'Crédito' ? ` · saldo ${money(v.saldo)}` : ''));
  if (S.config.mensajeRecibo) l.push('', S.config.mensajeRecibo);
  return l.join('\n');
}
function qrTiendaSVG(px) {

async function aImagen(el) {

}

// ¿Está abierto ahora? (según horario y días de Ajustes)
function abiertoAhora(n) {
  if (!n.abre || !n.cierra) return null;
  const d = new Date(), dias = String(n.dias || '1,2,3,4,5,6').split(',').map(Number), hoyD = d.getDay();
  const hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  const h12 = t => { const h = Number(t.slice(0, 2)), m = t.slice(3, 5); return (h % 12 || 12) + ':' + m + (h < 12 ? ' a. m.' : ' p. m.'); };
  const abierto = dias.includes(hoyD) && hm >= n.abre && hm < n.cierra;
  if (abierto) return { on: true, t: 'cierra a las ' + h12(n.cierra) };
  if (dias.includes(hoyD) && hm < n.abre) return { on: false, t: 'abre hoy a las ' + h12(n.abre) };
  const NOM = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  for (let i = 1; i <= 7; i++) { const dd = (hoyD + i) % 7; if (dias.includes(dd)) return { on: false, t: 'abre ' + (i === 1 ? 'mañana' : 'el ' + NOM[dd]) + ' a las ' + h12(n.abre) }; }
  return { on: false, t: '' };
}

    if (!ms.length) { box.innerHTML = `<div class="empty">${d ? esc(d.nombre.split(' ')[0]) + ' te responde por aquí.' : 'Escríbenos y te respondemos por aquí.'}${prod ? '' : '<br>Cuéntanos qué necesitas.'}</div>`; return; }
    let dia = '';
    box.innerHTML = ms.map(m => { const f = String(m.fecha).slice(0, 10), sep = f !== dia ? `<div class="day">${f === hoy() ? 'Hoy' : esc(fFechaC(f))}</div>` : ''; dia = f;
      return sep + `<div class="msg ${m.de === 'cliente' ? 'yo' : 'el'}"><div class="bt">${esc(m.texto)}</div><small>${fHora(m.fecha)}</small></div>`; }).join('');
    box.scrollTop = box.scrollHeight;
    const ult = ms.filter(m => m.de === 'negocio').map(m => m.fecha).sort().pop(); if (ult) LS.set(tKey('chatVisto'), ult);
  };
  const cargar = async () => {
    if (!chatClave()) { chat = null; $('#tch-datos', h.el).hidden = false; pinta(); return; }
    try { const c = await api('chatVer', { negocio: T.id, clave: chatClave() }, true); if (c.borrado) { LS.set(tKey('chat'), ''); chat = null; $('#tch-datos', h.el).hidden = false; } else chat = c; }
    catch (e) {}
    pinta();
  };
  const enviar = async () => {
    if (enviando) return;
    const inp = $('#tch-in', h.el), texto = inp.value.trim();
    if (!texto) throw new Error('Escribe tu mensaje');
    const datos = { negocio: T.id, texto, productoId: prod ? prod.id : '' };
    if (chatClave()) datos.clave = chatClave();
    else {
      const nombre = $('#tch-n', h.el).value.trim(), tel = $('#tch-t', h.el).value.trim();
      if (nombre.length < 3) throw new Error('Escribe tu nombre');
      if (tel.replace(/\D/g, '').length < 8) throw new Error('Escribe tu número de WhatsApp');
      Object.assign(datos, { nombre, telefono: tel });
      LS.set('cliente_tienda', JSON.stringify(Object.assign({}, cli, { nombre, telefono: tel })));
    }
    enviando = true; $('#tch-send', h.el).disabled = true;
    try {
      const c = await api('chatEnviar', datos, true);
      if (c.clave) LS.set(tKey('chat'), c.clave);
      chat = c; inp.value = ''; inp.style.height = ''; $('#tch-datos', h.el).hidden = true; pinta();
    } finally { enviando = false; $('#tch-send', h.el).disabled = false; }
  };
  $('#tch-send', h.el).onclick = () => enviar().catch(err);
  const inp = $('#tch-in', h.el);
  inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); enviar().catch(err); } });
  cargar();
  timer = setInterval(() => { if (!document.hidden && chatClave()) cargar(); }, 20000);
  h.botones([]);
}
async function misPedidosTienda() {
  const ids = LS.json(tKey('pedidos'), []) || [], cli = LS.json('cliente_tienda', {}) || {};
  const box = $('#t-mis'); if (!box || !ids.length || !cli.telefono) return;
  try {
    const l = await api('misPedidos', { negocio: T.id, telefono: cli.telefono, ids }, true);
    const est = { nuevo: ['Recibido', 'b-warn', '📨'], confirmado: ['Confirmado', 'b-info', '👍'], listo: ['¡Listo!', 'b-ok', '✅'], entregado: ['Entregado', 'b-mut', '🎉'], cancelado: ['Cancelado', 'b-bad', '✖️'] };
    const vis = l.filter(p => p.estado !== 'entregado' && p.estado !== 'cancelado' || (Date.now() - parseLocal(p.fecha).getTime()) < 86400000 * 2).slice(0, 3);
    box.innerHTML = vis.length ? `<div class="mis"><b>Tus pedidos</b>${vis.map(p => `<div class="mis-r"><span>${est[p.estado][2]} ${esc(p.numero)} · ${money(p.total)}</span><span class="badge ${est[p.estado][1]}">${est[p.estado][0]}</span></div>`).join('')}</div>` : '';
  } catch (e) {}
}

</script>
