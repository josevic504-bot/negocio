const T = { info: null, id: '', cat: '', q: '', cart: {}, entrega: '' };
const tKey = k => k + '_' + T.id;
async function iniciarTienda(id) {
  T.id = id || '1';
  $('#login').hidden = true; $('#app').hidden = true; $('#tienda').hidden = false;
  document.body.classList.add('en-tienda');
  T.cart = LS.json(tKey('carrito'), {}) || {};
  $('#tienda').innerHTML = `<div class="shop-hero"><div class="hero-c"><div class="mono">${ic('store', 28)}</div><div class="hero-name">Cargando…</div></div></div>`;
  try {
    T.info = await api('tiendaInfo', { negocio: T.id }, true);
  } catch (e) {
    const m = String(e.message || '');
    if (m.indexOf('TIENDA_CERRADA|') === 0) { let x = {}; try { x = JSON.parse(m.slice(15)); } catch (z) {} return tiendaCerrada(x); }
    $('#tienda').innerHTML = `<div class="shop-hero"><div class="hero-c"><div class="mono">${ic('alert', 28)}</div><div class="hero-name">Tienda no disponible</div></div></div><div class="shop-box"><div class="panel" style="text-align:center"><p>${esc(m)}</p><button class="btn pri" onclick="location.reload()">Intentar de nuevo</button></div></div>`;
    return;
  }
  const n = T.info.negocio;
  S.config = Object.assign({}, S.config, { moneda: n.moneda, nombre: n.nombre });
  aplicarTema(n.tema);
  document.title = n.nombre + ' · Pedidos en línea';
  const ids = new Set(T.info.productos.map(p => p.id));
  Object.keys(T.cart).forEach(k => { if (!ids.has(k)) delete T.cart[k]; });
  T.entrega = n.entrega === 'domicilio' ? 'domicilio' : 'recoger';
  pintarTienda();
  misPedidosTienda();
}
function tiendaCerrada(x) {
  if (x.tema) aplicarTema(x.tema);
  $('#tienda').innerHTML = `<div class="shop-hero"><div class="hero-c">${x.logo ? `<div class="hero-logo"><img src="${esc(x.logo)}" alt=""></div>` : `<div class="mono">${esc(iniciales(x.nombre || 'Tienda'))}</div>`}<div class="hero-name">${esc(x.nombre || 'Tienda')}</div><div class="hero-tag">Pedidos en línea</div></div></div>
    <div class="shop-box"><div class="panel" style="text-align:center"><h3>Por ahora no estamos recibiendo pedidos en línea</h3><p class="mut">Escríbenos y con gusto te atendemos.</p>${x.telefono ? `<a class="btn wa big" href="${waLink(x.telefono, 'Hola, quiero hacer un pedido')}" target="_blank" rel="noopener">${ic('wa')} Escribir por WhatsApp</a>` : ''}</div></div>`;
}
const tCant = () => Object.values(T.cart).reduce((a, x) => a + x, 0);
const tSub = () => Object.keys(T.cart).reduce((a, id) => { const p = T.info.productos.find(x => x.id === id); return a + (p ? p.precio * T.cart[id] : 0); }, 0);
function guardarCarrito() { LS.set(tKey('carrito'), JSON.stringify(T.cart)); }
function pintarTienda() {
  const n = T.info.negocio, ps = T.info.productos;
  const cats = [...new Set(ps.map(p => p.categoria))];
  const ent = n.entrega === 'ambos' ? 'Entrega a domicilio y para recoger' : n.entrega === 'domicilio' ? 'Entrega a domicilio' : 'Para recoger en el negocio';
  $('#tienda').innerHTML = `<div class="shop-hero"><div class="hero-c">${n.logo ? `<div class="hero-logo"><img src="${esc(n.logo)}" alt=""></div>` : `<div class="mono">${esc(iniciales(n.nombre))}</div>`}<div class="hero-name">${esc(n.nombre)}</div><div class="hero-tag">${esc(n.eslogan || n.giro || 'Pedidos en línea')}</div>
      <div class="shop-st"><i></i>${esc(n.horario || ent)}</div></div></div>
    <div class="shop-box">${n.mensaje ? `<div class="shop-msg">${esc(n.mensaje)}</div>` : ''}<div id="t-mis"></div>
      <div class="shop-srch"><div class="srch">${ic('search', 18)}<input id="t-q" placeholder="¿Qué estás buscando?" value="${esc(T.q)}"></div>
      ${cats.length > 1 ? `<div class="chips" style="margin-top:10px" id="t-cats"><button class="chip ${!T.cat ? 'on' : ''}" data-c="">Todo</button>${cats.map(c => `<button class="chip ${T.cat === c ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}</div>
      <div class="pgrid shop-grid" id="t-grid"></div>
      <div class="shop-pie">${n.direccion ? `<div>${ic('pin', 15)} ${esc(n.direccion)}</div>` : ''}${n.telefono ? `<a href="${waLink(n.telefono, 'Hola, tengo una consulta')}" target="_blank" rel="noopener">${ic('wa', 15)} ${esc(n.telefono)}</a>` : ''}<div>${esc(ent)}${n.envio ? ' · envío ' + money(n.envio) : ''}${n.minimo ? ' · pedido mínimo ' + money(n.minimo) : ''}</div></div></div>
    <div id="t-bar"></div>`;
  $('#t-q').addEventListener('input', debounce(e => { T.q = e.target.value; gridTienda(); }, 150));
  const tc = $('#t-cats'); if (tc) tc.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; T.cat = b.dataset.c; $$('#t-cats .chip').forEach(x => x.classList.toggle('on', x === b)); gridTienda(); });
  $('#t-grid').addEventListener('click', e => {
    const add = e.target.closest('[data-add]'); if (add) { e.stopPropagation(); return tAgregar(add.dataset.add, 1); }
    const c = e.target.closest('[data-p]'); if (c) tProducto(c.dataset.p);
  });
  gridTienda();
}
function gridTienda() {
  const q = norm(T.q);
  const l = T.info.productos.filter(p => (!T.cat || p.categoria === T.cat) && (!q || norm(p.nombre).includes(q) || norm(p.categoria).includes(q) || norm(p.descripcion).includes(q)));
  $('#t-grid').innerHTML = l.map(p => `<div class="pc sp-card ${p.agotado ? 'dis' : ''}" data-p="${p.id}">${prodFoto(p, (T.cart[p.id] ? `<span class="qn">${T.cart[p.id]}</span>` : '') + (p.agotado ? '<span class="st out">Agotado</span>' : p.stock !== undefined ? `<span class="st">${cant(p.stock)} disp.</span>` : ''))}
    <div class="bd"><div class="nm">${esc(p.nombre)}</div><div class="row"><div class="pr n">${money(p.precio)}</div>${p.agotado ? '' : `<button class="sp-add" data-add="${p.id}" aria-label="Agregar">${ic('plus', 16)}</button>`}</div></div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">No encontramos productos con esa búsqueda</div>';
  barTienda();
}
function maxDe(p) { return p.agotado ? 0 : p.max !== undefined ? p.max : p.stock !== undefined ? Math.floor(p.stock) : 999; }
function tAgregar(id, n) {
  const p = T.info.productos.find(x => x.id === id); if (!p) return;
  const nuevo = (T.cart[id] || 0) + n;
  if (n > 0 && nuevo > maxDe(p)) { toast(maxDe(p) ? 'Solo tenemos ' + maxDe(p) + ' disponibles' : 'Producto agotado', 'error'); return; }
  if (nuevo <= 0) delete T.cart[id]; else T.cart[id] = nuevo;
  guardarCarrito();
  try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
  gridTienda();
}
function barTienda() {
  const n = tCant(), b = $('#t-bar'); if (!b) return;
  b.innerHTML = n ? `<button class="cartbar shop-cart" id="t-ver"><span class="ci">${ic('bag', 22)}<b>${n}</b></span><span class="ct"><small>Mi pedido · ${n === 1 ? '1 artículo' : n + ' artículos'}</small><strong class="n">${money(tSub())}</strong></span><span class="go">Ver pedido ${ic('arrow', 18)}</span></button>` : '';
  const v = $('#t-ver'); if (v) v.onclick = tCarrito;
}
function tProducto(id) {
  const p = T.info.productos.find(x => x.id === id); if (!p) return;
  let n = 1;
  const h = hoja({ titulo: '', cls: 'prod-h', html: `<div class="prod-big">${prodFoto(p)}</div><h2 class="prod-n">${esc(p.nombre)}</h2><div class="prod-p n">${money(p.precio)}${p.unidad && p.unidad !== 'unidad' ? ` <small>por ${esc(p.unidad)}</small>` : ''}</div>
    ${p.descripcion ? `<p class="prod-d">${esc(p.descripcion)}</p>` : ''}${p.agotado ? '<p class="neg"><b>Agotado por ahora</b></p>' : p.stock !== undefined ? `<p class="sm mut">${cant(p.stock)} disponibles</p>` : ''}
    ${p.agotado ? '' : `<div class="row" style="justify-content:center;margin:14px 0 4px"><div class="qty big"><button data-d="-1">−</button><span id="tp-n">1</span><button data-d="1">+</button></div></div>`}` });
  if (p.agotado) return;
  const pinta = () => { $('#tp-n', h.el).textContent = n; h.botones([{ t: `${ic('bag', 18)} Agregar · ${money(p.precio * n)}`, cls: 'acc big', fn: () => { const ya = T.cart[p.id] || 0; if (ya + n > maxDe(p)) throw new Error('Solo tenemos ' + maxDe(p) + ' disponibles'); tAgregar(p.id, n); h.cerrar(); toast('Agregado a tu pedido', 'ok', 1500); } }]); };
  $('.qty', h.el).addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; n = Math.max(1, Math.min(maxDe(p) - (T.cart[p.id] || 0) || 1, n + Number(b.dataset.d))); pinta(); });
  pinta();
}
function tCarrito() {
  const n = T.info.negocio, cli = LS.json('cliente_tienda', {}) || {};
  const h = hoja({ titulo: 'Tu pedido', html: '<div id="tc"></div>', cls: 'checkout' });
  const pinta = () => {
    const sub = tSub(), env = T.entrega === 'domicilio' ? n.envio : 0, items = Object.keys(T.cart).map(id => ({ p: T.info.productos.find(x => x.id === id), q: T.cart[id] })).filter(x => x.p);
    if (!items.length) { h.cerrar(); return; }
    const valores = { nom: ($('#tc-n', h.el) || {}).value, tel: ($('#tc-t', h.el) || {}).value, dir: ($('#tc-d', h.el) || {}).value, pago: ($('#tc-p', h.el) || {}).value, nota: ($('#tc-o', h.el) || {}).value };
    $('#tc', h.el).innerHTML = `${items.map(x => `<div class="tk"><div class="tx"><b>${esc(x.p.nombre)}</b><small>${money(x.p.precio)} c/u</small></div><div class="qty"><button data-id="${x.p.id}" data-d="-1">−</button><span>${x.q}</span><button data-id="${x.p.id}" data-d="1">+</button></div><b class="n tkt">${money(x.p.precio * x.q)}</b></div>`).join('')}
      <div class="tots"><div class="tot"><span>Productos</span><b class="n">${money(sub)}</b></div>${T.entrega === 'domicilio' ? `<div class="tot"><span>Envío a domicilio</span><b class="n">${env ? money(env) : 'Gratis'}</b></div>` : ''}<div class="tot g"><span>Total</span><b class="n">${money(sub + env)}</b></div></div>
      ${n.minimo && sub < n.minimo ? `<div class="aviso warn sm">${ic('alert', 18)}<div>El pedido mínimo es de ${money(n.minimo)}</div></div>` : ''}
      ${n.entrega === 'ambos' ? `<div class="seg full" id="tc-e" style="margin-bottom:12px"><button class="${T.entrega === 'recoger' ? 'on' : ''}" data-e="recoger">${ic('store', 16)} Recoger</button><button class="${T.entrega === 'domicilio' ? 'on' : ''}" data-e="domicilio">${ic('truck', 16)} A domicilio</button></div>` : `<p class="sm mut">${n.entrega === 'domicilio' ? 'Te lo llevamos a domicilio' : 'Lo recoges en el negocio'}${n.direccion && n.entrega !== 'domicilio' ? ': ' + esc(n.direccion) : ''}</p>`}
      <div class="f2"><label class="fld"><span>Tu nombre</span><input id="tc-n" autocomplete="name" value="${esc(valores.nom !== undefined ? valores.nom : cli.nombre || '')}"></label><label class="fld"><span>Tu WhatsApp</span><input id="tc-t" type="tel" inputmode="tel" autocomplete="tel" placeholder="9876-5432" value="${esc(valores.tel !== undefined ? valores.tel : cli.telefono || '')}"></label></div>
      ${T.entrega === 'domicilio' ? `<label class="fld"><span>Dirección de entrega</span><input id="tc-d" autocomplete="street-address" placeholder="Colonia, calle, casa, referencia" value="${esc(valores.dir !== undefined ? valores.dir : cli.direccion || '')}"></label>` : ''}
      <label class="fld"><span>¿Cómo vas a pagar?</span><select id="tc-p">${n.pagos.map(x => `<option value="${esc(x)}" ${valores.pago === x ? 'selected' : ''}>${esc(x === 'Efectivo' && T.entrega === 'domicilio' ? 'Efectivo al recibir' : x)}</option>`).join('')}</select></label>
      <div id="tc-dp"></div>
      <label class="fld"><span>Nota (opcional)</span><input id="tc-o" placeholder="Ej. color, talla, hora preferida" value="${esc(valores.nota || '')}"></label>`;
    const dp = () => { $('#tc-dp', h.el).innerHTML = $('#tc-p', h.el).value === 'Transferencia' && n.datosPago ? `<div class="aviso info sm">${ic('bank', 18)}<div>${esc(n.datosPago)}</div></div>` : ''; };
    $('#tc-p', h.el).addEventListener('change', dp); dp();
    h.botones([{ t: `${ic('send', 18)} Enviar pedido · ${money(sub + env)}`, cls: 'wa big', fn: enviar }]);
  };
  $('#tc', h.el).addEventListener('click', e => {
    const q = e.target.closest('[data-d]'); if (q) { tAgregar(q.dataset.id, Number(q.dataset.d)); pinta(); return; }
    const en = e.target.closest('[data-e]'); if (en) { T.entrega = en.dataset.e; pinta(); }
  });
  const enviar = async () => {
    const nombre = $('#tc-n', h.el).value.trim(), tel = $('#tc-t', h.el).value.trim(), dir = ($('#tc-d', h.el) || {}).value || '';
    if (nombre.length < 3) throw new Error('Escribe tu nombre');
    if (tel.replace(/\D/g, '').length < 8) throw new Error('Escribe tu número de WhatsApp');
    if (T.entrega === 'domicilio' && dir.trim().length < 5) throw new Error('Escribe la dirección de entrega');
    LS.set('cliente_tienda', JSON.stringify({ nombre, telefono: tel, direccion: dir || cli.direccion || '' }));
    const r = await api('pedir', { negocio: T.id, nombre, telefono: tel, entrega: T.entrega, direccion: dir, pago: $('#tc-p', h.el).value, nota: $('#tc-o', h.el).value, items: Object.keys(T.cart).map(id => ({ id, cantidad: T.cart[id] })) });
    const mis = LS.json(tKey('pedidos'), []) || []; mis.unshift(r.id); LS.set(tKey('pedidos'), JSON.stringify(mis.slice(0, 10)));
    T.cart = {}; guardarCarrito(); h.cerrar(); gridTienda(); pedidoEnviado(r, nombre, tel); misPedidosTienda();
  };
  pinta();
}
function pedidoEnviado(r, nombre, tel) {
  const n = T.info.negocio;
  const txt = [`Hola, soy ${nombre}. Acabo de hacer el pedido *${r.numero}* en línea:`, ...r.items.map(i => `• ${i.cantidad} × ${i.nombre} — ${money(i.total)}`), r.envio ? `Envío: ${money(r.envio)}` : '', `*Total: ${money(r.total)}*`, `${r.entrega === 'domicilio' ? 'A domicilio' : 'Para recoger'} · Pago: ${r.pago}`].filter(Boolean).join('\n');
  const h = hoja({ titulo: '', cls: 'exito', html: `<div class="ok-big"><i>${ic('check', 40)}</i><h2>¡Pedido enviado!</h2><p class="mut">Tu número de pedido es <b>${esc(r.numero)}</b></p><div class="ok-tot n">${money(r.total)}</div>
    <p class="sm">${esc(n.nombre)} ya lo recibió y te confirmará por WhatsApp.</p>${r.datosPago ? `<div class="aviso info sm" style="text-align:left">${ic('bank', 18)}<div><b>Datos para transferir</b><br>${esc(r.datosPago)}</div></div>` : ''}</div>` });
  const bs = [];
  if (n.telefono) bs.push({ t: `${ic('wa', 18)} Avisar por WhatsApp`, cls: 'wa', fn: () => { window.open(waLink(n.telefono, txt), '_blank'); } });
  bs.push({ t: 'Seguir viendo', cls: 'pri', fn: () => h.cerrar() });
  h.botones(bs);
}
async function misPedidosTienda() {
  const ids = LS.json(tKey('pedidos'), []) || [], cli = LS.json('cliente_tienda', {}) || {};
  const box = $('#t-mis'); if (!box || !ids.length || !cli.telefono) return;
  try {
    const l = await api('misPedidos', { negocio: T.id, telefono: cli.telefono, ids }, true);
    const est = { nuevo: ['Recibido', 'b-warn', '📨'], confirmado: ['Confirmado', 'b-info', '👍'], listo: ['¡Listo!', 'b-ok', '✅'], entregado: ['Entregado', 'b-mut', '🎉'], cancelado: ['Cancelado', 'b-bad', '✖️'] };
    const vis = l.filter(p => p.estado !== 'entregado' && p.estado !== 'cancelado' || (Date.now() - parseLocal(p.fecha).getTime()) < 86400000 * 2).slice(0, 3);
    box.innerHTML = vis.length ? `<div class="mis"><b>Tus pedidos</b>${vis.map(p => `<div class="mis-r"><span>${est[p.estado][2]} ${esc(p.numero)} · ${money(p.total)}</span><span class="badge ${est[p.estado][1]}">${est[p.estado][0]}</span></div>`).join('')}</div>` : '';
  } catch (e) {}
}

</script>
