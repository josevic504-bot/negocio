<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8e0a5a">
<title>Gestión de Negocio VM</title>
<meta name="description" content="Administra tu negocio: ventas, inventario, clientes, compras, gastos, caja, reportes y tienda en línea.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--h1:#8e0a5a;--h2:#ec1a82;--pri:#d10f6f;--onpri:#fff;--pri2:#fde7f1;--a1:#ff9500;--a2:#ffc83d;--tag:#ffd98a;
  --bg:#fdf6f9;--card:#fff;--ink:#1f1a24;--mut:#77707f;--line:#f8dbe9;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--glow:rgba(209,15,111,.35);
  --ok:#0f9d63;--okb:#e2f7ec;--warn:#d98a00;--warnb:#fff3dc;--bad:#e0243e;--badb:#ffe6ea;--info:#1d6ff2;--infob:#e5efff;--wa:#1fa855;
  --r:18px;--font:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif}
:root.dark{color-scheme:dark;--okb:#12301f;--warnb:#33270f;--badb:#3a1219;--infob:#13233f;--ok:#3fd18b;--bad:#ff6b7f;--warn:#ffb43d;--info:#6aa6ff}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.serif{font-family:var(--serif)}
.ic{display:block;flex:none}
h2,h3{margin:0;font-weight:600}h3{font-size:16px;margin-bottom:12px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}.n{font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
a{color:var(--pri)}

/* ===== Encabezado (hero) ===== */
.hero{background:radial-gradient(130% 150% at 15% 0%,var(--h2) 0%,var(--h1) 75%);color:#fff;text-align:center;padding:18px 18px 70px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-80px;top:-90px;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent)}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-120px;bottom:-200px;background:radial-gradient(closest-side,color-mix(in srgb,var(--a2) 45%,transparent),transparent)}
.hero-top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;position:relative;z-index:1}
.hero-top .grp{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;cursor:pointer;position:relative}
.hbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:11px;font-weight:600;line-height:18px;padding:0 5px;box-shadow:0 0 0 2px var(--h1)}
.hero-c{position:relative;z-index:1}
.mono{width:64px;height:64px;border-radius:50%;margin:2px auto 6px;display:grid;place-items:center;border:1.5px solid color-mix(in srgb,var(--tag) 80%,transparent);color:var(--tag);font:600 28px var(--serif);background:rgba(255,255,255,.08)}
.hero-logo{width:72px;height:72px;border-radius:20px;margin:0 auto 8px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero-logo img{max-width:100%;max-height:100%;object-fit:contain}
.hero-name{font:600 38px/1.05 var(--serif);letter-spacing:.01em}
.hero-tag{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--tag);margin-top:8px;font-weight:500}
.bar{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:15}
.bar-in{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto;padding:12px 12px 14px}
.bar-t{flex:1;font:600 23px var(--serif);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.bar .hbtn{background:rgba(255,255,255,.1);border-color:transparent}
.tnav{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:1100px;margin:14px auto 0;padding:0 14px}
.tnav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:99px;font:500 14.5px var(--font);cursor:pointer;display:flex;align-items:center;gap:6px}
.tnav button:hover{color:var(--pri)}
.tnav button.on{background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff;box-shadow:0 6px 16px var(--glow)}
.tnav .cnt{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px}

/* ===== Barra inferior (teléfono) ===== */
.bnav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;justify-content:space-around;align-items:flex-end;background:linear-gradient(120deg,var(--h1),var(--h2));border-radius:24px;padding:7px 6px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.bnav button{flex:1;border:0;background:none;color:rgba(255,255,255,.66);display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px var(--font);letter-spacing:.02em;padding:6px 0;border-radius:14px;cursor:pointer;position:relative}
.bnav button.on{color:#fff}
.bnav button.on:before{content:"";position:absolute;top:-1px;width:22px;height:3px;border-radius:2px;background:var(--tag)}
.bnav .cnt{position:absolute;top:0;left:calc(50% + 6px);background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:9px;font-size:10.5px;padding:0 5px;line-height:16px;font-weight:600}
.bnav .sell{flex:none;width:62px;margin-top:-26px}
.bnav .sell i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:4px solid var(--bg);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.bnav .sell.on:before{display:none}
@media(min-width:900px){.bnav{display:none}}
@media screen and (max-width:899px){.tnav{display:none}body.app{padding-bottom:calc(96px + env(safe-area-inset-bottom))}}
main{max-width:1100px;margin:auto;padding:16px 14px}
@media(max-width:600px){main{padding:14px 12px}}

/* ===== Botones / campos ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:13px;font:500 14.5px var(--font);cursor:pointer;white-space:nowrap;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:linear-gradient(120deg,var(--h1),var(--h2));border-color:transparent;color:#fff;box-shadow:0 6px 16px var(--glow)}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.acc{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.btn.acc:hover{color:#fff;filter:brightness(1.05)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{color:#fff;filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.bad:hover{background:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.big{width:100%;padding:14px;font-size:16px;border-radius:16px}
.btn.icon{padding:8px;width:40px;height:40px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--pri);padding:0}
.fld{display:block;margin-bottom:12px}.fld>span{display:block;font-size:13px;color:var(--mut);margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.srch{position:relative}.srch .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}.srch input{padding-left:40px}

/* ===== Chips / pestañas ===== */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:99px;font:500 13.5px var(--font);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.chip .c{background:var(--pri2);color:var(--pri);border-radius:9px;padding:0 6px;font-size:11.5px;font-weight:600}
.chip.on .c{background:rgba(255,255,255,.25);color:#fff}
.seg{display:inline-flex;background:var(--pri2);border-radius:14px;padding:4px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;color:var(--ink);padding:7px 14px;border-radius:11px;font:500 13.5px var(--font);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* ===== Tarjetas ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}.sec-t h3{margin:0;font-size:17px}
.sec-t a{color:var(--pri);font-size:13.5px;cursor:pointer;text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--k,var(--pri))}
.kpi small{display:block;color:var(--mut);font-size:12.5px}
.kpi b{display:block;font-size:20px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:28px 10px}

/* ===== Inicio ===== */
.today{position:relative;z-index:3;background:var(--card);border-radius:26px;box-shadow:0 14px 34px rgba(0,0,0,.12);padding:18px 18px 16px;margin:-52px auto 16px;max-width:560px;border:1px solid var(--line)}
.today-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.today small{color:var(--mut);font-size:13px}
.today .big{font-size:32px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.15}
.today .sub{font-size:13px;color:var(--mut);margin-top:2px}
.today .sub b{color:var(--ok);font-weight:600}
.spark{width:110px;height:46px;flex:none}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px var(--font);color:var(--ink);cursor:pointer;padding:2px 0}
.qa i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--q1),var(--q2));box-shadow:0 6px 14px color-mix(in srgb,var(--q1) 35%,transparent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:0 auto}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:22px;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 10px 22px color-mix(in srgb,var(--t1) 30%,transparent);position:relative;overflow:hidden;border:0;text-align:left;font:inherit;width:100%;min-width:0}
.tile:after{content:"";position:absolute;right:-34px;top:-34px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.12)}
.tile .ti{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.tile .tl{font-size:12.5px;opacity:.92;letter-spacing:.01em}
.tile .tv{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ts{font-size:11.5px;opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ta{position:absolute;right:12px;top:14px;opacity:.85;z-index:1}
.t-pri{--t1:var(--h1);--t2:var(--h2)}.t-acc{--t1:color-mix(in srgb,var(--a1) 85%,#000);--t2:var(--a1)}
.t-verde{--t1:#00915a;--t2:#2fd58b}.t-naranja{--t1:#f25c05;--t2:#ffa83a}.t-azul{--t1:#1b4fd8;--t2:#3d9bff}
.t-rojo{--t1:#d61f3c;--t2:#ff6a6a}.t-morado{--t1:#6a1fe0;--t2:#b06cff}.t-cian{--t1:#008fa8;--t2:#22d3e6}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:11px 12px;box-shadow:var(--sh);cursor:pointer}
.li .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--t1,var(--h1)),var(--t2,var(--h2)));font-size:15px;overflow:hidden}
.li .av img{width:100%;height:100%;object-fit:cover}
.li .tx{flex:1;min-width:0}.li .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .am{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .am small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
.hg{max-width:560px;margin:0 auto}
@media(min-width:900px){
  .hero{padding-bottom:34px}.hero-name{font-size:44px}
  .hg{display:grid;grid-template-columns:minmax(0,440px) 1fr;gap:22px;align-items:start;max-width:none;margin-top:8px}
  .today{margin:0 0 16px;max-width:none}.tiles{grid-template-columns:repeat(3,1fr);max-width:none;margin:0}
  .tile .tv{font-size:21px}
}

/* ===== Etiquetas ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--pri2);color:var(--pri);white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-bad{background:var(--badb);color:var(--bad)}.b-info{background:var(--infob);color:var(--info)}.b-mut{background:color-mix(in srgb,var(--mut) 14%,transparent);color:var(--mut)}

/* ===== Vender ===== */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);position:relative;text-align:left;padding:0;font:inherit;color:inherit;display:flex;flex-direction:column}
.pc:active{transform:scale(.98)}
.pc .ph{aspect-ratio:4/3;display:grid;place-items:center;font-size:44px;background:linear-gradient(135deg,var(--t1),var(--t2));color:#fff;position:relative;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pc .ph .ini{font:600 30px var(--serif)}
.pc .bd{padding:9px 11px 11px}
.pc .nm{font-weight:500;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pc .pr{font-weight:600;font-size:16px;color:var(--pri);margin-top:4px;font-variant-numeric:tabular-nums}
.pc .st{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);color:#333;border-radius:8px;padding:1px 7px;z-index:1}
.pc .st.low{background:#fff1e0;color:#c76a00}
.pc .qn{position:absolute;top:8px;right:8px;z-index:1;min-width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;padding:0 7px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.pc .add{position:absolute;right:9px;bottom:9px;width:32px;height:32px;border-radius:11px;background:var(--pri2);color:var(--pri);display:grid;place-items:center}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--a1),var(--a2));color:#fff;border-radius:20px;padding:10px 12px 10px 14px;box-shadow:0 12px 28px rgba(0,0,0,.25);cursor:pointer;border:0;font:inherit;max-width:560px;margin:0 auto}
.cartbar .ci{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;position:relative}
.cartbar .ci b{position:absolute;top:-6px;right:-6px;background:#fff;color:var(--a1);font-size:11.5px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.cartbar .ct{flex:1;text-align:left;line-height:1.2}.cartbar .ct small{display:block;opacity:.9;font-size:12px}.cartbar .ct strong{font-size:19px;font-variant-numeric:tabular-nums}
.cartbar .go{background:#fff;color:#1f1a24;border-radius:13px;padding:9px 14px;font-weight:600;display:flex;align-items:center;gap:6px}
@media(min-width:900px){.cartbar{bottom:20px;left:auto;right:24px;width:420px}}

/* ===== Hoja inferior (modal) ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(15,8,20,.5);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;max-height:94vh;overflow:auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet-h h3{margin:0;font:600 24px var(--serif)}
@media(min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:26px;max-height:90vh}}
.tk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tk .tx{flex:1;min-width:0}.tk .tx b{display:block;font-weight:500;font-size:14.5px}.tk .tx small{color:var(--mut);font-size:12.5px}
.qty{display:flex;align-items:center;background:var(--pri2);border-radius:12px}
.qty button{border:0;background:none;color:var(--pri);width:32px;height:32px;font:600 18px var(--font);cursor:pointer;display:grid;place-items:center}
.qty span{min-width:22px;text-align:center;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--mut)}
.tot.g{font-size:20px;color:var(--ink);font-weight:600;padding-top:8px}
.tot b{font-variant-numeric:tabular-nums;font-weight:500;color:var(--ink)}.tot.g b{font-weight:700;color:var(--pri)}
.pays{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pay{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:9px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 12.5px var(--font);color:var(--ink);cursor:pointer}
.pay.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.cambio{display:flex;justify-content:space-between;align-items:center;background:var(--okb);color:var(--ok);border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:500}
.cambio b{font-size:19px}

/* ===== Comprobante ===== */
.recibo{width:380px;background:#fff;color:#1f1a24;border-radius:24px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.18);font-family:var(--font)}
.recibo .rh{background:radial-gradient(130% 150% at 15% 0%,var(--h2) 0%,var(--h1) 75%);color:#fff;text-align:center;padding:22px 20px 26px;position:relative}
.recibo .rh .mono{width:54px;height:54px;font-size:23px}
.recibo .rh h4{margin:0;font:600 28px/1.1 var(--serif)}
.recibo .rh p{margin:6px 0 0;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--tag)}
.recibo .rb{padding:18px 22px 8px}
.recibo .rt{text-align:center;margin-bottom:12px}.recibo .rt b{display:block;font:600 21px var(--serif);color:var(--pri)}
.recibo .rt small{color:#7a7380;font-size:12px}
.recibo .rm{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px;background:#faf7fb;border-radius:14px;padding:10px 12px;margin-bottom:12px}
.recibo .rm small{display:block;color:#8a8390;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.recibo .ri{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed #eee}
.recibo .ri span:first-child{flex:1}.recibo .ri small{color:#8a8390}
.recibo .rs{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:#6b6472}
.recibo .rtot{display:flex;justify-content:space-between;align-items:center;margin:10px -22px 0;padding:14px 22px;background:linear-gradient(120deg,var(--h1),var(--h2));color:#fff}
.recibo .rtot b{font-size:26px;font-variant-numeric:tabular-nums}
.recibo .rf{text-align:center;padding:14px 20px 18px;font-size:12px;color:#7a7380}
.recibo .rf em{display:block;font:italic 500 18px var(--serif);color:var(--pri);margin-bottom:6px}

/* ===== Pedidos ===== */
.ord{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);margin-bottom:10px;position:relative;overflow:hidden}
.ord.new{border-color:color-mix(in srgb,var(--a1) 60%,transparent)}
.ord.new:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--a1),var(--a2))}
.ord-h{display:flex;align-items:center;gap:10px}
.ord-h .tx{flex:1;min-width:0}.ord-h b{font-weight:600}.ord-h small{display:block;color:var(--mut);font-size:12.5px}
.ord-i{margin:10px 0;font-size:13.5px;color:var(--ink);background:var(--bg);border-radius:14px;padding:9px 12px}
.ord-i div{display:flex;justify-content:space-between;padding:2px 0}
.ord-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ord-f .t{font-size:18px;font-weight:700;color:var(--pri);margin-right:auto;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:4px;margin:10px 0 2px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:linear-gradient(90deg,var(--h1),var(--h2))}

/* ===== Tienda en línea (cliente) ===== */
.shop-hero{background:radial-gradient(130% 150% at 15% 0%,var(--h2) 0%,var(--h1) 75%);color:#fff;text-align:center;padding:26px 18px 60px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.shop-hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;left:-120px;bottom:-200px;background:radial-gradient(closest-side,color-mix(in srgb,var(--a2) 45%,transparent),transparent)}
.shop-st{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-size:12.5px;position:relative;z-index:1}
.shop-st i{width:8px;height:8px;border-radius:50%;background:#4ef08f;box-shadow:0 0 0 3px rgba(78,240,143,.3)}
.shop-box{max-width:760px;margin:-40px auto 0;padding:0 12px 120px;position:relative;z-index:2}
.shop-srch{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.12);margin-bottom:12px}
.shop-srch input{border:0;background:var(--bg)}
.sp-card .bd .row{justify-content:space-between;align-items:center;margin-top:6px}
.sp-add{border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:11px;padding:6px 11px;font:600 13px var(--font);display:flex;align-items:center;gap:4px;cursor:pointer}
.shop-cart{bottom:calc(14px + env(safe-area-inset-bottom))}

/* ===== Reportes ===== */
.chart{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:6px}
.bars div{flex:1;display:flex;gap:2px;align-items:flex-end;height:100%}
.bars i{flex:1;border-radius:5px 5px 2px 2px;background:linear-gradient(var(--h2),var(--h1))}
.bars i.g{background:linear-gradient(var(--a2),var(--a1))}
.bars-x{display:flex;gap:6px;font-size:10.5px;color:var(--mut);margin-top:5px}.bars-x span{flex:1;text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.rank{display:flex;align-items:center;gap:10px;padding:7px 0}
.rank .nm{flex:1;font-size:13.5px}.rank .bw{flex:1.2;height:8px;border-radius:4px;background:var(--pri2);overflow:hidden}.rank .bw i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--h1),var(--h2))}
.rank .v{font-weight:600;font-size:13px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}

/* ===== Apariencia ===== */
.temas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tema{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:8px 8px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12.5px var(--font);color:var(--ink)}
.tema .sw{width:100%;height:56px;border-radius:12px;background:radial-gradient(130% 150% at 15% 0%,var(--x2) 0%,var(--x1) 75%);position:relative;overflow:hidden}
.tema .sw i{position:absolute;right:8px;bottom:8px;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--xa1),var(--xa2));border:2px solid #fff}
.tema.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* crédito */
.credit{max-width:1100px;margin:6px auto 0;padding:6px 16px 14px;text-align:center;font-size:10px;color:var(--mut);opacity:.6}
.credit a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}

/* ===== Base app ===== */
body.noscroll{overflow:hidden}
#loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--a1),var(--a2),transparent);background-size:200% 100%;animation:ld 1s linear infinite}
#loader.on{opacity:1}
@keyframes ld{from{background-position:200% 0}to{background-position:-200% 0}}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:90;display:flex;flex-direction:column;gap:8px;width:min(440px,calc(100vw - 24px));pointer-events:none}
.toast{background:#221b2a;color:#fff;border-radius:14px;padding:11px 15px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:auto}
.toast.in{opacity:1;transform:none}
.toast.ok{background:linear-gradient(120deg,#00804f,#00a565)}
.toast.error{background:linear-gradient(120deg,#b3122d,#e0243e)}
.demo-tag{border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font:700 10.5px var(--font);letter-spacing:.08em;padding:5px 10px;border-radius:99px;cursor:pointer;white-space:nowrap}
.bar .demo-tag{margin-right:2px}
@media(max-width:480px){.bar .demo-tag{display:none}}
.hg .banner{width:100%;margin:-4px 0 14px}
.hero-top .demo-tag{position:absolute;left:50%;transform:translateX(-50%)}
.banner{display:flex;align-items:center;gap:10px;max-width:1100px;margin:12px auto 0;width:calc(100% - 24px);background:linear-gradient(120deg,var(--pri2),var(--card));border:1px solid var(--line);border-radius:16px;padding:9px 10px 9px 14px;font-size:14px;color:var(--ink)}
.banner span{flex:1}.banner .ic{color:var(--pri)}
#banner:empty{display:none}
.credit{margin-bottom:8px}
.hg1{max-width:560px;margin:0 auto}
@media(min-width:900px){.hg1{max-width:none}}
.input-row{display:flex;gap:6px;align-items:center}.input-row input,.input-row select{flex:1;min-width:0}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
@media(max-width:560px){.f3{grid-template-columns:1fr 1fr}.f2.keep{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.f2{grid-template-columns:1fr}.f3{grid-template-columns:1fr}.f2 .fld{min-width:0}}
.hint{display:block;font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.4}
.hint a,.tot a{color:var(--pri);cursor:pointer;font-weight:500}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;cursor:pointer;margin:6px 12px 6px 0}
textarea{resize:vertical;min-height:44px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.sw-row{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;border-top:1px dashed var(--line)}
.sw-row input{position:absolute;opacity:0;width:0;height:0}
.sw-row .sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:.2s}
.sw-row .sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.sw-row input:checked+.sw{background:linear-gradient(120deg,var(--h1),var(--h2))}
.sw-row input:checked+.sw:after{left:21px}
.sw-row b{display:block;font-weight:500;font-size:14.5px}.sw-row small{color:var(--mut);font-size:12.5px}
.seg.full{display:flex;width:100%}.seg.full button{flex:1}
.seg button .ic{display:inline-block;vertical-align:-3px;margin-right:5px}
.seg.tabs{display:flex;width:100%;overflow-x:auto}
.chips.wrap{flex-wrap:wrap}
.li.anul{opacity:.55}.li.anul b{text-decoration:line-through}
.li .av .emo,.av .emo{font-size:22px;line-height:1}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:12px}.av.sm .emo{font-size:17px}
.av.lg{width:56px;height:56px;border-radius:18px;font-size:20px}
.av.xl{width:96px;height:96px;border-radius:26px;font-size:30px}.av.xl .emo{font-size:48px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--t1,var(--h1)),var(--t2,var(--h2)))}
.empty-big{text-align:center;padding:30px 16px;background:var(--card);border:1px dashed var(--line);border-radius:22px;color:var(--mut)}
.empty-big>.ic{margin:0 auto 8px;color:var(--pri)}.empty-big h3{color:var(--ink);font:600 22px var(--serif)}.empty-big p{margin:0 0 14px}
.empty-big .btn{margin:4px}
.empty.sm{padding:12px;font-size:13px}
.aviso{display:flex;align-items:center;gap:12px;background:var(--warnb);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--ink);border-radius:18px;padding:12px 14px;margin:12px 0}
.aviso>.ic{color:var(--warn)}.aviso>div{flex:1;min-width:0}.aviso b{display:block;font-weight:600}.aviso small{display:block;color:var(--mut)}
.aviso.info{background:var(--infob);border-color:color-mix(in srgb,var(--info) 25%,transparent)}.aviso.info>.ic{color:var(--info)}
.aviso.bad{background:var(--badb);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}.aviso.bad>.ic{color:var(--bad)}
.aviso.sm{font-size:13px;padding:9px 12px;margin:8px 0}.aviso.sm b{display:inline}
.panel h3{display:flex;align-items:center;gap:8px}
.kpis.k4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis.k4{grid-template-columns:repeat(4,1fr)}}
.kpi b.pos{color:var(--ok)}.kpi b.neg{color:var(--bad)}
.skl{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--pri2),var(--line));background-size:200% 100%;animation:ld 1.4s linear infinite;margin:8px 0}.skl.big{height:34px;width:70%}

/* ===== Ingreso ===== */
#login{min-height:100vh;display:flex;flex-direction:column}
.lg-hero{background:radial-gradient(130% 150% at 15% 0%,var(--h2) 0%,var(--h1) 75%);color:#fff;text-align:center;padding:42px 20px 96px;border-radius:0 0 40px 40px;position:relative;overflow:hidden}
.lg-hero:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-100px;top:-120px;background:radial-gradient(closest-side,rgba(255,255,255,.18),transparent)}
.lg-hero:after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;left:-130px;bottom:-210px;background:radial-gradient(closest-side,color-mix(in srgb,var(--a2) 50%,transparent),transparent)}
.lg-hero>*{position:relative;z-index:1}.lg-hero .mono{width:72px;height:72px}
.lg-card{position:relative;z-index:2;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 18px 44px rgba(0,0,0,.14);padding:22px 20px 16px;margin:-70px auto 16px;width:min(460px,calc(100% - 24px))}
.lg-t{font:600 26px var(--serif);margin:0 0 4px}.lg-p{color:var(--mut);margin:0 0 16px;font-size:14.5px;line-height:1.5}.lg-p.sm{font-size:13px;text-align:center;margin:10px 0}

.lg-card .btn.ghost.big{font-size:14.5px;padding:10px;margin-top:4px}

/* ===== Hojas ===== */
#capa .sheet-bg{opacity:0;transition:opacity .2s}
#capa .sheet-bg.in{opacity:1}
#capa .sheet{transform:translateY(30px);transition:transform .22s ease;display:flex;flex-direction:column;padding:8px 0 0}
#capa .sheet-bg.in .sheet{transform:none}
.sheet-h{padding:0 18px}.sheet-h h3{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{padding:4px 18px 12px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.sheet-f .btn{flex:1}.sheet-f .btn.icon{flex:none;width:48px}
.sheet-f .btn.big{flex:1 1 100%}
.sheet{max-height:92vh}
.sheet.chica{max-width:440px}
.sheet.ancha{max-width:680px}

.sheet.exito .sheet-h h3{display:none}.sheet.exito .sheet-h{justify-content:flex-end}
.sheet.menu .sheet-b{padding-bottom:18px}
.btn.solid.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.conf{margin:0 0 12px;line-height:1.5}
.btn.icon.bad{color:var(--bad)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;background:var(--bg);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:14px}
.kv small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tks{margin-bottom:6px}.tk .tkt{min-width:86px;text-align:right}.tk .tx small a{color:var(--pri)}
.tots{padding:8px 0 10px}
.tot.g{border-top:1px solid var(--line);margin-top:4px}
.pays.three{grid-template-columns:repeat(3,1fr)}
.rapidos{display:flex;gap:5px;flex-wrap:wrap}.rapidos .chip{padding:7px 10px}
.cambio.warn{background:var(--warnb);color:var(--warn)}.cambio.bad{background:var(--badb);color:var(--bad)}.cambio.info{background:var(--infob);color:var(--info)}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}.acciones .btn{flex:1 1 auto}
.ok-big{text-align:center;padding:6px 0 4px}
.ok-big>i{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 10px;border-radius:50%;color:#fff;background:linear-gradient(135deg,#00915a,#2fd58b);box-shadow:0 10px 26px rgba(0,145,90,.35);animation:pop .35s ease}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.ok-big h2{font:600 28px var(--serif)}.ok-big p{margin:4px 0}
.ok-tot{font-size:34px;font-weight:700;color:var(--pri);margin:6px 0 10px}
.ok-big .cambio{text-align:left}
.msg-prev{background:#e7ffdb;color:#1d2b18;border-radius:14px 14px 14px 4px;padding:10px 13px;font-size:14px;line-height:1.45}
:root.dark .msg-prev{background:#103420;color:#d9f5df}

/* ===== Menú ===== */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:380px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mi{border:0;background:var(--bg);border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font:500 12.5px var(--font);color:var(--ink);cursor:pointer;position:relative}
.mi i{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2))}
.mi.on{outline:2px solid var(--pri)}
.mi .cnt{position:absolute;top:6px;right:10px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:18px}
.me-row{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}

/* ===== Pedidos ===== */

/* ===================== ENTRADA HTTP ===================== */

function doGet() {
  return json_({ ok: true, app: 'Gestión de Negocio VM', version: VERSION, multi: MULTI_NEGOCIO });
}

function doPost(e) {
  let out;
  try {
    const req = JSON.parse(e.postData.contents || '{}');
    out = { ok: true, data: route_(req) };
  } catch (err) {
    out = { ok: false, error: String(err && err.message ? err.message : err) };
  }
  return json_(out);
}

function json_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}

function route_(req) {
  Object.keys(MEMO).forEach(k => { delete MEMO[k]; });
  NEG = null;
  const a = req.action, d = req.data || {};
  if (!MULTI_NEGOCIO && a !== 'tiendaInfo' && a !== 'pedir' && a !== 'misPedidos') {
    const lic = licencia_();
    if (lic.estado === 'vencida') throw new Error('PRUEBA_VENCIDA|' + JSON.stringify({ contacto: CONTACTO_WA, nombre: config_().nombre }));
  }
  if (a === 'login') return MULTI_NEGOCIO ? loginMulti_(d) : login_(d);
  if (a === 'registrar') return registrar_(d);
  if (a === 'info') return { multi: MULTI_NEGOCIO, version: VERSION };
  // Tienda en línea (página pública, sin usuario)
  if (a === 'tiendaInfo') return tiendaInfo_(d);
  if (a === 'pedir') return lock_(() => pedir_(d));
  if (a === 'misPedidos') return misPedidos_(d);
  const u = auth_(req.token);
  switch (a) {
    case 'logout':          CacheService.getScriptCache().remove('S_' + req.token); return true;
    case 'bootstrap':       return bootstrap_(u, d);
    case 'inicio':          return inicio_(u);
    case 'pendientes':      return pendientes_(u);
    case 'guardar':         return lock_(() => guardar_(u, d));
    case 'eliminar':        return lock_(() => eliminar_(u, d));
    case 'guardarUsuario':  return lock_(() => guardarUsuario_(u, d));
    case 'cambiarClave':    return lock_(() => cambiarClave_(u, d));
    case 'subirFoto':       return subirFoto_(u, d);
    case 'cargarEjemplos':  return lock_(() => cargarEjemplos_(u, d));
    case 'precios':         return lock_(() => precios_(u, d));
    case 'activarPlus':     return lock_(() => activarPlus_(u, d));
    case 'venta':           return lock_(() => venta_(u, d));
    case 'ventas':          return ventas_(u, d);
    case 'anularVenta':     return lock_(() => anularVenta_(u, d));
    case 'abono':           return lock_(() => abono_(u, d));
    case 'anularAbono':     return lock_(() => anularAbono_(u, d));
    case 'cuentaCliente':   return cuentaCliente_(u, d);
    case 'compra':          return lock_(() => compra_(u, d));
    case 'compras':         return compras_(u, d);
    case 'anularCompra':    return lock_(() => anularCompra_(u, d));
    case 'pago':            return lock_(() => pago_(u, d));
    case 'anularPago':      return lock_(() => anularPago_(u, d));
    case 'cuentaProveedor': return cuentaProveedor_(u, d);
    case 'ajusteStock':     return lock_(() => ajusteStock_(u, d));
    case 'kardex':          return kardex_(u, d);
    case 'gastos':          return gastos_(u, d);
    case 'guardarGasto':    return lock_(() => guardarGasto_(u, d));
    case 'anularGasto':     return lock_(() => anularGasto_(u, d));
    case 'pedidos':         return pedidos_(u, d);
    case 'estadoPedido':    return lock_(() => estadoPedido_(u, d));
    case 'caja':            return caja_(u, d);
    case 'cerrarCaja':      return lock_(() => cerrarCaja_(u, d));
    case 'reporte':         return reporte_(u, d);
    case 'diario':          return diario_(u, d);
    case 'historial':       return historial_(u);
    case 'guardarDistribucion': return lock_(() => guardarDistribucion_(u, d));
    case 'anularDistribucion':  return lock_(() => anularDistribucion_(u, d));
    case 'inventario':      return inventario_(u, d);
    case 'cuentas':         return cuentas_(u, d);
    default: throw new Error('Acción no válida: ' + a);
  }
}

function lock_(fn) {
  const l = LockService.getScriptLock();
  l.waitLock(25000);
  try { return fn(); } finally { l.releaseLock(); }
}

/* ===================== HOJAS (BASE DE DATOS) ===================== */

const MEMO = {};

function ss_() {
  if (MULTI_NEGOCIO && NEG) {
    if (!MEMO._ss) MEMO._ss = SpreadsheetApp.openById(NEG.hojaId);
    return MEMO._ss;
  }
  return SpreadsheetApp.getActiveSpreadsheet();
}
function ck_(name) { return 'H_' + (NEG ? NEG.id + '_' : '') + name; }

function sh_(name) {
  const ss = ss_();
  let s = ss.getSheetByName(name);
  if (!s) {
    s = ss.insertSheet(name);
    const h = SCHEMA[name];
    s.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold').setBackground('#d10f6f').setFontColor('#ffffff');
    s.setFrozenRows(1);
    h.forEach((k, i) => { if (TEXTO.has(k)) s.getRange(2, i + 1, s.getMaxRows() - 1, 1).setNumberFormat('@'); });
  }
  return s;
}

function obj_(h, r) {
  const o = {};
  h.forEach((k, i) => {
    let x = r[i];
    if (x instanceof Date) x = Utilities.formatDate(x, TZ, k === 'mes' ? 'yyyy-MM' : SOLO_FECHA.has(k) ? 'yyyy-MM-dd' : "yyyy-MM-dd'T'HH:mm");
    if (NUMS.has(k)) x = Number(x) || 0;
    else if (BOOLS.has(k)) x = (x === true || x === 'true' || x === 'TRUE' || x === 1 || x === 'SI');
    else x = (x === null || x === undefined) ? '' : String(x);
    o[k] = x;
  });
  return o;
}

// Hojas pequeñas que se guardan en caché unos minutos para responder más rápido
const CACHE_HOJAS = ['Usuarios','Productos','Clientes','Proveedores','Config'];
const CACHE_SEG = 600;

function rows_(name) {
  if (!MEMO[name]) {
    const cacheable = CACHE_HOJAS.indexOf(name) >= 0;
    let data = null;
    if (cacheable) { try { const c = CacheService.getScriptCache().get(ck_(name)); if (c) data = JSON.parse(c); } catch (e) { data = null; } }
    if (!data) {
      const s = sh_(name), n = s.getLastRow(), h = SCHEMA[name];
      data = n < 2 ? [] : s.getRange(2, 1, n - 1, h.length).getValues()
        .filter(r => r[0] !== '' && r[0] !== null)
        .map(r => obj_(h, r));
      if (cacheable) { try { const j = JSON.stringify(data); if (j.length < 95000) CacheService.getScriptCache().put(ck_(name), j, CACHE_SEG); } catch (e) {} }
    }
    MEMO[name] = data;
  }
  return MEMO[name].map(o => Object.assign({}, o));
}

function invalidar_(name) {
  delete MEMO[name];
  try { CacheService.getScriptCache().remove(ck_(name)); } catch (e) {}
}

function cell_(v) { return (v === undefined || v === null) ? '' : v; }

function findRow_(s, id) {
  const n = s.getLastRow();
  if (n < 2 || !id) return 0;
  const f = s.getRange(2, 1, n - 1, 1).createTextFinder(String(id)).matchEntireCell(true).findNext();
  return f ? f.getRow() : 0;
}

let SEQ_ = 0;
function newId_(name) {
  SEQ_ = (SEQ_ + 1) % 1296;
  return (PREFIJO[name] || 'X') + Date.now().toString(36).toUpperCase() + SEQ_.toString(36).toUpperCase().padStart(2, '0') +
    Math.floor(Math.random() * 1296).toString(36).toUpperCase().padStart(2, '0');
}

function upsert_(name, rec) {
  const s = sh_(name), h = SCHEMA[name];
  const r = rec.id ? findRow_(s, rec.id) : 0;
  let full = rec;
  if (r) {
    const prev = obj_(h, s.getRange(r, 1, 1, h.length).getValues()[0]);
    full = Object.assign(prev, rec);
  } else if (!full.id) {
    full.id = newId_(name);
  }
  const row = h.map(k => cell_(full[k]));
  if (r) s.getRange(r, 1, 1, h.length).setValues([row]);
  else s.appendRow(row);
  invalidar_(name);
  return obj_(h, row);
}

function appendRows_(name, objs) {
  if (!objs.length) return;
  const s = sh_(name), h = SCHEMA[name];
  const vals = objs.map(o => h.map(k => cell_(o[k])));
  s.getRange(s.getLastRow() + 1, 1, vals.length, h.length).setValues(vals);
  invalidar_(name);
}

function deleteRow_(name, id) {
  const s = sh_(name), r = findRow_(s, id);
  if (!r) throw new Error('Registro no encontrado');
  s.deleteRow(r);
  invalidar_(name);
}

function ahora_() { return Utilities.formatDate(new Date(), TZ, "yyyy-MM-dd'T'HH:mm"); }
function hoy_() { return Utilities.formatDate(new Date(), TZ, 'yyyy-MM-dd'); }
function diasAtras_(n) { return Utilities.formatDate(new Date(Date.now() - n * 86400000), TZ, 'yyyy-MM-dd'); }
function r2_(n) { return Math.round((Number(n) || 0) * 100) / 100; }
function r3_(n) { return Math.round((Number(n) || 0) * 1000) / 1000; }
function txt_(s, max) { return String(s === undefined || s === null ? '' : s).trim().replace(/\s+/g, ' ').slice(0, max || 200); }
function tel8_(t) { return String(t || '').replace(/\D/g, '').slice(-8); }
function porId_(lista) { const m = {}; lista.forEach(x => { m[x.id] = x; }); return m; }
// Ordena de más reciente a más antiguo (los del mismo minuto: el último registrado primero)
function desc_(lista, campo) { return lista.slice().reverse().sort((a, b) => a[campo] < b[campo] ? 1 : a[campo] > b[campo] ? -1 : 0); }
function parseJ_(s, def) { try { return s ? JSON.parse(s) : def; } catch (e) { return def; } }
function money_(n, cfg) { return (cfg.moneda || 'L') + ' ' + r2_(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ===================== SEGURIDAD ===================== */

function hash_(clave, salt) {
  const b = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + clave, Utilities.Charset.UTF_8);
  return Utilities.base64Encode(b);
}

function publico_(u) { const o = Object.assign({}, u); delete o.hash; delete o.salt; return o; }

function req_(u, roles) {
  if (roles.indexOf(u.rol) < 0) throw new Error('No tienes permiso para esta acción');
}

function login_(d) {
  const c = CacheService.getScriptCache();
  const usuario = String(d.usuario || '').trim().toLowerCase();
  const kf = 'F_' + usuario;
  const fallos = Number(c.get(kf) || 0);
  if (fallos >= 5) throw new Error('Demasiados intentos fallidos. Espera 10 minutos.');
  const u = rows_('Usuarios').find(x => String(x.usuario).toLowerCase() === usuario);
  if (!u || !u.activo || hash_(String(d.clave || ''), u.salt) !== u.hash) {
    c.put(kf, String(fallos + 1), 600);
    throw new Error('Usuario o contraseña incorrectos');
  }
  c.remove(kf);
  return { token: nuevoToken_(u.id), usuario: publico_(u) };
}

function auth_(token) {
  if (!token) throw new Error('SESION');
  const c = CacheService.getScriptCache();
  const val = c.get('S_' + token);
  if (!val) throw new Error('SESION');
  let uid = val;
  if (MULTI_NEGOCIO) {
    const p = val.split('|'), lic = negocioPorId_(p[0]);
    if (!lic) throw new Error('SESION');
    setNegocio_(lic); uid = p[1];
    bloquearSiVence_();
  }
  const u = rows_('Usuarios').find(x => x.id === uid);
  if (!u || !u.activo) throw new Error('SESION');
  c.put('S_' + token, val, SESION_SEG); // sesión deslizante
  return u;
}

function nuevoToken_(valor) {
  const token = Utilities.getUuid().replace(/-/g, '') + Utilities.getUuid().replace(/-/g, '');
  CacheService.getScriptCache().put('S_' + token, valor, SESION_SEG);
  return token;
}

function cambiarClave_(u, d) {
  if (hash_(String(d.actual || ''), u.salt) !== u.hash) throw new Error(MULTI_NEGOCIO ? 'El PIN actual no es correcto' : 'La contraseña actual no es correcta');
  if (MULTI_NEGOCIO ? !/^\d{4,6}$/.test(String(d.nueva || '')) : String(d.nueva || '').length < 6) throw new Error(MULTI_NEGOCIO ? 'El PIN debe tener de 4 a 6 números' : 'La nueva contraseña debe tener al menos 6 caracteres');
  const salt = Utilities.getUuid();
  upsert_('Usuarios', { id: u.id, salt: salt, hash: hash_(d.nueva, salt) });
  return true;
}

function guardarUsuario_(u, d) {
  req_(u, ['admin']);
  const r = Object.assign({}, d.registro || {});
  const todos = rows_('Usuarios');
  r.usuario = MULTI_NEGOCIO ? waNorm_(r.usuario) : String(r.usuario || '').trim().toLowerCase();
  r.nombre = txt_(r.nombre, 60);
  if (!r.usuario || !r.nombre) throw new Error(MULTI_NEGOCIO ? 'Nombre y WhatsApp son obligatorios' : 'Usuario y nombre son obligatorios');
  if (MULTI_NEGOCIO) {
    if (r.usuario.length < 10) throw new Error('Escribe un número de WhatsApp válido');
    if (mRows_('Accesos').some(x => String(x.whatsapp) === r.usuario && !(x.negocioId === NEG.id && x.usuarioId === r.id))) throw new Error('Ese WhatsApp ya está registrado en otra cuenta');
  }
  if (/\s/.test(r.usuario)) throw new Error('El usuario no debe tener espacios');
  if (todos.some(x => x.usuario === r.usuario && x.id !== r.id)) throw new Error('Ese usuario ya existe');
  if (ROLES.indexOf(r.rol) < 0) throw new Error('Rol no válido');
  if (r.id === u.id && (r.rol !== 'admin' || r.activo === false)) throw new Error('No puedes quitarte el rol de administrador ni desactivarte');
  delete r.hash; delete r.salt;
  if (d.clave) {
    if (MULTI_NEGOCIO && !/^\d{4,6}$/.test(String(d.clave))) throw new Error('El PIN debe tener de 4 a 6 números');
    if (!MULTI_NEGOCIO && String(d.clave).length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres');
    r.salt = Utilities.getUuid();
    r.hash = hash_(d.clave, r.salt);
  } else if (!r.id) {
    throw new Error(MULTI_NEGOCIO ? 'Asigna un PIN al nuevo usuario' : 'Asigna una contraseña al nuevo usuario');
  }
  if (!r.id) { r.creado = ahora_(); if (r.activo === undefined) r.activo = true; }
  const g = upsert_('Usuarios', r);
  if (MULTI_NEGOCIO) {
    const acc = mRows_('Accesos').find(x => x.negocioId === NEG.id && x.usuarioId === g.id);
    if (acc) mSet_('Accesos', acc._fila, { whatsapp: g.usuario, activo: g.activo });
    else mAppend_('Accesos', { whatsapp: g.usuario, negocioId: NEG.id, usuarioId: g.id, activo: g.activo });
    if (NEG.lic._fila) mSet_('Licencias', NEG.lic._fila, { usuarios: rows_('Usuarios').filter(x => x.activo).length });
  }
  return publico_(g);
}

/* ===================== CONFIGURACIÓN ===================== */

function config_() {
  const o = Object.assign({}, CONFIG_DEF);
  rows_('Config').forEach(r => { o[r.clave] = String(r.valor); });
  return o;
}

function guardarConfig_(reg) {
  if (reg && reg.logo && String(reg.logo).length > 48000) throw new Error('El logo es muy pesado. Usa una imagen más sencilla o más pequeña.');
  const s = sh_('Config');
  const actual = Object.assign(config_(), reg || {});
  const vals = Object.keys(actual).map(k => [k, String(actual[k])]);
  if (s.getLastRow() > 1) s.getRange(2, 1, s.getLastRow() - 1, 2).clearContent();
  s.getRange(2, 1, vals.length, 2).setValues(vals);
  invalidar_('Config');
  return actual;
}

// Número consecutivo para ventas (V), compras (C) y pedidos (P)
function siguiente_(letra) {
  const k = 'seq' + letra, cfg = config_();
  const n = (Number(cfg[k]) || 0) + 1;
  const o = {}; o[k] = String(n);
  guardarConfig_(o);
  return letra + '-' + String(n).padStart(5, '0');
}

  const m = {};
  rows_('Ventas').forEach(v => { if (!v.anulada && v.saldo > 0.004 && v.clienteId) m[v.clienteId] = r2_((m[v.clienteId] || 0) + v.saldo); });
  return m;
}
function saldosProveedores_() {
  const m = {};
  rows_('Compras').forEach(c => { if (!c.anulada && c.saldo > 0.004 && c.proveedorId) m[c.proveedorId] = r2_((m[c.proveedorId] || 0) + c.saldo); });
  return m;
}

function bootstrap_(u, d) {
  // Una vez al día: borra las fotos de productos sin movimiento por más de 3 meses
  if (u.rol === 'admin' && config_().sysLimpieza !== hoy_()) { try { lock_(() => limpiarFotos_()); } catch (e) {} }
  const sc = u.rol === 'bodega' ? {} : saldosClientes_();
  const sp = u.rol === 'cajero' ? {} : saldosProveedores_();
  const r = {
    usuario: publico_(u),
    config: config_(),
    usuarios: rows_('Usuarios').map(publico_),
    productos: rows_('Productos'),
    clientes: u.rol === 'bodega' ? [] : rows_('Clientes').map(c => { c.saldo = sc[c.id] || 0; return c; }),
    proveedores: u.rol === 'cajero' ? [] : rows_('Proveedores').map(p => { p.saldo = sp[p.id] || 0; return p; }),
    gastoCats: ['admin','cajero'].indexOf(u.rol) >= 0 ? catalogoGastos_() : [],
    giros: Object.keys(GIROS).map(k => ({ id: k, n: GIROS[k].n, cats: GIROS[k].cats })),
    licencia: licencia_(),
    plus: plus_(),
    negocioId: MULTI_NEGOCIO && NEG ? NEG.id : '',
    multi: MULTI_NEGOCIO,
    version: VERSION
  };
  sinInternos_(r.config);
  if (MULTI_NEGOCIO && NEG && NEG.lic._fila) { try { mSet_('Licencias', NEG.lic._fila, { ultimaConexion: ahora_().replace('T', ' ') }); } catch (e) {} }
  if (d && d.inicio) r.inicio = inicio_(u);
  return r;
}

/* ===================== LICENCIA ===================== */

function licencia_() {
  if (MULTI_NEGOCIO) return NEG ? licNegocio_(NEG.lic) : { estado: 'completa' };
  if (!DIAS_PRUEBA) return { estado: 'completa' };
  const pr = PropertiesService.getScriptProperties();
  if (pr.getProperty('LICENCIA') === 'activa') return { estado: 'completa' };
  let ini = pr.getProperty('PRUEBA_INICIO');
  if (!ini) { ini = String(Date.now()); pr.setProperty('PRUEBA_INICIO', ini); }
  const extra = Number(pr.getProperty('PRUEBA_EXTRA') || 0);
  const vence = Number(ini) + (DIAS_PRUEBA + extra) * 86400000;
  const resta = Math.ceil((vence - Date.now()) / 86400000);
  return { estado: resta > 0 ? 'prueba' : 'vencida', diasRestantes: Math.max(0, resta),
    vence: Utilities.formatDate(new Date(vence), TZ, 'yyyy-MM-dd'), contacto: CONTACTO_WA };
}

// Ejecútala desde el editor (modo un solo negocio) cuando el cliente pague
function activarLicencia() {
  PropertiesService.getScriptProperties().setProperty('LICENCIA', 'activa');
  Logger.log('Sistema activado: licencia completa');
}

// Agrega días a la prueba (modo un solo negocio)
function extenderPrueba(dias) {
  const pr = PropertiesService.getScriptProperties();
  const n = Number(dias) || 7;
  pr.setProperty('PRUEBA_EXTRA', String(Number(pr.getProperty('PRUEBA_EXTRA') || 0) + n));
  Logger.log('Prueba extendida ' + n + ' días');
}

/* ===================== MULTI-NEGOCIO: LICENCIAS Y ACCESOS ===================== */

function master_() { return SpreadsheetApp.getActiveSpreadsheet(); }

function masterSheet_(name) {
  const m = master_();
  let s = m.getSheetByName(name);
  if (!s) {
    s = m.insertSheet(name);
    const h = SCHEMA_M[name];
    s.getRange(1, 1, 1, h.length).setValues([h]).setFontWeight('bold').setBackground('#d10f6f').setFontColor('#ffffff');
    s.setFrozenRows(1);
    h.forEach((k, i) => { if (['whatsapp','id','negocioId','usuarioId','hojaId','registro','ultimaConexion'].indexOf(k) >= 0) s.getRange(2, i + 1, s.getMaxRows() - 1, 1).setNumberFormat('@'); });
    if (name === 'Accesos') { try { s.hideSheet(); } catch (e) {} }
    if (name === 'Licencias') {
      try {
        const regla = SpreadsheetApp.newDataValidation().requireValueInList(['Prueba', 'Activa', 'Vencida', 'Bloqueada'], true).build();
        s.getRange(2, h.indexOf('estado') + 1, s.getMaxRows() - 1, 1).setDataValidation(regla);
        s.getRange(2, h.indexOf('vencePrueba') + 1, s.getMaxRows() - 1, 1).setNumberFormat('yyyy-mm-dd');
      } catch (e) {}
    }
  }
  return s;
}

function mRows_(name) {
  const key = '_m_' + name;
  if (!MEMO[key]) {
    const s = masterSheet_(name), n = s.getLastRow(), h = SCHEMA_M[name];
    MEMO[key] = n < 2 ? [] : s.getRange(2, 1, n - 1, h.length).getValues().map((r, i) => {
      const o = { _fila: i + 2 };
      h.forEach((k, j) => {
        let v = r[j];
        if (v instanceof Date) v = Utilities.formatDate(v, TZ, k === 'vencePrueba' ? 'yyyy-MM-dd' : 'yyyy-MM-dd HH:mm');
        o[k] = (v === null || v === undefined) ? '' : (k === 'activo' ? !(v === false || v === 'false' || v === 'FALSE') : String(v));
      });
      return o;
    }).filter(o => o[h[0]] !== '');
  }
  return MEMO[key];
}

function mSet_(name, fila, campos) {
  const s = masterSheet_(name), h = SCHEMA_M[name];
  Object.keys(campos).forEach(k => { const c = h.indexOf(k); if (c >= 0) s.getRange(fila, c + 1).setValue(campos[k]); });
  delete MEMO['_m_' + name];
}

function mAppend_(name, o) {
  masterSheet_(name).appendRow(SCHEMA_M[name].map(k => (o[k] === undefined || o[k] === null) ? '' : o[k]));
  delete MEMO['_m_' + name];
}

// Normaliza el WhatsApp: solo números y con código de Honduras si vienen 8 dígitos
function waNorm_(w) {
  let d = String(w || '').replace(/\D/g, '');
  if (d.length === 8) d = '504' + d;
  return d;
}

function negocioPorId_(id) {
  const c = CacheService.getScriptCache();
  try { const x = c.get('L_' + id); if (x) return JSON.parse(x); } catch (e) {}
  const l = mRows_('Licencias').find(x => x.id === id) || null;
  if (l) { try { c.put('L_' + id, JSON.stringify(l), 120); } catch (e) {} }
  return l;
}

function setNegocio_(lic) {
  if (!NEG || NEG.id !== lic.id) delete MEMO._ss;
  NEG = { id: lic.id, hojaId: lic.hojaId, lic: lic };
}

function licNegocio_(l) {
  const est = String(l.estado || '').trim().toLowerCase();
  if (est === 'activa') return { estado: 'completa' };
  if (est === 'bloqueada') return { estado: 'bloqueada', contacto: CONTACTO_WA };
  const vence = String(l.vencePrueba || '').slice(0, 10);
  const fin = /^\d{4}-\d{2}-\d{2}$/.test(vence) ? new Date(vence + 'T00:00:00').getTime() : 0;
  const resta = Math.ceil((fin - Date.now()) / 86400000);
  const r = { estado: resta > 0 ? 'prueba' : 'vencida', diasRestantes: Math.max(0, resta), vence: vence, contacto: CONTACTO_WA };
  const debe = r.estado === 'prueba' ? 'Prueba' : 'Vencida';
  if (l.estado !== debe && l._fila) {
    try { mSet_('Licencias', l._fila, { estado: debe }); CacheService.getScriptCache().remove('L_' + l.id); } catch (e) {}
    l.estado = debe;
  }
  return r;
}

function bloquearSiVence_() {
  const lic = licencia_();
  if (lic.estado === 'vencida' || lic.estado === 'bloqueada') {
    throw new Error('PRUEBA_VENCIDA|' + JSON.stringify({ contacto: CONTACTO_WA, nombre: NEG ? NEG.lic.negocio : '', tipo: lic.estado }));
  }
}

function loginMulti_(d) {
  const c = CacheService.getScriptCache(), wa = waNorm_(d.whatsapp), kf = 'F_' + wa;
  const fallos = Number(c.get(kf) || 0);
  if (fallos >= 5) throw new Error('Demasiados intentos fallidos. Espera 10 minutos.');
  const falla = () => { c.put(kf, String(fallos + 1), 600); return new Error('WhatsApp o PIN incorrectos'); };
  const acc = mRows_('Accesos').find(x => String(x.whatsapp) === wa && x.activo);
  if (!acc) throw falla();
  const lic = negocioPorId_(acc.negocioId);
  if (!lic) throw falla();
  setNegocio_(lic);
  const u = rows_('Usuarios').find(x => x.id === acc.usuarioId);
  if (!u || !u.activo || hash_(String(d.pin || ''), u.salt) !== u.hash) throw falla();
  c.remove(kf);
  bloquearSiVence_();
  return { token: nuevoToken_(lic.id + '|' + u.id), usuario: publico_(u) };
}

function carpeta_() {
  const it = DriveApp.getFoldersByName(CARPETA_DATOS);
  return it.hasNext() ? it.next() : DriveApp.createFolder(CARPETA_DATOS);
}

function registrar_(d) {
  if (!MULTI_NEGOCIO) throw new Error('Acción no válida');
  const negocio = txt_(d.negocio, 60), nombre = txt_(d.nombre, 60);
  const giro = GIROS[d.giro] ? d.giro : 'otro';
  const wa = waNorm_(d.whatsapp), pin = String(d.pin || '');
  if (!negocio) throw new Error('Escribe el nombre de tu negocio');
  if (!nombre) throw new Error('Escribe tu nombre');
  if (wa.length < 10) throw new Error('Escribe tu número de WhatsApp');
  if (!/^\d{4,6}$/.test(pin)) throw new Error('El PIN debe tener de 4 a 6 números');
  const lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    if (mRows_('Accesos').some(x => String(x.whatsapp) === wa)) throw new Error('Ese WhatsApp ya tiene una cuenta. Toca «Ya tengo cuenta» para ingresar.');
    const libro = SpreadsheetApp.create('Negocio – ' + negocio);
    try { DriveApp.getFileById(libro.getId()).moveTo(carpeta_()); } catch (e) {}
    const id = 'N' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 1296).toString(36).toUpperCase();
    const ahora = ahora_().replace('T', ' ');
    const lic = { id: id, negocio: negocio, giro: GIROS[giro].n, dueno: nombre, whatsapp: wa, registro: ahora,
      vencePrueba: Utilities.formatDate(new Date(Date.now() + DIAS_PRUEBA * 86400000), TZ, 'yyyy-MM-dd'),
      estado: 'Prueba', usuarios: 1, ultimaConexion: ahora, hojaId: libro.getId() };
    mAppend_('Licencias', lic);
    NEG = { id: id, hojaId: libro.getId(), lic: lic };
    MEMO._ss = libro;
    instalarNegocio_({ nombre: negocio, giro: giro, telefono: wa.length === 11 && wa.indexOf('504') === 0 ? wa.slice(3, 7) + '-' + wa.slice(7) : wa,
      admin: { usuario: wa, nombre: nombre, pin: pin } });
    const adm = rows_('Usuarios').find(x => x.usuario === wa);
    mAppend_('Accesos', { whatsapp: wa, negocioId: id, usuarioId: adm.id, activo: true });
    return { token: nuevoToken_(id + '|' + adm.id), usuario: publico_(adm) };
  } finally { lock.releaseLock(); }
}

/* ===================== CATÁLOGOS (productos, clientes, proveedores) ===================== */

function guardar_(u, d) {
  const ent = d.entidad;
  if (ent === 'Config') {
    req_(u, ['admin']);
    const reg = {};
    Object.keys(d.registro || {}).forEach(k => { if (CONFIG_EDITABLE.indexOf(k) >= 0) reg[k] = String(d.registro[k]); });
    if (reg.nombre !== undefined && !txt_(reg.nombre)) throw new Error('Escribe el nombre del negocio');
    if (reg.isv !== undefined && !(Number(reg.isv) >= 0 && Number(reg.isv) < 1)) throw new Error('ISV no válido');
    if (reg.tienda === 'si' && !plus_()) throw new Error('La tienda en línea es parte del plan Plus');
    const c = guardarConfig_(reg);
    if (MULTI_NEGOCIO && NEG && NEG.lic._fila && reg.nombre) { try { mSet_('Licencias', NEG.lic._fila, { negocio: txt_(reg.nombre, 60) }); CacheService.getScriptCache().remove('L_' + NEG.id); } catch (e) {} }
    return sinInternos_(c);
  }
  if (!ESCRITURA[ent]) throw new Error('Entidad no válida');
  req_(u, ESCRITURA[ent]);
  const r = Object.assign({}, d.registro || {});
  const prev = r.id ? rows_(ent).find(x => x.id === r.id) : null;
  if (r.id && !prev) throw new Error('El registro ya no existe');
  if (r.nombre !== undefined) r.nombre = txt_(r.nombre, 80);
  if (!prev && !r.nombre) throw new Error('El nombre es obligatorio');
  if (!prev) { r.creado = ahora_(); if (r.activo === undefined) r.activo = true; }
  if (ent === 'Productos') {
    if (r.codigo !== undefined) r.codigo = txt_(r.codigo, 40);
    if (r.codigo && rows_('Productos').some(p => p.codigo && String(p.codigo).toLowerCase() === r.codigo.toLowerCase() && p.id !== r.id)) throw new Error('Ya existe un producto con ese código');
    if (r.categoria !== undefined) r.categoria = txt_(r.categoria, 40) || 'General';
    if (!prev && !r.categoria) r.categoria = 'General';
    if (r.tipo !== undefined && ['producto','servicio'].indexOf(r.tipo) < 0) r.tipo = 'producto';
    if (!prev && !r.tipo) r.tipo = 'producto';
    ['precio','costo','stockMin','margen'].forEach(k => { if (r[k] !== undefined) { r[k] = r2_(r[k]); if (r[k] < 0) throw new Error('Los montos no pueden ser negativos'); } });
    if (r.tasaIsv !== undefined && ['', '0', '15', '18'].indexOf(String(r.tasaIsv)) < 0) r.tasaIsv = '';
    delete r.isv;
    if (r.foto && String(r.foto).length > 60000) throw new Error('La foto es muy pesada');
    if (r.foto && (!prev || r.foto !== prev.foto)) { if (!plus_()) throw new Error('Las fotos de productos son parte del plan Plus'); r.fotoFecha = ahora_(); }
    if (r.foto === '') r.fotoFecha = '';
    // Las existencias solo cambian con compras, ventas y ajustes (queda registrado)
    const stockIni = r.stock;
    delete r.stock;
    if (!prev) r.stock = 0;
    if (r.tienda === undefined && !prev) r.tienda = true;
    // Unificar la categoría con las existentes (evita "Bebidas" y "bebidas")
    if (r.categoria) { const ex = rows_('Productos').find(p => p.categoria.toLowerCase() === r.categoria.toLowerCase()); if (ex) r.categoria = ex.categoria; }
    if (prev && prev.foto && r.foto !== undefined && r.foto !== prev.foto) borrarFoto_(prev.foto);
    const g = upsert_('Productos', r);
    if (!prev && g.tipo === 'producto' && Number(stockIni) > 0) {
      moverStock_({ [g.id]: r3_(stockIni) }, 'inicial', '', u, 'Existencia inicial');
      return rows_('Productos').find(p => p.id === g.id);
    }
    return g;
  }
  if (ent === 'Clientes') {
    if (r.limite !== undefined) r.limite = Math.max(0, r2_(r.limite));
    if (r.telefono !== undefined) r.telefono = txt_(r.telefono, 30);
    if (r.telefono && rows_('Clientes').some(c => c.id !== r.id && tel8_(c.telefono) && tel8_(c.telefono) === tel8_(r.telefono))) throw new Error('Ya hay un cliente con ese teléfono');
    const g = upsert_('Clientes', r);
    g.saldo = saldosClientes_()[g.id] || 0;
    return g;
  }
  if (ent === 'Proveedores') {
    const g = upsert_('Proveedores', r);
    g.saldo = saldosProveedores_()[g.id] || 0;
    return g;
  }
}

function eliminar_(u, d) {
  req_(u, ['admin']);
  const ent = d.entidad;
  if (['Productos','Clientes','Proveedores'].indexOf(ent) < 0) throw new Error('No se puede eliminar este tipo de registro');
  // Si ya tiene movimientos, se desactiva en lugar de borrarse (para no perder la historia)
  let usado = false;
  if (ent === 'Productos') usado = rows_('VentaDetalle').some(x => x.productoId === d.id) || rows_('CompraDetalle').some(x => x.productoId === d.id);
  if (ent === 'Clientes') usado = rows_('Ventas').some(x => x.clienteId === d.id) || rows_('Abonos').some(x => x.clienteId === d.id);
  if (ent === 'Proveedores') usado = rows_('Compras').some(x => x.proveedorId === d.id) || rows_('Pagos').some(x => x.proveedorId === d.id);
  if (usado) { upsert_(ent, { id: d.id, activo: false }); return { desactivado: true }; }
  if (ent === 'Productos') { const p = rows_('Productos').find(x => x.id === d.id); if (p && p.foto) borrarFoto_(p.foto); }
  deleteRow_(ent, d.id);
  return { eliminado: true };
}

function cargarEjemplos_(u, d) {
  req_(u, ['admin']);
  const cfg = config_();
  const g = GIROS[d.giro] || GIROS[cfg.giro] || GIROS.otro;
  const existentes = rows_('Productos').map(p => p.nombre.toLowerCase());
  let n = 0;
  g.ej.forEach((x, i) => {
    if (existentes.indexOf(x[0].toLowerCase()) >= 0) return;
    const p = upsert_('Productos', { codigo: 'EJ' + String(i + 1).padStart(3, '0'), nombre: x[0], categoria: x[1], icono: x[2], precio: x[3], costo: x[4],
      tipo: x[5] > 0 ? 'producto' : 'servicio', unidad: 'unidad', stock: 0, stockMin: x[5] > 0 ? Math.max(1, Math.round(x[5] / 5)) : 0,
      tasaIsv: '', foto: '', descripcion: '', tienda: true, activo: true, creado: ahora_() });
    if (p.tipo === 'producto' && x[5] > 0) moverStock_({ [p.id]: x[5] }, 'inicial', '', u, 'Existencia inicial (ejemplo)');
    n++;
  });
  return { agregados: n, productos: rows_('Productos') };
}

function carpetaFotos_() {
  const nombre = MULTI_NEGOCIO && NEG ? 'Fotos – ' + NEG.lic.negocio + ' (' + NEG.id + ')' : 'Gestión de Negocio VM – Fotos';
  const it = DriveApp.getFoldersByName(nombre);
  return it.hasNext() ? it.next() : DriveApp.createFolder(nombre);
